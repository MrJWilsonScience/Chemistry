function parse(f){const tok=f.match(/[A-Z][a-z]?|\d+|\(|\)/g),st=[{}];let i=0;
  const merge=(a,b,k)=>{for(const x in b)a[x]=(a[x]||0)+b[x]*k;};

const gfmWork=f=>Object.entries(parse(f)).map(([e,k])=>k>1?`(${k} × ${fR(e)})`:`${fR(e)}`).join(" + ")+` = ${sf(gfm(f),4)} g`;

/* ---------- molecule model ---------- */
function Mol(){this.atoms=[];this.bonds=[]}
Mol.prototype.add=function(el,x,y,p){this.atoms.push(Object.assign({el,x,y},p||{}));return this.atoms.length-1};
Mol.prototype.bond=function(a,b,o=1){this.bonds.push({a,b,o})};
const clone=m=>Object.assign(new Mol(),JSON.parse(JSON.stringify(m)));
const VAL={C:4,N:3,O:2,S:2};
const nbrs=(m,i)=>m.bonds.filter(b=>b.a===i||b.b===i).map(b=>({j:b.a===i?b.b:b.a,o:b.o}));
function hCount(m,i){const a=m.atoms[i];if(!VAL[a.el])return 0;let o=0;m.bonds.forEach(b=>{if(b.a===i||b.b===i)o+=b.o});return Math.max(0,VAL[a.el]-o+(a.chg||0))}
function mrOf(m){const W={C:12,O:16,N:14,S:32.1};let t=0;m.atoms.forEach((a,i)=>{t+=(W[a.el]||0)+hCount(m,i)});return t}
function formulaOf(m){const c={C:0,H:0,N:0,O:0,S:0};m.atoms.forEach((a,i)=>{if(c[a.el]!==undefined)c[a.el]++;c.H+=hCount(m,i)});
  return["C","H","N","O","S"].filter(e=>c[e]).map(e=>e+(c[e]>1?c[e]:"")).join("")}

/* svg text with sub/superscripts */
function svgText(s){let out="",off=0,i=0;const emit=(t,dy,fs)=>{out+=`<tspan dy="${dy}"${fs?` font-size="${fs}"`:""}>${t}</tspan>`};
  const isSub=j=>/\d/.test(s[j])&&j>0&&/[A-Za-z\)]/.test(s[j-1]);
  while(i<s.length){
    if(s.startsWith("^{",i)){const j=s.indexOf("}",i);emit(s.slice(i+2,j),-10-off,16);off=-10;i=j+1;continue}
    if(isSub(i)){let j=i;while(/\d/.test(s[j]||""))j++;emit(s.slice(i,j),6-off,16);off=6;i=j;continue}
    let j=i;while(j<s.length&&!s.startsWith("^{",j)&&!isSub(j))j++;emit(s.slice(i,j),-off);off=0;i=j}
  return out}
const textW=s=>{let w=0,i=0;const isSub=j=>/\d/.test(s[j])&&j>0&&/[A-Za-z\)]/.test(s[j-1]);
  while(i<s.length){if(s.startsWith("^{",i)){const j=s.indexOf("}",i);w+=(j-i-2)*10;i=j+1}else{w+=isSub(i)?10:/[ ]/.test(s[i])?7:15;i++}}return w};

/* draw one molecule; returns svg body + bbox */
function render(m,o){
  const full=o.full!==false,showH=o.showH!==false,UX=full?70:92,UY=70,A=m.atoms,lab=[],wid=[],skip=new Set();
  A.forEach((a,i)=>{const ns=nbrs(m,i),h=hCount(m,i);
    if(a.lab)lab[i]=a.lab;else if(full)lab[i]=a.el;
    else{const cn=ns.filter(n=>A[n.j].el==="C"),right=cn.length&&A[cn[0].j].x>a.x+.1;
      if(a.fg==="acid"){ns.filter(n=>A[n.j].el==="O").forEach(n=>skip.add(n.j));lab[i]=!cn.length?"HCOOH":right?"HOOC":"COOH"}
      else if(a.fg==="ald"){ns.filter(n=>A[n.j].el==="O").forEach(n=>skip.add(n.j));lab[i]=!cn.length?"HCHO":right?"OHC":"CHO"}
      else{const Hs=h?"H"+(h>1?h:""):"";const lead=ns.length===1&&A[ns[0].j].x>a.x+.1&&Math.abs(A[ns[0].j].y-a.y)<.1;lab[i]=lead?Hs+a.el:a.el+Hs}}
    wid[i]=Math.max(18,textW(lab[i]))});
  const ko=A.map((a,i)=>{const L=lab[i];if(!L||skip.has(i)||L===a.el)return 0;const nh=nbrs(m,i).filter(n=>!skip.has(n.j)).length;if(nh<1)return 0;
    if(nh>1){const ns2=nbrs(m,i).filter(n=>!skip.has(n.j));if(ns2.every(n=>Math.abs(A[n.j].y-a.y)<.1))return 0;}
    const ew=textW(a.el);if(L.startsWith(a.el))return -(wid[i]-ew)/2;if(L.endsWith(a.el))return (wid[i]-ew)/2;return 0});
  const ext=(i,ux)=>ux>0?wid[i]/2-ko[i]:ux<0?wid[i]/2+ko[i]:wid[i]/2;
  let s="";const pts=[];
  m.bonds.forEach(b=>{if(skip.has(b.a)||skip.has(b.b))return;const P=A[b.a],Q=A[b.b];
    const x1=P.x*UX,y1=P.y*UY,x2=Q.x*UX,y2=Q.y*UY,L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L;
    const t1=Math.abs(ux)*(ext(b.a,ux)+5)+Math.abs(uy)*15,t2=Math.abs(ux)*(ext(b.b,-ux)+5)+Math.abs(uy)*15;
    const ax=x1+ux*t1,ay=y1+uy*t1,bx=x2-ux*t2,by=y2-uy*t2;
    (b.o===2?[-4,4]:b.o===3?[-6,0,6]:[0]).forEach(k=>s+=`<line x1="${ax-uy*k}" y1="${ay+ux*k}" x2="${bx-uy*k}" y2="${by+ux*k}" class="bd"/>`)});
  if(full)A.forEach((a,i)=>{const h=hCount(m,i);if(!h||a.lab)return;const ns=nbrs(m,i);
    const used=new Set(ns.map(n=>Math.sign(A[n.j].x-a.x)+","+Math.sign(A[n.j].y-a.y)));
    if(a.hd){a.hd.slice(0,h).forEach(([dx,dy])=>{if(!showH)return;const x=a.x*UX,y=a.y*UY,L=UY*.56;pts.push([x+dx*L,y+dy*L]);
      s+=`<line x1="${x+dx*14}" y1="${y+dy*14}" x2="${x+dx*(L-11)}" y2="${y+dy*(L-11)}" class="hb"/><text x="${x+dx*L}" y="${y+dy*L}" class="hh">H</text>`});return}
    const dirs=[[0,-1],[0,1],[-1,0],[1,0]];if(a.el!=="C"&&ns.length){const p=A[ns[0].j];dirs.unshift([-Math.sign(p.x-a.x),-Math.sign(p.y-a.y)])}
    const free=[];dirs.forEach(d=>{const k=d+"";if(used.has(k)||free.some(f=>f+""===k))return;
      if(A.some(b=>b!==a&&Math.abs(b.x-(a.x+d[0]*.6))<.55&&Math.abs(b.y-(a.y+d[1]*.6))<.55))return;free.push(d)});
    free.slice(0,h).forEach(([dx,dy])=>{if(!showH)return;const x=a.x*UX,y=a.y*UY,L=UY*.56;pts.push([x+dx*L,y+dy*L]);
      s+=`<line x1="${x+dx*14}" y1="${y+dy*14}" x2="${x+dx*(L-11)}" y2="${y+dy*(L-11)}" class="hb"/><text x="${x+dx*L}" y="${y+dy*L}" class="hh">H</text>`})});
  (o.boxes||[]).forEach(([x0,y0,x1,y1])=>s+=`<rect x="${x0*UX}" y="${y0*UY}" width="${(x1-x0)*UX}" height="${(y1-y0)*UY}" rx="10" class="box"/>`);
  (o.hl||[]).forEach(i=>{const a=A[i];s+=`<ellipse cx="${a.x*UX-ko[i]}" cy="${a.y*UY}" rx="${wid[i]/2+11}" ry="21" class="ring"/>`});
  A.forEach((a,i)=>{if(skip.has(i))return;pts.push([a.x*UX-ko[i]-wid[i]/2,a.y*UY],[a.x*UX-ko[i]+wid[i]/2,a.y*UY]);
    s+=`<text x="${a.x*UX-ko[i]}" y="${a.y*UY}" class="lb">${svgText(lab[i])}</text>`});
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),P=26;
  return{body:s,minx:Math.min(...xs)-P,maxx:Math.max(...xs)+P,miny:Math.min(...ys)-P-10,maxy:Math.max(...ys)+P+10}}

/* lay several molecules / operators out in a row */
function compose(items,o){let x=0,parts=[],miny=-70,maxy=70;
  items.forEach(it=>{if(typeof it==="string"){const w=textW(it)+44;parts.push(`<text x="${x+w/2}" y="0" class="lb op">${svgText(it)}</text>`);x+=w;return}
    const r=render(it,Object.assign({},o,it.opts||{}));parts.push(`<g transform="translate(${x-r.minx},0)">${r.body}</g>`);
    x+=r.maxx-r.minx;miny=Math.min(miny,r.miny);maxy=Math.max(maxy,r.maxy)});
  return`<div class="molwrap"><svg class="mol" viewBox="0 ${miny} ${x} ${maxy-miny}" style="aspect-ratio:${x}/${maxy-miny};max-width:${Math.round(x*1.15)}px;margin:0 auto" role="img" aria-label="Structural formula">${parts.join("")}</svg></div>`}

/* ---------- systematic naming (main chain up to 8) ---------- */
const PRE=["","meth","eth","prop","but","pent","hex","hept","oct"],MULT=["","","di","tri","tetra","penta","hexa"];
function nameOf(m){const A=m.atoms,C=A.map((a,i)=>a.el==="C"?i:-1).filter(i=>i>=0),adj={};C.forEach(i=>adj[i]=[]);
  m.bonds.forEach(b=>{if(A[b.a].el==="C"&&A[b.b].el==="C"){adj[b.a].push(b.b);adj[b.b].push(b.a)}});
  const R=C.filter(i=>A[i].fg),terms=C.filter(i=>adj[i].length<=1);
  const path=(s,t)=>{const par={};par[s]=-1;const q=[s];while(q.length){const u=q.shift();for(const v of adj[u])if(!(v in par)){par[v]=u;q.push(v)}}
    const p=[];let x=t;while(x!==-1){p.push(x);x=par[x]}return p.reverse()};
  let cands=C.length===1?[[C[0]]]:[];for(const s of terms)for(const t of terms)if(s!==t)cands.push(path(s,t));
  cands=cands.filter(p=>R.every(r=>p.includes(r)));if(!cands.length)return null;
  const L=Math.max(...cands.map(p=>p.length));if(L>8)return null;cands=cands.filter(p=>p.length===L);
  const size=(n,f,S)=>{let c=1;for(const v of adj[n])if(v!==f&&!S.has(v))c+=size(v,n,S);return c};
  const HALN={F:"fluoro",Cl:"chloro",Br:"bromo",I:"iodo"};
  const info=cands.map(p=>{const S=new Set(p),subs=[];p.forEach((a,k)=>{adj[a].forEach(nb=>{if(!S.has(nb)){const z=size(nb,a,S);subs.push({loc:k+1,size:z,nm:["","methyl","ethyl","propyl"][z]||"x"})}});
      m.bonds.forEach(b=>{const o=b.a===a?b.b:b.b===a?b.a:-1;if(o>=0&&HALN[A[o].el])subs.push({loc:k+1,size:0,nm:HALN[A[o].el]})})});
    return{subs,fl:R.map(r=>p.indexOf(r)+1).sort((x,y)=>x-y),locs:subs.map(s=>s.loc).sort((x,y)=>x-y),
      cite:[...subs].sort((x,y)=>x.nm<y.nm?-1:x.nm>y.nm?1:x.loc-y.loc).map(s=>s.loc)}});
  const mx=Math.max(...info.map(i=>i.subs.length)),lex=(a,b)=>{for(let i=0;i<a.length;i++)if(a[i]!==b[i])return a[i]-b[i];return 0};
  const best=info.filter(i=>i.subs.length===mx).sort((a,b)=>lex(a.fl,b.fl)||lex(a.locs,b.locs)||lex(a.cite,b.cite))[0];
  if(best.subs.some(s=>s.size>3))return null;
  const g={};best.subs.forEach(s=>{const k=s.nm;(g[k]=g[k]||[]).push(s.loc)});
  const pre=Object.keys(g).sort().map(k=>g[k].sort((x,y)=>x-y).join(",")+"-"+MULT[g[k].length]+k).join("-");
  const st=PRE[L],fl=best.fl,f=m.fam;
  if(f==="alkane")return pre+st+"ane";
  if(f==="alkene")return pre+(L===2?"ethene":L===3?"propene":st+"-"+fl[0]+"-ene");
  if(f==="alcohol")return pre+(L<=2?st+"anol":st+"an-"+fl[0]+"-ol");
  if(f==="aldehyde")return fl[0]===1?pre+st+"anal":null;
  if(f==="acid")return fl[0]===1?pre+st+"anoic acid":null;
  if(f==="ketone"){if(!pre&&L===3)return"propanone";if(!pre&&L===4)return"butanone";return pre+st+"an-"+fl[0]+"-one"}
  return null}

/* random alcohol (optionally of a set class) */
function buildAlc(cls){
  for(let t=0;t<5000;t++){const n=rnd(1,6),p=rnd(0,n-1),m=new Mol(),occ={"-1":{},"1":{}},used=[];
    for(let i=0;i<n;i++){m.add("C",i,0);used.push((i>0)+(i<n-1));if(i)m.bond(i-1,i)}
    const side=q=>{const s=shuffle([-1,1]).find(s=>!occ[s][q]&&!occ[s][q-1]&&!occ[s][q+1]);if(s!==undefined)occ[s][q]=1;return s};
    let O;if(n===1||p===0)O=m.add("O",-1,0);else if(p===n-1)O=m.add("O",n,0);else O=m.add("O",p,side(p));
    m.bond(p,O);used[p]++;m.atoms[p].fg="oh";
    let tot=n;const want=cls==="tertiary"?rnd(1,3):rnd(0,3);
    for(let b=0;b<want;b++){const sz=Math.random()<.6?1:2;if(n<3||tot+sz>8)continue;const q=(cls==="tertiary"&&b===0&&p>0&&p<n-1)?p:rnd(1,n-2);
      if(used[q]>=4)continue;const s=side(q);if(s===undefined)continue;used[q]++;tot+=sz;let prev=q;
      for(let j=1;j<=sz;j++){const c=m.add("C",q,s*j);m.bond(prev,c);prev=c}}
    m.fam="alcohol";const nm=nameOf(m);if(!nm)continue;m.name=nm;
    const k=m.bonds.filter(b=>(b.a===p||b.b===p)&&m.atoms[b.a===p?b.b:b.a].el==="C").length;
    m.cls=k<=1?"primary":k===2?"secondary":"tertiary";m.ohC=p;m.O=O;
    if(cls&&m.cls!==cls)continue;return m}}
/* oxidise an alcohol to aldehyde / acid / ketone */
function oxid(m,to){const r=clone(m),c=r.ohC,a=r.atoms[c];
  if(to==="acid"){const s=shuffle([-1,1]).find(s=>!r.atoms.some(b=>Math.abs(b.y-s)<.1&&Math.abs(b.x-a.x)<1.1));if(s===undefined)return null;
    const o=r.add("O",a.x,s);r.bond(c,o,2);a.fg="acid";r.fam="acid"}
  else{r.bonds.find(b=>(b.a===c&&b.b===r.O)||(b.b===c&&b.a===r.O)).o=2;a.fg=to==="ketone"?"co":"ald";r.fam=to==="ketone"?"ketone":"aldehyde"}
  r.name=nameOf(r);return r.name?r:null}

/* simple straight-chain builder: oh positions (1-based), ket, ald, acid, branches [[pos,size,side]] */
function spec(n,o={}){const m=new Mol();for(let i=0;i<n;i++){m.add("C",i,0);if(i)m.bond(i-1,i)}
  (o.oh||[]).forEach(q=>{const p=q-1;let O;if(p===0)O=m.add("O",-1,0);else if(p===n-1)O=m.add("O",n,0);else O=m.add("O",p,-1);m.bond(p,O);m.atoms[p].fg="oh"});
  if(o.ket){const p=o.ket-1,O=m.add("O",p,-1);m.bond(p,O,2);m.atoms[p].fg="co"}
  if(o.ald){const O=m.add("O",-1,0);m.bond(0,O,2);m.atoms[0].fg="ald"}
  if(o.acid){const O1=m.add("O",0,-1);m.bond(0,O1,2);const O2=m.add("O",-1,0);m.bond(0,O2);m.atoms[0].fg="acid"}
  (o.br||[]).forEach(([q,sz,s])=>{let prev=q-1;for(let j=1;j<=sz;j++){const c=m.add("C",q-1,s*j);m.bond(prev,c);prev=c}});
  return m}

/* ring (cycloalkane) with outward H directions */
function ringMol(n){const m=new Mol(),Rr=1.15/(2*Math.sin(Math.PI/n));
  for(let i=0;i<n;i++){const a=-Math.PI/2+Math.PI/n+2*Math.PI*i/n;m.add("C",Rr*Math.cos(a),Rr*Math.sin(a),{hd:[[Math.cos(a-.5),Math.sin(a-.5)],[Math.cos(a+.5),Math.sin(a+.5)]]})}
  for(let i=0;i<n;i++)m.bond(i,(i+1)%n);m.name="cyclo"+PRE[n]+"ane";m.fam="cycloalkane";return m}
/* random alkane / alkene with straight branches; main chain up to 8 */
function buildHC(fam,o={}){
  for(let t=0;t<5000;t++){const n=rnd(o.min||(fam==="alkene"?2:1),o.max||7),m=new Mol(),occ={"-1":{},"1":{}},used=[];
    for(let i=0;i<n;i++){m.add("C",i,0);used.push((i>0)+(i<n-1));if(i)m.bond(i-1,i)}
    let d=-1;if(fam==="alkene"){d=rnd(0,n-2);m.bonds[d].o=2;used[d]++;used[d+1]++;m.atoms[d].fg="ene";m.atoms[d+1].fg="ene"}
    const side=q=>{const s=shuffle([-1,1]).find(s=>!occ[s][q]&&!occ[s][q-1]&&!occ[s][q+1]);if(s!==undefined)occ[s][q]=1;return s};
    const want=o.branches!==undefined?o.branches:rnd(0,2);let tot=n;
    for(let b=0;b<want;b++){const sz=Math.random()<.7?1:2;if(n<3||tot+sz>(o.maxC||8))continue;const q=rnd(1,n-2);if(used[q]>=4)continue;const s=side(q);if(s===undefined)continue;
      used[q]++;tot+=sz;let prev=q;for(let j=1;j<=sz;j++){const c=m.add("C",q,s*j);m.bond(prev,c);prev=c}}
    m.fam=fam;const nm=nameOf(m);if(!nm)continue;m.name=nm;m.dbl=d;return m}}

const T={};
const MOL=(items,o)=>compose(items,o);
const ans=(rows)=>rows.map(r=>`<p>${r}</p>`).join("");

/* ===== Oxidation of alcohols ===== */
T.oxidation={group:"Organic",title:"Oxidation",organic:true,
  intro:"Oxidising alcohols and aldehydes, and the tests that tell aldehydes and ketones apart.",
  modes:[["product","Predict the product"],["alcohol","Identify the alcohol"],["test","Predict the test result"],["which","Which is the aldehyde?"]],
  gen(mode){
    if(mode==="product"){const cls=pick(["primary","primary","secondary","tertiary"]);let m=buildAlc(cls),ald=null,acid=null,ket=null;
      if(cls==="primary"){ald=oxid(m,"ald");acid=oxid(m,"acid");if(!ald||!acid)return this.gen(mode)}
      if(cls==="secondary")ket=oxid(m,"ketone");return{m,ald,acid,ket,cls}}
    if(mode==="alcohol"){const cls=pick(["primary","secondary"]);const m=buildAlc(cls);
      const p=cls==="secondary"?oxid(m,"ketone"):oxid(m,pick(["ald","acid"]));if(!p)return this.gen(mode);return{m,p}}
    if(mode==="test"){const kind=pick(["aldehyde","ketone","primary","secondary","tertiary"]);
      const reag=kind==="aldehyde"||kind==="ketone"?pick(["dichromate","fehling","tollens"]):"dichromate";
      let m=kind==="aldehyde"?oxid(buildAlc("primary"),"ald"):kind==="ketone"?oxid(buildAlc("secondary"),"ketone"):buildAlc(kind);
      if(!m)return this.gen(mode);return{m,kind,reag}}
    const n=rnd(3,6),ald=spec(n,{ald:true}),ket=spec(n,{ket:2});ald.name=PRE[n]+"anal";ket.name=n===3?"propanone":n===4?"butanone":PRE[n]+"an-2-one";
    return{ald,ket,aFirst:Math.random()<.5,reag:pick(["dichromate","fehling","tollens"])}},
  view(d,o){const R={dichromate:"acidified potassium dichromate solution",fehling:"Fehling's solution",tollens:"Tollens' reagent"};
    const POS={dichromate:"changes from orange to green",fehling:"changes from blue to a brick-red precipitate",tollens:"forms a silver mirror"};
    const NEG={dichromate:"stays orange",fehling:"stays blue",tollens:"shows no silver mirror"};
    if(d.mode==="product"){const q=`<p>This alcohol is warmed with acidified potassium dichromate solution. Is it a primary, secondary or tertiary alcohol, and what is the oxidation product?</p>`+MOL([d.m],o);
      let a=`<p><b>${d.m.name}</b> is a <b>${d.cls}</b> alcohol.</p>`;
      if(d.cls==="primary")a+=`<p>It is oxidised to the aldehyde <b>${d.ald.name}</b>, which can be further oxidised to the carboxylic acid <b>${d.acid.name}</b>. The dichromate changes from orange to green.</p>`+MOL([d.m,"→",d.ald,"→",d.acid],o);
      else if(d.cls==="secondary")a+=`<p>It is oxidised to the ketone <b>${d.ket.name}</b>. The dichromate changes from orange to green.</p>`+MOL([d.m,"→",d.ket],o);
      else a+=`<p>Tertiary alcohols are <b>not oxidised</b> by acidified dichromate, so the solution stays orange.</p>`;return{q,a}}
    if(d.mode==="alcohol"){const t=d.p.fam==="ketone"?"ketone":d.p.fam==="aldehyde"?"aldehyde":"carboxylic acid";
      return{q:`<p>This compound was made by oxidising an alcohol. Name and draw the alcohol.</p>`+MOL([d.p],o),
      a:`<p>The product is the ${t} <b>${d.p.name}</b>. It was made from the <b>${d.m.cls}</b> alcohol <b>${d.m.name}</b>.</p>`+MOL([d.m,"→",d.p],o)+
        `<p>${d.p.fam==="ketone"?"Secondary alcohols oxidise to ketones.":"Primary alcohols oxidise to aldehydes, then to carboxylic acids."}</p>`}}
    if(d.mode==="test"){const pos=d.kind==="aldehyde"||((d.kind==="primary"||d.kind==="secondary")&&d.reag==="dichromate");
      const what={aldehyde:"an aldehyde",ketone:"a ketone",primary:"a primary alcohol",secondary:"a secondary alcohol",tertiary:"a tertiary alcohol"}[d.kind];
      const why=pos?(d.kind==="aldehyde"?"Aldehydes are oxidised (to carboxylic acids), so the reagent is reduced.":"Primary and secondary alcohols are oxidised by acidified dichromate.")
        :(d.kind==="ketone"?"Ketones are not oxidised by these mild oxidising agents.":"Tertiary alcohols are not oxidised.");
      return{q:`<p>What would you observe when this compound is warmed with <b>${R[d.reag]}</b>?</p>`+MOL([d.m],o),

function acidMol(a){const m=new Mol();for(let i=0;i<a;i++){m.add("C",i,0);if(i)m.bond(i-1,i)}const O1=m.add("O",a-1,-1);m.bond(a-1,O1,2);const O2=m.add("O",a,0);m.bond(a-1,O2);m.atoms[a-1].fg="acid";m.name=PRE[a]+"anoic acid";return m}

const HC={C:[-394,"carbon","C(s)"],H2:[-286,"hydrogen","H2(g)"],CH4:[-891,"methane"],C2H6:[-1561,"ethane"],C3H8:[-2220,"propane"],C4H10:[-2878,"butane"],
 C2H4:[-1411,"ethene"],C2H2:[-1300,"ethyne"],CH3OH:[-726,"methanol"],C2H5OH:[-1367,"ethanol"],C3H7OH:[-2021,"propan-1-ol"],HCOOH:[-254,"methanoic acid"],CH3COOH:[-874,"ethanoic acid"]};
const atomsOf=f=>{const c={C:0,H:0,O:0};f.replace(/([A-Z])(\d*)/g,(_,e,n)=>{c[e]+=+(n||1)});return c};
const sg=x=>(x>0?"+":"")+fx(x,0);
function hessRxn(){if(Math.random()<.65){const f=pick(["CH4","C2H6","C3H8","C4H10","C2H4","C2H2","CH3OH","C2H5OH","C3H7OH","HCOOH","CH3COOH"]),a=atomsOf(f);
    const t=[[a.C,"C"],[a.H/2,"H2"],[-1,f]];return{eq:`${cf(a.C)}C(s) + ${cf(a.H/2)}H2(g)${a.O?" + "+cf(a.O/2)+"O2(g)":""} → ${f}(${f.includes("OH")?"l":"g"})`,what:`the formation of ${HC[f][1]}`,t}}
  const [e,k]=pick([["C2H4","C2H6"],["C2H2","C2H4"]]);return{eq:`${e}(g) + H2(g) → ${k}(g)`,what:`the hydrogenation of ${HC[e][1]}`,t:[[1,e],[1,"H2"],[-1,k]]}}
const combEq=f=>{if(f==="C")return"C(s) + O2(g) → CO2(g)";if(f==="H2")return"H2(g) + ½O2(g) → H2O(l)";const a=atomsOf(f),o2=a.C+a.H/4-a.O/2;return`${f} + ${cf(o2)}O2 → ${cf(a.C)}CO2 + ${cf(a.H/2)}H2O`};
const revEq=f=>{const [l,r]=combEq(f).split(" → ");return r+" → "+l};
T.hess={group:"Energy",title:"Hess's law",intro:"Calculating enthalpy changes from enthalpies of combustion.",
  modes:[["dh","Find ΔH for the reaction"],["comb","Find an enthalpy of combustion"]],
  gen(mode){const r=hessRxn();if(mode==="comb")r.x=pick(r.t.filter(([,f])=>f!=="C"&&f!=="H2"||Math.random()<.3))[1];return r},
  view(d){const dh=d.t.reduce((s,[k,f])=>s+k*HC[f][0],0);
    const lines=d.t.map(([k,f])=>{const v=k*HC[f][0];return k>0?`${cf(k)?cf(k)+" × ":""}(${chem(combEq(f))})   ΔH = ${cf(k)?cf(k)+" × ":""}(${HC[f][0]}) = ${sg(v)} kJ`:`reverse: ${chem(revEq(f))}   ΔH = ${sg(v)} kJ`}).join("<br>");
    if(d.mode==="dh")return{q:`<p>Use enthalpies of combustion from the data booklet to calculate the enthalpy change for ${d.what}.</p><p class="eqn">${chem(d.eq)}</p>`,
      a:`<p>${lines}</p><p>Adding these gives the target equation:<br>ΔH = <b>${sg(dh)} kJ mol⁻¹</b></p>`};
    const others=d.t.filter(([,f])=>f!==d.x),[kx]=d.t.find(([,f])=>f===d.x),known=others.reduce((s,[k,f])=>s+k*HC[f][0],0);

      a:`<p>Using the same cycle with x for the unknown:<br>${sg(dh)} = ${sg(known)} ${kx>0?"+ "+(cf(kx)?cf(kx):"")+"x":"− x"}</p><p>x = <b>${fx(HC[d.x][0],0)} kJ mol⁻¹</b></p>`}}};

T.enthalpy={group:"Energy",title:"Enthalpy of combustion",intro:"Using E = cmΔT to calculate the enthalpy of combustion of a fuel.",
  modes:[["dh","Find ΔH"],["dt","Find the temperature rise"]],
  gen(mode){const F=pick(FUELS),mf=rf(.2,.9,2),V=pick([100,150,200,250]),eff=rf(.35,.7,2);

  view(d){const [nm,f,M,dh0]=d.F,m=d.V/1000;
    if(d.mode==="dh"){const E=4.18*m*d.dt,n=d.mf/M,dh=-E/n;
      return{q:`<p>Burning <b>${d.mf} g</b> of ${nm} raised the temperature of <b>${d.V} cm³</b> of water by <b>${d.dt} °C</b>. Calculate the enthalpy of combustion of ${nm} in kJ mol⁻¹.</p>`,
      a:`<p>E = cmΔT = 4.18 × ${fx(m,3)} × ${d.dt} = ${sf(E)} kJ</p><p>n(${chem(f)}) = ${d.mf} ÷ ${M} = ${sf(n)} mol</p><p>ΔH = −E ÷ n = −${sf(E)} ÷ ${sf(n)} = <b>${sf(dh)} kJ mol⁻¹</b></p><p class="note">The data booklet value is ${dh0} kJ mol⁻¹. The experimental value is less negative because of heat loss and incomplete combustion.</p>`}}

      a:`<p>n(${chem(f)}) = ${d.mf} ÷ ${M} = ${sf(n)} mol</p><p>E = ${sf(n)} × ${Math.abs(dh0)} = ${sf(E)} kJ</p><p>ΔT = E ÷ cm = ${sf(E)} ÷ (4.18 × ${fx(m,3)}) = <b>${sf(dt)} °C</b></p>`}}};

function gfm(f){let i=0;const num=()=>{let s="";while(/\d/.test(f[i]||""))s+=f[i++];return s?+s:1};

  return Math.round(grp()*10)/10}

      a:`<p>Reduction: <span class="eqn">${chem(redEq(A,R.fa))}</span></p><p>Oxidation (reversed): <span class="eqn">${chem(oxEq(B,R.fb))}</span></p><p>Electrons cancel (${A.e*R.fa} each side)${A.o.length>1&&B.o.length>1?". Cancel any H⁺ and H₂O that appear on both sides":""}:</p><p class="eqn"><b>${chem(R.eq)}</b></p>`};

      a:`<p>Oxidising agent: <b>${chem(mainSp(A.o))}</b> (it gains electrons and is reduced)<br>Reducing agent: <b>${chem(mainSp(B.r))}</b> (it loses electrons and is oxidised)</p><p>Oxidation: <span class="eqn">${chem(oxEq(B))}</span><br>Reduction: <span class="eqn">${chem(redEq(A))}</span></p>`}}};

 I:["iodine",7,5,136,[1008,1846,3184],2.7],Cs:["caesium",1,6,238,[376,2234],0.8],Ba:["barium",2,6,206,[503,965],0.9]};

const TREND={

function trendSet(){for(;;){const p=pick(["r","ie","en"]),by=pick(["period","group"]);let pool;

  const l=shuffle(pool).slice(0,3),key=by==="period"?e=>EL[e][1]:e=>EL[e][2],srt=[...l].sort((a,b)=>key(a)-key(b)),v=srt.map(PROP[p][2]);
  const inc=by==="period"?(p==="r"?-1:1):(p==="r"?1:-1);let ok=true;for(let i=1;i<v.length;i++)if((v[i]-v[i-1])*inc<=0)ok=false;if(ok)return{p,by,l}}}
T.periodicity={group:"Structure and properties",title:"Periodicity",intro:"Trends in covalent radius, ionisation energy and electronegativity, using the data booklet.",

const MOLS=[["H2","H","H",0,"diatomic"],["Cl2","Cl","Cl",0,"diatomic"],["O2","O","O",0,"diatomic"],["N2","N","N",0,"diatomic"],
 ["HCl","H","Cl",1,"diatomic"],["HBr","H","Br",1,"diatomic"],["HF","H","F",1,"diatomic"],["HI","H","I",1,"diatomic"],
 ["H2O","H","O",1,"bent"],["H2S","H","S",1,"bent"],["NH3","H","N",1,"pyramidal"],["PH3","H","P",0,"pyramidal"],["NCl3","N","Cl",1,"pyramidal"],["PCl3","P","Cl",1,"pyramidal"],
 ["CH4","H","C",0,"tetrahedral"],["CCl4","C","Cl",0,"tetrahedral"],["CHCl3","C","Cl",1,"tetrahedral, but with different atoms around the carbon"],

const pol=(a,b)=>{const d=+(Math.abs(EL[a][5]-EL[b][5])).toFixed(1);return d};
T.polarity={group:"Structure and properties",title:"Bonding and polarity",intro:"Using electronegativity to decide on bond type, bond polarity and whether a molecule is polar.",
  modes:[["bond","Bond type"],["order","Most polar bond"],["molecule","Polar molecule?"]],
  gen(mode){if(mode==="bond"){const a=Math.random()<.4?pick([...METAL]):pick(NONM),b=pick(NONM.filter(x=>x!==a||Math.random()<.15));return{a,b}}
    if(mode==="order"){for(;;){const bonds=[...Array(3)].map(()=>{const a=pick(NONM);let b;do b=pick(NONM);while(b===a);return[a,b]});const v=bonds.map(([a,b])=>pol(a,b));if(new Set(v).size===3&&new Set(bonds.map(b=>[...b].sort()+"")).size===3)return{bonds}}}
    return{m:pick(MOLS)}},
  view(d){if(d.mode==="bond"){const {a,b}=d,ea=EL[a][5],eb=EL[b][5],dEN=pol(a,b);let t,ex;
      if(METAL.has(a)){t="ionic";ex=`${EL[a][0][0].toUpperCase()+EL[a][0].slice(1)} is a metal and ${EL[b][0]} is a non-metal with a large electronegativity difference (${ea} and ${eb}). Electrons are transferred, forming ions.`}
      else if(dEN===0){t="pure (non-polar) covalent";ex=`Both atoms have the same electronegativity (${ea}), so the bonding electrons are shared equally.`}
      else{const [lo,hi]=ea<eb?[a,b]:[b,a];t="polar covalent";ex=`The electronegativities are ${ea} and ${eb} (a difference of ${dEN}). The bonding electrons are pulled towards ${EL[hi][0]}: ${chem(lo)}<sup>δ+</sup>–${chem(hi)}<sup>δ−</sup>`}
      return{q:`<p>What type of bonding would you expect between <b>${EL[a][0]}</b> and <b>${EL[b][0]}</b>? Use electronegativity values to explain.</p>`,a:`<p><b>${t[0].toUpperCase()+t.slice(1)}</b>.</p><p>${ex}</p>`}}
    if(d.mode==="order"){const s=d.bonds.map(([a,b])=>[`${a}–${b}`,pol(a,b),a,b]).sort((x,y)=>x[1]-y[1]);
      return{q:`<p>Place these bonds in order of <b>increasing polarity</b>: ${d.bonds.map(([a,b])=>`<b>${a}–${b}</b>`).join(", ")}.</p>`,
        a:`<p><b>${s.map(x=>x[0]).join(" &lt; ")}</b></p><p>${s.map(x=>`${x[0]}: |${EL[x[2]][5].toFixed(1)} − ${EL[x[3]][5].toFixed(1)}| = ${x[1].toFixed(1)}`).join("<br>")}</p><p>The bigger the difference in electronegativity, the more polar the bond.</p>`}}

    return{q:`<p>Does <b>${chem(f)}</b> contain polar bonds? Is the molecule polar? Explain, and state the strongest intermolecular force between its molecules.</p>`,
      a:`<p>${a===b?`The bond is between identical atoms, so it is <b>non-polar</b>.`:bondPolar?`The ${a}–${b} bond is <b>polar</b> (electronegativities ${EL[a][5]} and ${EL[b][5]}).`:`The ${a}–${b} bond is <b>non-polar</b>: both atoms have an electronegativity of ${EL[a][5]}.`}</p>

        <p>Strongest intermolecular force: <b>${force}</b>.</p>`}}};

/* ===== Rates of reaction ===== */
function pePlot(o){const W=520,H=320,x0=60,y0=280,top=30,max=o.max,yv=v=>y0-(v/max)*(y0-top);let s="";
  for(let v=0;v<=max;v+=10){const y=yv(v),major=v%50===0;s+=`<line x1="${x0}" x2="${W-10}" y1="${y}" y2="${y}" class="${major?"gmaj":"gmin"}"/>`;if(v%20===0)s+=`<text x="${x0-8}" y="${y}" class="tk" text-anchor="end">${v}</text>`}
  const path=(peak,cls)=>{const a=yv(o.R),b=yv(o.P),p=yv(peak);return`<path d="M${x0+10} ${a} L${x0+110} ${a} C${x0+170} ${a} ${x0+180} ${p} ${x0+225} ${p} C${x0+270} ${p} ${x0+280} ${b} ${x0+340} ${b} L${W-20} ${b}" class="${cls}"/>`};
  s+=path(o.peak,"crv");if(o.cat)s+=path(o.cat,"crv dash");
  s+=`<line x1="${x0}" y1="${top-10}" x2="${x0}" y2="${y0}" class="ax"/><line x1="${x0}" y1="${y0}" x2="${W-10}" y2="${y0}" class="ax"/>`;
  s+=`<text x="${x0+60}" y="${yv(o.R)-10}" class="tk" text-anchor="middle">reactants</text><text x="${W-60}" y="${yv(o.P)-10}" class="tk" text-anchor="middle">products</text>`;
  s+=`<text x="16" y="${(top+y0)/2}" class="tk" transform="rotate(-90 16 ${(top+y0)/2})" text-anchor="middle">Potential energy (kJ mol⁻¹)</text><text x="${(x0+W)/2}" y="${y0+28}" class="tk" text-anchor="middle">Reaction pathway</text>`;
  return`<div class="molwrap"><svg class="plot" viewBox="0 0 ${W} ${H+10}" role="img" aria-label="Potential energy diagram">${s}</svg></div>`}
function mbPlot(o){const W=520,H=300,x0=40,y0=260,xs=E=>x0+E*4.4,f=(E,T)=>Math.sqrt(E)*Math.exp(-E/T)/Math.pow(T,1.5);let mx=0;[o.T1,o.T2].forEach(T=>{for(let E=0;E<=100;E++)mx=Math.max(mx,f(E,T))});
  const curve=(T,cls)=>`<path class="${cls}" d="${[...Array(101)].map((_,E)=>`${E?"L":"M"}${xs(E)} ${y0-f(E,T)/mx*210}`).join(" ")}"/>`;let s="";
  s+=curve(o.T1,"crv")+curve(o.T2,"crv dash");s+=`<line x1="${x0}" y1="20" x2="${x0}" y2="${y0}" class="ax"/><line x1="${x0}" y1="${y0}" x2="${W-10}" y2="${y0}" class="ax"/>`;
  o.lines.forEach(([E,l])=>s+=`<line x1="${xs(E)}" x2="${xs(E)}" y1="40" y2="${y0}" class="ea"/><text x="${xs(E)+6}" y="48" class="tk">${l}</text>`);
  s+=`<text x="${xs(o.T1*.5)+24}" y="${y0-f(o.T1*.5,o.T1)/mx*210-8}" class="tk">${o.n1}</text><text x="${xs(o.T2*.5)+30}" y="${y0-f(o.T2*.5,o.T2)/mx*210-4}" class="tk">${o.n2}</text>`;
  s+=`<text x="${(x0+W)/2}" y="${y0+26}" class="tk" text-anchor="middle">Kinetic energy</text><text x="14" y="${y0/2+20}" class="tk" transform="rotate(-90 14 ${y0/2+20})" text-anchor="middle">Number of molecules</text>`;
  return`<div class="molwrap"><svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Energy distribution">${s}</svg></div>`}
T.rates={group:"Energy",title:"Rates of reaction",intro:"Potential energy diagrams, activation energy, energy distributions and rate calculations.",
  modes:[["read","Read a potential energy diagram"],["draw","Sketch a potential energy diagram"],["dist","Energy distribution"],["calc","Rate calculations"]],
  gen(mode){if(mode==="read"||mode==="draw"){const R=rnd(2,14)*10,dH=rnd(-8,8)*10||-40,P=R+dH,ea=rnd(3,9)*10,peak=Math.max(R,P)+ea,cat=Math.random()<.5?peak-rnd(2,Math.floor(ea/10)-1)*10:null;
      return{R,P,peak,cat,max:Math.ceil((peak+20)/50)*50}}
    if(mode==="dist")return{kind:pick(["temp","cat"]),swap:Math.random()<.5};
    const k=pick(["inv","inv2","avg"]);if(k==="avg"){const V=rnd(40,90),kk=rf(.02,.06,3),ts=[0,10,20,30,40,60,80];return{k,ts,vs:ts.map(t=>+(V*(1-Math.exp(-kk*t))).toFixed(1)),i:rnd(0,4)}}

  view(d){if(d.mode==="read"||d.mode==="draw"){const ea=d.peak-d.R,dh=d.P-d.R,eac=d.cat?d.cat-d.R:null,typ=dh<0?"exothermic":"endothermic";
      const ans=`<p>Activation energy, E<sub>a</sub> = ${d.peak} − ${d.R} = <b>${ea} kJ mol⁻¹</b></p><p>ΔH = ${d.P} − ${d.R} = <b>${dh>0?"+":""}${dh} kJ mol⁻¹</b> (${typ}${dh===0?"":dh<0?": products are lower in energy than reactants":": products are higher in energy than reactants"})</p>${eac?`<p>With the catalyst (dashed line): E<sub>a</sub> = ${d.cat} − ${d.R} = <b>${eac} kJ mol⁻¹</b>. The catalyst provides an alternative pathway with a lower activation energy. ΔH is unchanged.</p>`:""}<p class="note">The activated complex is at the top of the energy barrier.</p>`;
      if(d.mode==="read")return{q:`<p>Use the potential energy diagram to find the activation energy and the enthalpy change. Is the reaction exothermic or endothermic?${d.cat?" The dashed line shows the catalysed reaction: what is its activation energy?":""}</p>`+pePlot(d),a:ans};
      return{q:`<p>Sketch a potential energy diagram for a reaction with <b>ΔH = ${dh>0?"+":""}${dh} kJ mol⁻¹</b> and <b>E<sub>a</sub> = ${ea} kJ mol⁻¹</b>${eac?`. On the same diagram, show the catalysed reaction, which has <b>E<sub>a</sub> = ${eac} kJ mol⁻¹</b>`:""}. The reactants have a potential energy of ${d.R} kJ mol⁻¹.</p>`,a:pePlot(d)+ans}}
    if(d.mode==="dist"){if(d.kind==="temp"){const [n1,n2]=d.swap?["B","A"]:["A","B"];
        return{q:`<p>The graph shows the energy distribution of molecules at two temperatures. E<sub>a</sub> is the activation energy. Which curve, ${n1} or ${n2}, is at the higher temperature? Use the graph to explain why a small rise in temperature causes a large increase in rate.</p>`+mbPlot({T1:14,T2:22,n1,n2,lines:[[60,"Ea"]]}),
          a:`<p><b>Curve ${n2}</b> (dashed) is at the higher temperature: its peak is lower and further to the right.</p><p>At the higher temperature, many more molecules have kinetic energy greater than or equal to the activation energy (the area under the curve to the right of E<sub>a</sub>). So more collisions are successful and the rate increases greatly.</p>`}}
      return{q:`<p>The graph shows the energy distribution of molecules in a reaction, with the activation energy with and without a catalyst. Which line is the catalysed activation energy? Explain how a catalyst increases the rate.</p>`+mbPlot({T1:16,T2:16,n1:"",n2:"",lines:d.swap?[[38,"X"],[62,"Y"]]:[[62,"X"],[38,"Y"]]}),
        a:`<p><b>${d.swap?"X":"Y"}</b>, the lower activation energy, is the catalysed one.</p><p>A catalyst provides an alternative reaction pathway with a lower activation energy. More molecules now have energy greater than or equal to E<sub>a</sub>, so more collisions are successful and the rate increases. The energy distribution itself does not change.</p>`}}
    if(d.k==="inv")return{q:`<p>A reaction took <b>${d.t} s</b> to finish. Calculate the relative rate.</p>`,a:`<p>Relative rate = 1 ÷ t = 1 ÷ ${d.t} = <b>${sf(1/d.t)} s⁻¹</b></p>`};
    if(d.k==="inv2")return{q:`<p>The relative rate of a reaction was <b>${d.r} s⁻¹</b>. Calculate the time taken for the reaction.</p>`,a:`<p>t = 1 ÷ rate = 1 ÷ ${d.r} = <b>${sf(1/d.r)} s</b></p>`};
    const i=d.i,j=i+2,dv=d.vs[j]-d.vs[i],dt=d.ts[j]-d.ts[i];
    return{q:`<p>The volume of gas produced in a reaction was measured.</p><table class="tt"><tr><th>Time (s)</th>${d.ts.map(t=>`<td>${t}</td>`).join("")}</tr><tr><th>Volume (cm³)</th>${d.vs.map(v=>`<td>${fx(v,1)}</td>`).join("")}</tr></table><p>Calculate the average rate between <b>${d.ts[i]} s</b> and <b>${d.ts[j]} s</b>.</p>`,
      a:`<p>Average rate = Δvolume ÷ Δt = (${fx(d.vs[j],1)} − ${fx(d.vs[i],1)}) ÷ (${d.ts[j]} − ${d.ts[i]}) = ${fx(dv,1)} ÷ ${dt} = <b>${sf(dv/dt)} cm³ s⁻¹</b></p><p class="note">The rate decreases over time as the reactants are used up.</p>`}}};

/* ===== Soaps, detergents and emulsifiers ===== */
function soapIons(ch,M){const m=new Mol();ch.forEach((k,i)=>{const y=(i-1)*2,R=m.add("R",0,y,{lab:FA[k][1]}),C=m.add("C",1.9,y);m.bond(R,C);const O=m.add("O",1.9,y-1);m.bond(C,O,2);
  const O2=m.add("O",2.9,y,{lab:"O^{−}"});m.bond(C,O2);m.add("R",3.9,y,{lab:M+"^{+}"})});return m}
function glyceride(ch){const m=new Mol();let prev=null;[0,1,2].forEach(i=>{const y=(i-1)*2,c=m.add("C",0,y);if(prev!==null)m.bond(prev,c);prev=c;const O=m.add("O",1,y);m.bond(c,O);
  if(ch[i]!==null){const C=m.add("C",2,y);m.bond(O,C);const O2=m.add("O",2,y-1);m.bond(C,O2,2);const R=m.add("R",3.9,y,{lab:FA[ch[i]][1]});m.bond(C,R)}});return m}
const SOAPQ=[["Which part of a soap ion is hydrophobic, and which is hydrophilic?","The long non-polar hydrocarbon tail is <b>hydrophobic</b>: it dissolves in oil and grease. The ionic carboxylate head (–COO<sup>−</sup>) is <b>hydrophilic</b>: it dissolves in water."],
 ["Explain how soap removes grease from a surface.","The hydrophobic tails dissolve in the grease, and the hydrophilic heads stay in the water. Agitation lifts the grease off as small droplets with the negative heads on the outside. The droplets repel each other, so they stay suspended in the water (an emulsion) and are washed away."],
 ["How are soaps made?","By the alkaline hydrolysis of fats and oils, by heating with sodium or potassium hydroxide. This gives glycerol and the sodium or potassium salts of the fatty acids (soaps)."],
 ["Why are detergents used instead of soap in hard water?","Hard water contains calcium and magnesium ions, which react with soap to form an insoluble scum. Detergents have ionic heads (for example sulfonate) that do not form scum with these ions."],
 ["What is an emulsion, and what does an emulsifier do?","An emulsion is a mixture of small droplets of one liquid dispersed in another, such as oil in water. An emulsifier has hydrophilic and hydrophobic parts, so it stops the liquids separating."],
 ["How are emulsifiers for food made?","By reacting edible oils with glycerol to form monoglycerides and diglycerides. In these, glycerol is linked to one or two fatty acids, so they still have hydrophilic –OH groups."],["Why does soap form a lather less easily in hard water?","Calcium and magnesium ions in hard water react with soap ions to form an insoluble scum, so less soap is left to form a lather."],["What is formed, as well as soap, when a fat is heated with sodium hydroxide?","<b>Glycerol</b> (propane-1,2,3-triol)."],["Give an example of a food emulsion and its emulsifier.","Mayonnaise: oil droplets dispersed in vinegar, stabilised by lecithin from egg yolk (or mono- and diglycerides)."],["Why do the oil droplets in a soap emulsion not join back together?","Each droplet is surrounded by negatively charged heads, so the droplets repel each other."]];
T.soaps={group:"Organic",title:"Soaps and emulsifiers",organic:true,intro:"Making soaps by alkaline hydrolysis, how they clean, and emulsifiers.",
  modes:[["make","Fat → soap"],["reverse","Soap → fatty acid and alkali"],["emulsifier","Emulsifiers"],["concepts","Explain"]],
  gen(mode){if(mode==="concepts")return{i:rnd(0,SOAPQ.length-1)};if(mode==="emulsifier"){const k=rnd(1,2),ch=[0,1,2].map(()=>rnd(0,FA.length-1));const keep=shuffle([0,1,2]).slice(0,k);return{ch:ch.map((c,i)=>keep.includes(i)?c:null),k,draw:Math.random()<.5}}
    return{ch:[0,1,2].map(()=>rnd(0,FA.length-1)),M:pick(["Na","K"])}},
  view(d,o){const AL={Na:"sodium hydroxide",K:"potassium hydroxide"},MET={Na:"sodium",K:"potassium"};
    if(d.mode==="concepts"){const [q,a]=SOAPQ[d.i];return{q:`<p>${q}</p>`,a:`<p>${a}</p>`}}
    if(d.mode==="make"){const F=fatMol(d.ch),G=glycerol(),S=soapIons(d.ch,d.M);
      return{q:`<p>This fat or oil is heated with <b>${AL[d.M]}</b> solution. Draw the products.</p>`+MOL([F],o),
        a:`<p>Alkaline hydrolysis gives <b>glycerol</b> and three soap molecules: the ${MET[d.M]} salts of the fatty acids.</p>`+MOL([F,`+ 3${d.M}OH`,"→",G,"+",S],o)+`<p class="note">${[...new Set(d.ch)].map(k=>`${MET[d.M]} ${FA[k][0].replace(" acid","").replace(/ic$/,"ate")}`).join(", ")}</p>`}}
    if(d.mode==="reverse"){const k=d.ch[0],S=soapIons([k],d.M);
      return{q:`<p>This soap was made by the alkaline hydrolysis of a fat or oil. Name the fatty acid and the alkali used.</p>`+MOL([S],o),
        a:`<p>Fatty acid: <b>${FA[k][0]}</b> (${chem(FA[k][1]+"COOH")}). Alkali: <b>${AL[d.M]}</b>.</p>`}}
    const G=glyceride(d.ch),type=d.k===1?"monoglyceride":"diglyceride";
    if(d.draw){const names=d.ch.filter(x=>x!==null).map(k=>FA[k][0]).join(" and ");
      return{q:`<p>Draw a <b>${type}</b> that could be made from glycerol and ${names}. Which parts of it make it a good emulsifier?</p>`,a:MOL([G],o)+`<p>The –OH group${d.k===1?"s":""} on glycerol ${d.k===1?"are":"is"} hydrophilic, and the long fatty acid chain${d.k===2?"s are":" is"} hydrophobic. Having both lets the molecule hold oil and water together.</p>`}}
    return{q:`<p>Is this molecule a monoglyceride or a diglyceride? Explain why it can act as an emulsifier.</p>`+MOL([G],o),

const SALTS=[["ammonium nitrate","NH4NO3",26],["potassium nitrate","KNO3",35],["sodium hydroxide","NaOH",-44],["lithium chloride","LiCl",-37],["calcium chloride","CaCl2",-82],["potassium chloride","KCl",17],["ammonium chloride","NH4Cl",15]];
const ACIDS=[["hydrochloric acid","HCl",1],["nitric acid","HNO3",1],["sulfuric acid","H2SO4",2]],BASES=[["sodium hydroxide","NaOH"],["potassium hydroxide","KOH"]];
T.solution={group:"Energy",title:"Enthalpy of solution and neutralisation",intro:"Using E = cmΔT for reactions and dissolving in water.",
  modes:[["solution","Enthalpy of solution"],["neutral","Enthalpy of neutralisation"],["dt","Find the temperature change"]],
  gen(mode){if(mode==="neutral"){const A=pick(ACIDS),B=pick(BASES),c=pick([.5,1,1.5,2]),V=pick([25,50]),nW=c*V/1000*A[2],Vb=V*A[2],dt=+(57*nW/(4.18*(V+Vb)/1000)).toFixed(1);return{A,B,c,V,Vb,dt}}
    const S=pick(SALTS),m=rf(1,8,2),V=pick([50,100,150,200]);const n=m/gfm(S[1]);return{S,m,V,dt:+(Math.abs(S[2])*n/(4.18*V/1000)).toFixed(1)}},
  view(d){if(d.mode==="neutral"){const [an,af,k]=d.A,nW=d.c*d.V/1000*k,mass=(d.V+d.Vb)/1000,E=4.18*mass*d.dt;
      return{q:`<p><b>${d.V} cm³</b> of <b>${d.c} mol l⁻¹</b> ${an} was mixed with <b>${d.Vb} cm³</b> of <b>${d.c} mol l⁻¹</b> ${d.B[0]}. The temperature rose by <b>${d.dt} °C</b>. Calculate the enthalpy of neutralisation (per mole of water formed).</p>`,
        a:`<p>Mass of solution = ${d.V+d.Vb} g = ${fx(mass,3)} kg (assume 1 cm³ has a mass of 1 g)</p><p>E = cmΔT = 4.18 × ${fx(mass,3)} × ${d.dt} = ${sf(E)} kJ</p><p>n(H<sup>+</sup>) = ${d.c} × ${fx(d.V/1000,3)}${k>1?" × 2":""} = ${sf(nW)} mol, so ${sf(nW)} mol of water is formed</p><p>ΔH = −${sf(E)} ÷ ${sf(nW)} = <b>${sf(-E/nW)} kJ mol⁻¹</b></p>`}}
    const [nm,f,dh]=d.S,M=gfm(f),n=d.m/M,mass=d.V/1000,E=4.18*mass*d.dt,endo=dh>0;
    if(d.mode==="solution")return{q:`<p><b>${d.m} g</b> of ${nm} was dissolved in <b>${d.V} cm³</b> of water. The temperature <b>${endo?"fell":"rose"}</b> by <b>${d.dt} °C</b>. Calculate the enthalpy of solution of ${nm}.</p>`,
      a:`<p>E = cmΔT = 4.18 × ${fx(mass,3)} × ${d.dt} = ${sf(E)} kJ</p><p>n(${chem(f)}) = ${d.m} ÷ ${M} = ${sf(n)} mol</p><p>ΔH = ${endo?"+":"−"}${sf(E)} ÷ ${sf(n)} = <b>${endo?"+":""}${sf((endo?1:-1)*E/n)} kJ mol⁻¹</b></p><p>The temperature ${endo?"fell, so dissolving is endothermic and ΔH is positive":"rose, so dissolving is exothermic and ΔH is negative"}.</p>`};
    const Ex=Math.abs(dh)*n,dt=Ex/(4.18*mass);
    return{q:`<p>The enthalpy of solution of ${nm} is <b>${dh>0?"+":""}${dh} kJ mol⁻¹</b>. Calculate the temperature change when <b>${d.m} g</b> dissolves in <b>${d.V} cm³</b> of water.</p>`,
      a:`<p>n(${chem(f)}) = ${d.m} ÷ ${M} = ${sf(n)} mol</p><p>E = ${sf(n)} × ${Math.abs(dh)} = ${sf(Ex)} kJ</p><p>ΔT = E ÷ cm = ${sf(Ex)} ÷ (4.18 × ${fx(mass,3)}) = <b>${sf(dt)} °C ${endo?"fall":"rise"}</b></p>`}}};

function chromPlot(cols,front){const W=150+cols.length*80,H=330,base=290,top=40,scale=(base-top)/front;let s=`<rect x="20" y="20" width="${W-40}" height="${H-30}" rx="6" class="paper"/>`;
  s+=`<line x1="30" x2="${W-110}" y1="${base}" y2="${base}" class="ax"/><text x="${W-102}" y="${base}" class="tk">baseline</text>`;
  s+=`<line x1="30" x2="${W-110}" y1="${base-front*scale}" y2="${base-front*scale}" class="ea"/><text x="${W-102}" y="${base-front*scale}" class="tk">solvent front</text>`;
  cols.forEach(([lab,spots],i)=>{const x=70+i*80;s+=`<circle cx="${x}" cy="${base}" r="3" class="dot"/><text x="${x}" y="${base+22}" class="tk" text-anchor="middle">${lab}</text>`;
    spots.forEach(rf=>s+=`<ellipse cx="${x}" cy="${base-rf*front*scale}" rx="12" ry="8" class="spot"/>`)});
  return`<div class="molwrap"><svg class="plot" viewBox="0 0 ${W} ${H+10}" style="max-width:${W*1.3}px" role="img" aria-label="Chromatogram">${s}</svg></div>`}
T.chroma={group:"Structure and properties",title:"Chromatography",intro:"Rf values and identifying the substances in a mixture.",
  modes:[["rf","Calculate Rf"],["identify","Identify the components"],["distance","Distance from Rf"]],
  gen(mode){const front=rf(6,10,1);let rfs;do{rfs=[...Array(4)].map(()=>rf(.1,.9,2))}while(rfs.some((a,i)=>rfs.some((b,j)=>i<j&&Math.abs(a-b)<.08)));
    const inMix=shuffle([0,1,2,3]).slice(0,rnd(2,3));return{front,rfs,inMix,ask:rnd(0,3),polarSolvent:Math.random()<.5}},
  view(d){const L="ABCD",cols=[["M",d.inMix.map(i=>d.rfs[i])],...d.rfs.map((r,i)=>[L[i],[r]])];
    if(d.mode==="rf"){const dist=+(d.rfs[d.ask]*d.front).toFixed(1);
      return{q:`<p>The solvent front moved <b>${fx(d.front,1)} cm</b> from the baseline. The spot for substance <b>${L[d.ask]}</b> moved <b>${fx(dist,1)} cm</b>. Calculate its R<sub>f</sub> value.</p>`+chromPlot(cols,d.front),
        a:`<p>R<sub>f</sub> = distance moved by spot ÷ distance moved by solvent = ${fx(dist,1)} ÷ ${fx(d.front,1)} = <b>${fx(dist/d.front,2)}</b></p>`}}
    if(d.mode==="identify"){const most=d.rfs.indexOf(Math.max(...d.rfs));
      return{q:`<p>Mixture M was compared with substances A to D. Which substances are in M? The solvent was ${d.polarSolvent?"polar (water)":"non-polar"}. Which of A to D is ${d.polarSolvent?"most":"least"} polar?</p>`+chromPlot(cols,d.front),
        a:`<p>M contains <b>${d.inMix.map(i=>L[i]).sort().join(", ")}</b>: their spots are at the same heights (same R<sub>f</sub> values).</p><p><b>${L[most]}</b> travelled furthest, so it is the most attracted to the ${d.polarSolvent?"polar":"non-polar"} solvent. It is the <b>${d.polarSolvent?"most":"least"} polar</b>.</p>`}}
    const r=d.rfs[d.ask];return{q:`<p>A substance has an R<sub>f</sub> value of <b>${fx(r,2)}</b>. In a chromatogram, the solvent front moved <b>${fx(d.front,1)} cm</b>. How far did the substance move?</p>`,
      a:`<p>Distance = R<sub>f</sub> × solvent distance = ${fx(r,2)} × ${fx(d.front,1)} = <b>${fx(r*d.front,1)} cm</b></p>`}}};

$("pres-btn").onclick=()=>{const on=document.body.classList.toggle("present");$("pres-btn").setAttribute("aria-pressed",on);$("pres-btn").textContent=on?"Exit presentation":"Presentation mode";};
/* ---------- timed quiz ---------- */
let TIMER=null;
function stopQuiz(){if(TIMER){clearInterval(TIMER);TIMER=null;}$("timer").hidden=true;$("quiz-btn").textContent="Start quiz";}
$("quiz-btn").onclick=()=>{if(TIMER){finishQuiz();return;}makeSheet();let left=Number($("quizmin").value)*60;$("timer").hidden=false;$("quiz-btn").textContent="Finish now";$("sheetans").hidden=true;
  const tick=()=>{$("timer").textContent=`Time left ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;if(left--<=0)finishQuiz();};tick();TIMER=setInterval(tick,1000);};
function finishQuiz(){stopQuiz();$("sheetans").hidden=false;$("sheeta").hidden=false;$("sheetans").textContent="Hide answers";
  $("sheeta").querySelectorAll("li").forEach((li,i)=>{const d=document.createElement("label");d.className="qnum";d.innerHTML=`<input type="checkbox" data-i="${i}"> I got this right`;li.appendChild(d);});
  const tot=document.createElement("p");tot.id="quiztot";tot.className="qnum";$("sheeta").after(tot);
  const upd=()=>{const n=$("sheeta").querySelectorAll("input:checked").length;tot.textContent=`Quiz score: ${n} / ${SHEET.length}`;};
  $("sheeta").querySelectorAll("input").forEach(c=>c.onchange=()=>{const Q=SHEET[c.dataset.i];if(!Q._scored){Q._scored=1;score(Q,c.checked);}else if(Q._id&&SC[Q._id]){SC[Q._id].c+=c.checked?1:-1;saveSC();}upd();});upd();
  $("sheeta").scrollIntoView({behavior:"smooth"});}
/* ---------- data booklet drawer ---------- */
const BT=(rows,head)=>`<table>${head?`<tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>`:""}${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
function bookTabs(){const ram=LEVEL==="N5"?RAM_N5:RAM_H,t={};
  t["Relationships"]=LEVEL==="N5"?BT([["n = m ÷ GFM"],["n = c × V"],["% by mass = (m of element ÷ GFM) × 100"],["average rate = Δquantity ÷ Δtime"],["E<sub>h</sub> = c m ΔT  (c = 4.18 kJ kg<sup>−1</sup> °C<sup>−1</sup>)"]]):
    BT([["n = m ÷ GFM, n = c × V, V = n × V<sub>m</sub>"],["E<sub>h</sub> = c m ΔT  (c = 4.18 kJ kg<sup>−1</sup> °C<sup>−1</sup>)"],["% yield = actual ÷ theoretical × 100"],["atom economy = mass of desired product ÷ total mass of reactants × 100"],["rate ∝ 1 ÷ t"],["pH = −log[H<sup>+</sup>], K<sub>w</sub> = [H<sup>+</sup>][OH<sup>−</sup>] = 1.01 × 10<sup>−14</sup> at 25 °C"],["E = Lhc ÷ λ, c = fλ"],["ΔG° = ΔH° − TΔS°"]]);
  t["Relative atomic masses"]=BT(Object.entries(ram).map(([k,v])=>[k,v]),["Element","RAM"]);
  if(LEVEL==="N5"){t["Solubility"]=BT(Object.entries(SOLTAB).map(([k,v])=>[k,...v.split(" ").map(x=>x==="-"?"−":x)]),["",...SOL_AN]);
    t["Flame colours"]=BT([["barium","green"],["calcium","orange-red"],["copper","blue-green"],["lithium","red"],["potassium","lilac"],["sodium","yellow"],["strontium","red"]],["Ion","Colour"]);
    t["Electrochemical series"]=BT(["lithium","potassium","calcium","sodium","magnesium","aluminium","zinc","iron","nickel","tin","lead","copper","silver","mercury","gold"].map((x,i)=>[i+1,x]),["","Most reactive at the top"]);}
  else{t["Radius, IE, EN"]=BT([["Li",130,520,"1.0"],["Be",99,900,"1.6"],["B",84,801,"2.0"],["C",75,1086,"2.6"],["N",71,1402,"3.0"],["O",64,1314,"3.4"],["F",60,1681,"4.0"],["Na",160,496,"0.9"],["Mg",140,738,"1.3"],["Al",124,578,"1.6"],["Si",114,787,"1.9"],["P",109,1012,"2.2"],["S",104,1000,"2.6"],["Cl",100,1251,"3.2"],["K",200,419,"0.8"],["Ca",174,590,"1.0"],["Br",117,1140,"3.0"],["Rb",215,403,"0.8"],["I",136,1008,"2.7"]],["Element","Covalent radius / pm","1st IE / kJ mol<sup>−1</sup>","Electronegativity"]);
  t["Colour wheel"]=BT([["purple","green"],["violet","yellow-green"],["blue","yellow"],["green-blue","orange"],["blue-green","red"]],["Colour","Opposite (complementary)"])+'<p class="qnum">Booklet wavelengths: 380, 400, 435, 480, 490, 500, 560, 580, 595, 605, 750 nm around the wheel.</p>';}
  if(LEVEL!=="N5")t["Constants"]=BT([["Avogadro constant, L","6.02 × 10<sup>23</sup> mol<sup>−1</sup>"],["Planck constant, h","6.63 × 10<sup>−34</sup> J s"],["Speed of light, c","3.00 × 10<sup>8</sup> m s<sup>−1</sup>"],["Specific heat capacity of water","4.18 kJ kg<sup>−1</sup> °C<sup>−1</sup>"],["K<sub>w</sub> (25 °C)","1.01 × 10<sup>−14</sup>"]]);
  return t;}
$("book-btn").onclick=()=>{const t=bookTabs(),k=Object.keys(t);$("booktabs").innerHTML=k.map((x,i)=>`<button class="btn alt" aria-pressed="${i===0}" data-k="${x}">${x}</button>`).join("");
  const sh=x=>{$("bookbody").innerHTML=t[x];$("booktabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===x));};
  $("booktabs").querySelectorAll("button").forEach(b=>b.onclick=()=>sh(b.dataset.k));sh(k[0]);$("book").hidden=false;};
$("book-close").onclick=()=>$("book").hidden=true;
(function(){const h=location.hash.slice(1);if(h&&byId(h))openTopic(h);else if(h&&UNITS.find(u=>u.id===h))showUnit(h);else showHome();})();
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&byId(h))openTopic(h);});
