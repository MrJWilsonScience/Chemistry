    return {reset() { tries = 0; reveal.hidden = true; msg.textContent = ''; }};
  };

    D.text(g, (tit().name || ''), zx + 14, zy + 42, {size: 11});

    g.strokeStyle = T.ink; g.lineWidth = 2; g.beginPath(); g.moveTo(x0, my - 13); g.quadraticCurveTo((x0 + x1) / 2, my + 13, x1, my - 13); g.stroke();
    g.lineWidth = 1.2; g.strokeStyle = T.ink;

}

/* ================= kinetics widget ================= */
function kineticsLab(ui, o) {
  const run = {n: store.get(ui.lab.id + ':runs', 0), on: false, t: 0, s: null, A: NaN, next: 0};
  const vals = {};
  ui.group('Reaction mixture');
  if (o.note) ui.note(o.note);
  for (const v of o.vols) vals[v.key] = ui.slider(Object.assign({}, v, {onChange: upd}));
  const wn = ui.note('');
  const temp = ui.slider({label: 'Temperature of water bath', min: o.temp[0], max: o.temp[1], step: 1, value: o.temp[2], unit: '°C'});
  function water() { return o.total - o.vols.reduce((s, v) => s + vals[v.key].v, 0); }
  function upd() { const w = water(); wn.textContent = w < 0 ? `Too much: the volumes add up to more than ${o.total.toFixed(1)} cm³.` : `Distilled water added: ${w.toFixed(1)} cm³ (total ${o.total.toFixed(1)} cm³)`; wn.className = 'note' + (w < 0 ? ' warn' : ''); }

  const speed = ui.select({label: 'Simulation speed', options: [['1', 'Real time'], ['5', '5 × faster'], ['20', '20 × faster']], value: '5'});
  const auto = ui.toggle({label: `Record absorbance every ${o.interval} s automatically`, value: true});
  ui.btns([['Mix and start clock', start, 'primary'], ['Stop clock', stop], ['Record reading', rec]]);
  const rT = ui.readout('Stop-clock', 's'), rA = ui.readout('Absorbance', '');

  const live = ui.table({name: 'live', title: 'Absorbance against time', hint: 'Each run is plotted as a separate series.', columns: [{key: 'run', label: 'Run', auto: 1}, {key: 't', label: 'Time', unit: 's', auto: 1}, {key: 'A', label: 'Absorbance', auto: 1}], group: 'run', graph: {x: 't', y: 'A', fit: !!o.fit}});
  const sum = ui.table({name: 'runs', title: o.sumTitle, columns: [{key: 'run', label: 'Run', auto: 1}].concat(o.vols.map(v => ({key: v.key, label: v.short || v.label, unit: 'cm³', auto: 1})), [{key: 'water', label: 'Water', unit: 'cm³', auto: 1}, {key: 'T', label: 'Temp', unit: '°C', auto: 1}], o.pupilCols || [])});
  function start() {
    const w = water(); if (w < -1e-9) { ui.log(`Reduce the volumes: the total must not exceed ${o.total} cm³.`, 'warn'); return; }
    const v = {}; for (const x of o.vols) v[x.key] = vals[x.key].v; v.water = w; v.T = temp.v;
    run.s = o.init(v); run.n++; store.set(ui.lab.id + ':runs', run.n); run.t = 0; run.next = 0; run.on = true;
    const row = {run: 'Run ' + run.n, water: w.toFixed(1), T: String(v.T)}; for (const x of o.vols) row[x.key] = v[x.key].toFixed(1);

  }

  ui.loop(dt => {
    if (!run.on) return;
    run.t += dt * (+speed.v);
    if (auto.v) while (run.t >= run.next) { live.add({run: 'Run ' + run.n, t: String(run.next), A: Math.max(0, o.A(run.next, run.s) + gauss() * .002).toFixed(3)}); run.next += o.interval; }

        const rate = kk * (1 - s.xi);
        bub.emit(rate * 2200, dt, 120, 220, cv.H - 50, cv.H - 150);
        if (s.g > .5 && !s.said.g) { s.said.g = 1; ui.log('The solution turns green and there is vigorous effervescence.'); }

const AR = {C: 12.011, H: 1.008, N: 14.007, O: 15.999, Br: 79.904, Cl: 35.45};
const fmlText = f => Object.entries(f).map(([e, n]) => e + (n > 1 ? String(n).split('').map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : '')).join('');
const fmlMass = f => Object.entries(f).reduce((s, [e, n]) => s + AR[e] * n, 0);
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function empirical(f) { const g = Object.values(f).reduce(gcd); const o = {}; for (const e in f) o[e] = f[e] / g; return o; }

LABS.push({id: 'gravimetric', unit: 4, code: '4.1', title: 'Gravimetric analysis: water of crystallisation', area: 'Researching chemistry: gravimetric analysis and heating to constant mass',

      g.fillStyle = hot ? '#e2d6c4' : D.porcelain(g, cx - 38, 76); g.beginPath(); g.moveTo(cx - 38, 60); g.lineTo(cx + 38, 60); g.lineTo(cx + 26, 112); g.lineTo(cx - 26, 112); g.closePath(); g.fill(); g.strokeStyle = T.muted; g.lineWidth = 1.5; g.stroke();

    ui.group('Sample');

    ui.btns([['Add about 2 g of salt', () => { if (st.added) { ui.log('The crucible already contains salt. Choose a salt again to start over.', 'warn'); return; } const S = SALT[sk]; st.n = rand(1.8, 2.4) / (S.Ma + S.x * 18.015); st.added = true; reading = null; ui.log('Salt added to the crucible.'); cv.redraw(); }, 'primary'], ['Start again', () => { reset(); cv.redraw(); ui.log('Crucible emptied and cleaned.'); }]]);
    ui.group('Heating');
    ui.select({label: 'Flame', options: [['gentle', 'Gentle blue flame'], ['strong', 'Strong roaring flame']], value: heat, onChange: v => { heat = v; }});

    ui.select({label: 'Dissolve in', options: [['h2so4', 'Dilute sulfuric acid'], ['hcl', 'Dilute hydrochloric acid'], ['none', 'Water only (no acid)']], value: acid, onChange: v => { acid = v; }});
    ui.btns([['Dissolve and make up to 250.0 cm³', () => { made = {n: nT, acid}; ui.log('Tablets crushed, dissolved and made up to 250.0 cm³. The solution is very pale green.'); cv.redraw(); }, 'primary']]);
    const tw = Titration(ui, {
      titrant: {name: '0.0100 mol L⁻¹ potassium permanganate', col: '#7a1b8c'},
      getEndpoint: () => { if (!made) { ui.log('Make up the tablet solution first.', 'warn'); return null; } const nFe = made.n * mgFe / 1000 / 55.85 / 10; let V = nFe / 5 / .01 * 1000; if (made.acid === 'none') V *= 5 / 3; if (made.acid === 'hcl') V *= 1.08; return V; },
      onNew: st => { st.acid = made.acid; st.desc = `${made.n} tablets, ${{h2so4: 'H₂SO₄', hcl: 'HCl', none: 'no acid'}[made.acid]}`; },
      newText: '25.0 cm³ of tablet solution pipetted into the flask.',
      colour: (f, st) => st.acid === 'none' ? mix('#e9efda', '#a07a4a', clamp(f, 0, 1)) : f < 1 ? mix('#e6efd3', '#f1e9c9', clamp(f, 0, 1)) : mix('#f1e4d6', '#d65aa9', clamp((f - 1) * 35, 0, 1)),
      ppt: (f, st) => st.acid === 'none' && f > .05 ? {col: '#6a4524', a: clamp(f * .6, 0, .6)} : null,
      endText: 'A permanent pale pink colour: end point.',
      nearText: null, table: null, rowInfo: st => ({s: st.desc})
    });
    const tb = ui.table({name: 'redox', title: 'Permanganate titrations', columns: [{key: 's', label: 'Solution', auto: 1}].concat(TIT_COLS)});
    tw.cfg.table = tb;
    const orig = tw.cfg.colour;
    tw.cfg.colour = (f, st) => { if (st.acid === 'none' && f > .3 && !st.mno2) { st.mno2 = 1; ui.log('A brown precipitate of manganese(IV) oxide forms. The end point cannot be seen clearly.', 'warn'); } return orig(f, st); };
    ui.check({label: 'Mass of iron in one tablet', unit: 'mg', answer: () => mgFe, tol: 3});
  }});

/* 4.5 Standard solution */
LABS.push({id: 'standard', unit: 4, code: '4.5', title: 'Preparing a standard solution', area: 'Researching chemistry: weighing by difference, volumetric flasks and standard solutions',
  aim: 'Prepare 250.0 cm³ of a standard solution of anhydrous sodium carbonate, a primary standard, and calculate its concentration accurately.',
  method: ['Weigh the weighing bottle containing sodium carbonate. Tip the solid into a beaker and reweigh the bottle: the difference is the mass transferred.',
    'Dissolve the solid in about 100 cm³ of distilled water.',
    'Transfer the solution to a 250 cm³ standard flask using a funnel. Rinse the beaker, stirring rod and funnel into the flask.',
    'Add water until the bottom of the meniscus sits on the graduation mark. Use dropwise additions near the mark.',
    'Stopper and invert the flask several times. Calculate the concentration.'],
  questions: ['Why is anhydrous sodium carbonate suitable as a primary standard?',
    'Why is weighing by difference more accurate than weighing the solid in a weighing boat?',
    'Why are the beaker and rod rinsed into the flask? What happens if this is not done?',
    'If you go past the mark, why can you not simply pour some solution out?',
    'Calculate the concentration of your solution to three significant figures.'],
  setup(ui) {
    let target = 1.33, s = null;
    function reset() { const bottle = rand(14, 17); s = {bottle, m1: null, m2: null, solid: 0, inBeaker: 0, dissolved: false, inFlask: 0, V: 0, rinsed: false, over: false, mixed: false}; }
    reset();
    const NECK = 1 / 1.13;
    const cv = ui.cv(600, 300, (g, W, H) => {
      D.floor(g, W, H - 10, H);
      D.lcd(g, 20, 40, 170, 44, s.m2 != null ? s.m2.toFixed(4) + ' g' : s.m1 != null ? s.m1.toFixed(4) + ' g' : '-.----', 'balance');
      D.beaker(g, 30, 150, 110, H - 160, {level: s.dissolved && s.inFlask === 0 ? .65 : s.inBeaker > 0 ? .05 : 0, col: T.water, marks: true});
      if (s.inBeaker > 0 && !s.dissolved) { g.fillStyle = '#f3f2ee'; g.fillRect(50, H - 18, 70, 6); }
      const cx = 260, by = H - 14;
      g.fillStyle = T['glass-fill']; g.beginPath(); g.arc(cx, by - 60, 56, 0, 7); g.fill(); g.fillRect(cx - 9, 40, 18, by - 120);
      if (s.inFlask) { g.save(); g.beginPath(); g.arc(cx, by - 60, 54, 0, 7); g.rect(cx - 8, 40, 16, by - 115); g.clip(); const yTop = s.V <= 230 ? by - 6 - 108 * s.V / 230 : Math.max(42, by - 114 - (s.V - 230) / 20 * (by - 214)); g.globalAlpha = .7; g.fillStyle = T.water; g.fillRect(cx - 60, yTop, 120, by - yTop); g.globalAlpha = 1; g.restore(); }
      D.shadow(g, cx, D.benchY, 90); D.gloss(g, () => { g.beginPath(); g.arc(cx, by - 60, 56, 0, 7); g.rect(cx - 9, 40, 18, by - 115); }, cx - 56, 40, 112, by - 44); D.glass(g, 2); g.beginPath(); g.arc(cx, by - 60, 56, -Math.PI / 2 + .17, Math.PI * 1.5 - .17); g.stroke(); D.bung(g, cx, 30, 18, 10); g.beginPath(); g.moveTo(cx - 9, 40); g.lineTo(cx - 9, by - 116); g.moveTo(cx + 9, 40); g.lineTo(cx + 9, by - 116); g.stroke();
      g.strokeStyle = T.ink; g.lineWidth = 1.5; g.beginPath(); g.moveTo(cx - 9, 100); g.lineTo(cx + 9, 100); g.stroke();
      D.text(g, '250 cm³', cx, by + 0, {size: 10, align: 'center'});
      const zx = 360, zy = 30, zw = 220, zh = 250;
      D.rr(g, zx, zy, zw, zh, 10); g.fillStyle = T['surface-2']; g.fill(); g.strokeStyle = T.line; g.lineWidth = 1; g.stroke();
      D.text(g, 'Neck at the mark, magnified', zx + 12, zy + 20, {size: 12, w: 600, color: T.ink});
      const mid = zy + zh / 2 + 10, k = 70, x0 = zx + 60, x1 = zx + zw - 60;
      g.save(); g.beginPath(); g.rect(zx + 2, zy + 30, zw - 4, zh - 34); g.clip();
      if (s.inFlask) { const dv = s.V - 250, my = mid - dv * NECK * k; g.globalAlpha = .6; g.fillStyle = T.water; g.beginPath(); g.moveTo(x0, my - 10); g.quadraticCurveTo((x0 + x1) / 2, my + 10, x1, my - 10); g.lineTo(x1, zy + zh); g.lineTo(x0, zy + zh); g.closePath(); g.fill(); g.globalAlpha = 1; g.strokeStyle = T.ink; g.lineWidth = 2; g.beginPath(); g.moveTo(x0, my - 10); g.quadraticCurveTo((x0 + x1) / 2, my + 10, x1, my - 10); g.stroke(); }
      g.restore();
      D.glass(g, 2); g.beginPath(); g.moveTo(x0, zy + 30); g.lineTo(x0, zy + zh - 4); g.moveTo(x1, zy + 30); g.lineTo(x1, zy + zh - 4); g.stroke();
      g.strokeStyle = T.ink; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x0 - 14, mid); g.lineTo(x1 + 14, mid); g.stroke();
      D.text(g, 'mark', x1 + 16, mid + 4, {size: 11});
    }, {label: 'Balance, beaker, standard flask and magnified neck'});
    ui.group('Weighing by difference');
    ui.slider({label: 'Mass of Na₂CO₃ in the bottle (approx.)', min: 1, max: 1.6, step: .01, value: target, dp: 2, unit: 'g', onChange: v => { target = v; }});
    ui.btns([['Weigh bottle + solid', () => { reset(); s.solid = target + rand(-.03, .03); s.m1 = s.bottle + s.solid + gauss() * .00005; ui.log('Bottle and solid weighed.'); tb.add({step: 'Bottle + Na₂CO₃', m: s.m1.toFixed(4)}); cv.redraw(); }], ['Tip solid into beaker', () => { if (s.m1 == null) { ui.log('Weigh the bottle first.', 'warn'); return; } const left = rand(.0004, .002); s.inBeaker = s.solid - left; s.solid = left; ui.log('Solid tipped into the beaker. A few grains stay in the bottle.'); cv.redraw(); }], ['Reweigh bottle', () => { if (!s.inBeaker) { ui.log('Tip the solid out first.', 'warn'); return; } s.m2 = s.bottle + s.solid + gauss() * .00005; tb.add({step: 'Bottle after tipping', m: s.m2.toFixed(4)}); cv.redraw(); }]]);
    ui.group('Dissolve and transfer');
    const rin = ui.toggle({label: 'Rinse beaker, rod and funnel into the flask', value: true});
    ui.btns([['Dissolve in 100 cm³ water', () => { if (!s.inBeaker) { ui.log('Put the solid in the beaker first.', 'warn'); return; } s.dissolved = true; ui.log('Solid dissolved with stirring.'); cv.redraw(); }], ['Transfer to standard flask', () => { if (!s.dissolved) { ui.log('Dissolve the solid first.', 'warn'); return; } s.rinsed = rin.v; s.inFlask = s.inBeaker * (rin.v ? 1 : rand(.975, .99)); s.V = rin.v ? 160 : 100; ui.log(rin.v ? 'Solution and rinsings transferred.' : 'Solution transferred without rinsing. Some sodium carbonate is left behind.', rin.v ? '' : 'warn'); cv.redraw(); }, 'primary']]);
    ui.group('Make up to the mark');
    const addW = v => { if (!s.inFlask) { ui.log('Transfer the solution first.', 'warn'); return; } if (s.over) { ui.log('The solution is above the mark. It must be prepared again.', 'warn'); return; } s.V += v; if (s.V > 250.06) { s.over = true; ui.log('Overshot: the meniscus is above the mark. Start again.', 'warn'); } cv.redraw(); };
    ui.btns([['+20 cm³', () => addW(20)], ['+5 cm³', () => addW(5)], ['+1 cm³', () => addW(1)], ['+1 drop', () => addW(.05)]]);
    ui.btns([['Stopper and invert', () => { if (!s.inFlask) return; s.mixed = true; ui.log('Stoppered and inverted ten times to mix.'); }], ['Start again', () => { reset(); cv.redraw(); ui.log('Glassware washed. Start again.'); }]]);
    const tb = ui.table({name: 'std', title: 'Weighings and volume', columns: [{key: 'step', label: 'Stage', auto: 1}, {key: 'm', label: 'Mass', unit: 'g', auto: 1}, {key: 'calc', label: 'Calculation'}]});
    ui.check({label: 'Concentration of your sodium carbonate solution', unit: 'mol L⁻¹', answer: () => s.inFlask ? (s.inFlask / 105.99) / (s.V / 1000) : NaN, tol: .4});
  }});
boot();
</script>
