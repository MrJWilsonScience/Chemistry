<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="stylesheet" href="../../shared/lk.css"><script src="../../shared/meta.js"></script><script src="../../shared/labdata.js"></script><script src="../../shared/lk.js"></script><style>.app{grid-template-columns:minmax(0,1fr)!important;padding-top:8px!important}nav.index,.navsel,.brand{display:none!important}
.seg-multi{display:flex;gap:6px;flex-wrap:wrap}.seg-multi button{flex:1 1 auto;padding:7px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font:inherit;font-size:.85rem;cursor:pointer}.seg-multi button[aria-pressed=true]{background:var(--accent);color:var(--panel);border-color:var(--accent)}

<title>N5 Chemistry Virtual Labs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: lab index down the left (a dropdown on phones); each lab = bench + variables, then graph, results, conclusion */
:root{
  --bg:#eef2f1;--panel:#ffffff;--ink:#14231f;--muted:#5a6d68;--line:#cfdad7;
  --accent:#0b7a6b;--acid:#d6ebf0;--glass:#9dbdb7;--chip:#e7e1d6;--metal:#9aa3a8;
  --ok:#1d7a35;--bad:#b42318;
  --c1:#0b7a6b;--c2:#c2410c;--c3:#4f46e5;--c4:#a21caf;--c5:#ca8a04;--c6:#0369a1;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1716;--panel:#17221f;--ink:#e3ecea;--muted:#93a7a2;--line:#2c3c38;--accent:#3fc7b2;--acid:#1b3a40;--glass:#5d7f79;--chip:#bdb5a6;--metal:#7d878c;--ok:#4ade80;--bad:#f87171;--c1:#3fc7b2;--c2:#fb923c;--c3:#818cf8;--c4:#e879f9;--c5:#facc15;--c6:#38bdf8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1716;--panel:#17221f;--ink:#e3ecea;--muted:#93a7a2;--line:#2c3c38;--accent:#3fc7b2;--acid:#1b3a40;--glass:#5d7f79;--chip:#bdb5a6;--metal:#7d878c;--ok:#4ade80;--bad:#f87171;--c1:#3fc7b2;--c2:#fb923c;--c3:#818cf8;--c4:#e879f9;--c5:#facc15;--c6:#38bdf8;color-scheme:dark}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.app{max-width:1260px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.brand{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.4rem);margin:0;text-wrap:balance;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted)}
nav.index{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:14px}
nav.index h4{margin:0 0 4px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
nav.index button{display:block;width:100%;text-align:left;padding:7px 10px;border:0;border-radius:6px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
nav.index button:hover{background:var(--panel)}
nav.index button[aria-current=true]{background:var(--accent);color:var(--panel);font-weight:700}
.navsel{display:none}
.navsel select{width:100%;padding:10px;font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}nav.index{display:none}.navsel{display:block}}
.lab{display:grid;gap:16px;min-width:0}
.unit{margin:0;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
h2{font-family:var(--display);font-weight:800;font-size:1.7rem;margin:2px 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0 0 10px}
.aim{margin:0;max-width:70ch}
.eq{font-family:var(--mono);font-size:.88rem;color:var(--muted);margin:4px 0 0}
.top{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media(max-width:760px){.top{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
svg.rig{width:100%;height:auto;display:block}
.vars{display:grid;gap:14px}
.f{display:grid;gap:5px}
.f label,.lbl{font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.f label output{font-family:var(--mono);color:var(--ink);text-transform:none;letter-spacing:0}
input[type=range]{width:100%;accent-color:var(--accent)}
.f select,.check input{font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;padding:7px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;font:inherit;font-size:.85rem;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.vars.locked{opacity:.55;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts{margin-top:16px}
.btn{padding:9px 14px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--panel);font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--c5);outline-offset:2px}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;font-family:var(--mono);margin-top:10px}
.readout div{background:var(--bg);border-radius:6px;padding:8px;text-align:center}
.readout b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.readout span{font-size:.7rem;color:var(--muted);font-family:var(--body);text-transform:uppercase;letter-spacing:.04em}
.obs{font-size:.92rem;background:var(--bg);border-left:4px solid var(--accent);padding:8px 10px;border-radius:4px;min-height:2.6em;margin:10px 0 0}
.hint{color:var(--muted);font-size:.86rem;margin:10px 0 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td input,td select{font:inherit;width:100%;min-width:150px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
td.wide input{min-width:300px}
td.ok select{border:2px solid var(--ok)}td.bad select{border:2px solid var(--bad)}
tr.empty td{color:var(--muted);white-space:normal}
.tools{margin-top:10px}
.msg{font-size:.86rem;color:var(--muted)}
canvas.graph{width:100%;height:300px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.check{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.check input{width:120px}
.idgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.idgrid .ok select{border:2px solid var(--ok)}.idgrid .bad select{border:2px solid var(--bad)}
textarea{width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-height:80px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <div class="brand"><h1>N5 Chemistry Virtual Labs</h1><p>Change the variables, watch what happens, record your results.</p></div>
  <div class="navsel"><label class="lbl" for="labpick">Choose a lab</label><select id="labpick"></select></div>
  <nav class="index" aria-label="Labs"></nav>
  <main id="labs"></main>
</div>

<script src="../../shared/kit.js"></script>
<script>
/* ---------- shared helpers ---------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COLS=['--c1','--c2','--c3','--c4','--c5','--c6'];
const rnd=(a,b)=>a+Math.random()*(b-a);
const fx=(x,d)=>Number(x).toFixed(d);
const r05=x=>Math.round(x*20)/20;
const gauss=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const UNITS={u1:'Chemical changes and structure',u2:"Nature's chemistry",u3:'Chemistry in society'};

const UIC=[[2.5,'#d62828','red'],[4.5,'#f77f00','orange'],[6.5,'#e2c000','yellow'],[7.5,'#2a9d48','green'],[9.5,'#1f9e93','blue-green'],[11.5,'#2d6fd2','blue'],[99,'#6a2c91','purple']];
const uiCol=pH=>UIC.find(c=>pH<c[0]);

/* control builders */
function sl(p,k,label,min,max,step,val,unit,dp){return `<div class="f"><label for="${p}-${k}">${label}<output>${fx(val,dp)}${unit?' '+unit:''}</output></label><input type="range" id="${p}-${k}" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}" data-dp="${dp}"></div>`}
function sg(k,label,opts,val){return `<div class="f"><span class="lbl">${label}</span><div class="seg" data-k="${k}" role="group" aria-label="${label}">${opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<button type="button" data-v="${esc(v)}" aria-pressed="${v==val}">${t}</button>`}).join('')}</div></div>`}
function se(p,k,label,opts,val){return `<div class="f"><label for="${p}-${k}">${label}</label><select id="${p}-${k}" data-k="${k}">${opts.map(o=>`<option${o==val?' selected':''}>${o}</option>`).join('')}</select></div>`}

/* svg builders */
const TX=(x,y,s,o={})=>K.T(x,y,s,Object.assign({s:11},o));
const beaker=K.beaker,tube=K.tube,bub=K.bub,thermo=K.thermo;

/* graph */
function nice(r){const e=Math.pow(10,Math.floor(Math.log10(r/5)));const f=r/5/e;return (f<1.5?1:f<3.5?2:f<7.5?5:10)*e}
function plot(cv,o){
  const W=cv.clientWidth,H=cv.clientHeight;if(!W)return;const d=devicePixelRatio||1;cv.width=W*d;cv.height=H*d;const g=cv.getContext('2d');g.scale(d,d);
  const L=58,R=16,T=12,B=44,pw=W-L-R,ph=H-T-B,x0=o.xmin||0,y0=o.ymin||0;
  const X=x=>L+(x-x0)/(o.xmax-x0)*pw,Y=y=>T+ph-(y-y0)/(o.ymax-y0)*ph;
  const xs=o.xstep||nice(o.xmax-x0),ys=o.ystep||nice(o.ymax-y0);
  g.font='12px "IBM Plex Mono",monospace';g.lineWidth=1;g.strokeStyle=css('--line');g.fillStyle=css('--muted');
  for(let y=y0;y<=o.ymax+1e-9;y+=ys){g.beginPath();g.moveTo(L,Y(y));g.lineTo(W-R,Y(y));g.stroke();g.textAlign='right';g.fillText(+y.toFixed(3),L-6,Y(y)+4)}
  for(let x=x0;x<=o.xmax+1e-9;x+=xs){g.textAlign='center';g.fillText(+x.toFixed(3),X(x),T+ph+16)}
  g.strokeStyle=css('--muted');g.beginPath();g.moveTo(L,T);g.lineTo(L,T+ph);g.lineTo(W-R,T+ph);g.stroke();
  g.textAlign='center';g.fillText(o.xl,L+pw/2,H-6);g.save();g.translate(13,T+ph/2);g.rotate(-Math.PI/2);g.fillText(o.yl,0,0);g.restore();
  let any=false;
  o.series.forEach(s=>{if(!s.pts.length)return;if(!s.ref)any=true;const c=css(s.col);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=2;
    if(s.dash)g.setLineDash([6,4]);
    if(s.line!==false){g.beginPath();s.pts.forEach((p,i)=>i?g.lineTo(X(p.x),Y(p.y)):g.moveTo(X(p.x),Y(p.y)));g.stroke()}
    g.setLineDash([]);if(s.dots!==false)s.pts.forEach(p=>{g.beginPath();g.arc(X(p.x),Y(p.y),3.4,0,7);g.fill()})});
  if(!any){g.fillStyle=css('--muted');g.textAlign='center';g.fillText(o.empty||'Your results will be plotted here.',L+pw/2,T+ph/2)}
}

/* results table */
function Table(host,cols,empty){
  const hasAns=cols.some(c=>c.ans);
  host.innerHTML=`<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c.h}</th>`).join('')}</tr></thead><tbody></tbody></table></div><div class="row tools"><button type="button" class="btn ghost sm" data-t="copy">Copy table</button>${hasAns?'<button type="button" class="btn ghost sm" data-t="check">Check my answers</button>':''}<button type="button" class="btn ghost sm" data-t="clear">Clear table</button><span class="msg" aria-live="polite"></span></div>`;
  const tb=$('tbody',host),msg=$('.msg',host),api={rows:[],onClear:null};
  const blank=()=>{if(!tb.children.length)tb.innerHTML=`<tr class="empty"><td colspan="${cols.length}">${empty}</td></tr>`};blank();
  api.add=(vals,answers={})=>{$('.empty',tb)?.remove();const tr=document.createElement('tr');
    tr.innerHTML=cols.map((c,i)=>{const v=vals[i]??'';
      if(c.edit==='text')return `<td class="${c.wide?'wide':''}"><input aria-label="${esc(c.h)}" value="${esc(v)}"></td>`;
      if(c.edit==='select')return `<td><select aria-label="${esc(c.h)}" data-ans="${esc(answers[i]??'')}"><option value="">Choose…</option>${c.opts.map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('')}</select></td>`;
      return `<td>${v}</td>`}).join('');
    tb.appendChild(tr);api.rows.push(vals);msg.textContent=''};
  let armed=null;
  host.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t;
    if(t==='copy'){const lines=[cols.map(c=>c.h).join('\t')];$$('tr',tb).forEach(tr=>{if(tr.classList.contains('empty'))return;lines.push($$('td',tr).map(td=>{const i=$('input,select',td);return i?i.value:td.textContent}).join('\t'))});
      const txt=lines.join('\n');const done=()=>msg.textContent='Copied. Paste into a spreadsheet or document.';
      try{navigator.clipboard.writeText(txt).then(done,()=>msg.textContent='Copy was blocked. Select the table and copy it instead.')}catch(_){msg.textContent='Copy was blocked. Select the table and copy it instead.'}}
    if(t==='check'){let ok=0,n=0;$$('select[data-ans]',tb).forEach(s=>{if(!s.dataset.ans)return;n++;const td=s.parentElement;td.classList.remove('ok','bad');if(!s.value)return;const good=s.value===s.dataset.ans;td.classList.add(good?'ok':'bad');ok+=good});msg.textContent=n?`${ok} of ${n} correct.`:'Record some results first.'}
    if(t==='clear'){if(armed!==b){armed=b;b.textContent='Tap again to clear';setTimeout(()=>{armed=null;b.textContent='Clear table'},3000);return}
      armed=null;b.textContent='Clear table';tb.innerHTML='';api.rows.length=0;blank();msg.textContent='Table cleared.';api.onClear&&api.onClear()}});
  return api;
}

/* ---------- lab shell ---------- */
const LABS=[];
function shell(L){return `<section class="lab" id="lab-${L.id}" hidden>
<header><p class="unit">${UNITS[L.unit]}</p><h2>${L.name}</h2><p class="aim"><b>Aim:</b> ${L.aim}</p>${L.eq?`<p class="eq">${L.eq}</p>`:''}</header>
<div class="top"><div class="box"><svg class="rig" viewBox="0 0 460 260" role="img" aria-label="${L.svgLabel}"></svg><div class="readout"></div><p class="obs" aria-live="polite"></p></div>
<div class="box"><h3>Variables</h3><div class="vars">${L.controls(L.id)}</div><div class="row acts">${L.actions}</div>${L.hint?`<p class="hint">${L.hint}</p>`:''}${L.side?L.side(L.id):''}</div></div>
${L.graph?`<div class="box"><h3>${L.graph}</h3><canvas class="graph"></canvas><div class="legend"></div></div>`:''}
<div class="box"><h3>Results</h3><div class="tbl"></div>${L.extra?L.extra(L.id):''}</div>
<div class="box"><h3>Conclusion</h3><p class="hint" style="margin:0 0 8px">${L.concl}</p><textarea id="${L.id}-concl" aria-label="Conclusion"></textarea></div></section>`}

function mount(L){
  const root=$('#lab-'+L.id),st={...L.st};
  const A={root,st,
    svg:h=>{$('svg.rig',root).innerHTML=K.back()+h},
    read:items=>{$('.readout',root).innerHTML=items.map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('')},
    obs:t=>{$('.obs',root).textContent=t},
    cv:$('canvas.graph',root),
    legend:items=>{const el=$('.legend',root);if(el)el.innerHTML=items.map(([c,t])=>`<span><span class="dot" style="background:var(${c})"></span>${t}</span>`).join('')},
    lock:b=>$('.vars',root).classList.toggle('locked',b),
    redraw:()=>{},changed:()=>{},acts:{}};
  A.table=Table($('.tbl',root),L.cols,L.empty||'Record a result to start your table.');
  root.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k||!t.closest('.vars'))return;
    if(t.type==='range'){st[k]=+t.value;$('output',t.previousElementSibling).textContent=fx(+t.value,+t.dataset.dp)+(t.dataset.unit?' '+t.dataset.unit:'')}else st[k]=t.value;A.changed(k)});
  root.addEventListener('click',e=>{const b=e.target.closest('.seg button');if(b&&b.closest('.vars')){const g=b.parentElement;[...g.children].forEach(x=>x.setAttribute('aria-pressed',x===b));const v=b.dataset.v;st[g.dataset.k]=v!==''&&!isNaN(v)?+v:v;A.changed(g.dataset.k);return}
    const a=e.target.closest('[data-act]');if(a&&A.acts[a.dataset.act])A.acts[a.dataset.act](a)});
  L.init(A);L.A=A;
}

/* ===================================================================
   UNIT 1 — CHEMICAL CHANGES AND STRUCTURE
   =================================================================== */

LABS.push({id:'rates',unit:'u1',name:'Rates of reaction',
  aim:'Find how concentration, temperature and particle size affect the rate of reaction between marble chips and hydrochloric acid.',
  eq:'CaCO₃(s) + 2HCl(aq) → CaCl₂(aq) + H₂O(ℓ) + CO₂(g) · 20 cm³ acid, marble in excess',
  svgLabel:'Conical flask of acid and marble chips connected to a gas syringe',
  st:{c:.2,T:20,a:1,iv:10},
  controls:p=>sl(p,'c','Acid concentration',.05,.4,.05,.2,'mol l⁻¹',2)+sl(p,'T','Temperature',10,60,5,20,'°C',0)+sg('a','Particle size',[[1,'Large chips'],[2,'Small chips'],[5,'Powder']],1)+sg('iv','Reading every',[[10,'10 s'],[20,'20 s'],[30,'30 s']],10),
  actions:'<button type="button" class="btn" data-act="start">Start</button><button type="button" class="btn ghost" data-act="speed">Speed ×1</button><button type="button" class="btn ghost" data-act="reset">Clear graph</button>',
  hint:'Readings are recorded automatically. Change one variable at a time so the test is fair.',
  graph:'Volume of CO₂ against time',
  cols:[{h:'Run'},{h:'Time / s'},{h:'Volume CO₂ / cm³'},{h:'Mass lost / g'},{h:'Observation',edit:'text',wide:1}],
  extra:p=>`<h3 style="margin-top:18px">Run summary</h3><div class="tw"><table><thead><tr><th>Run</th><th>Conc. / mol l⁻¹</th><th>Temp / °C</th><th>Particles</th><th>Final volume / cm³</th><th>Time to finish / s</th><th>Average rate 0–30 s / cm³ s⁻¹</th></tr></thead><tbody class="sum"><tr class="empty"><td colspan="7">Each finished run is summarised here.</td></tr></tbody></table></div>`,
  concl:'Average rate = change in quantity ÷ change in time. Use collision theory to explain each trend.',
  init(A){const st=A.st;let run=null,runs=[],speed=1,last=0;const SZ={1:'Large chips',2:'Small chips',5:'Powder'};
    const vmax=c=>c*0.02/2*24000,kOf=s=>0.012*(s.c/0.2)*s.a*Math.pow(2,(s.T-20)/10);
    const desc=r=>r>3?'Very vigorous fizzing; froth rises up the flask.':r>1?'Rapid fizzing; lots of bubbles on the marble.':r>.3?'Steady fizzing.':r>.05?'Slow bubbling.':'Bubbling has stopped; some marble is left over.';
    function rig(V,rate){const B=K.BENCH,cx=95,base=B-6,top=base-132;
      const n=st.a===5?70:st.a===2?16:6,sz=st.a===5?1.6:st.a===2?5:9;
      const inside=K.chips(n,cx-42,cx+42,base-3,sz,st.a*7+3)+K.bub(Math.min(34,Math.round(rate*9)),cx-44,cx+44,base-30,base-6)+(rate>1.5?K.froth(cx-30,cx+30,base-29,Math.min(26,Math.round(rate*4))):'');
      A.svg(`<rect x="18" y="${B-74}" width="154" height="74" rx="4" fill="#e9eef0" fill-opacity=".35" stroke="#a9b6bb"/><rect x="20" y="${B-52}" width="150" height="50" fill="${K.WATER}" fill-opacity=".7"/>
        ${K.flask(cx,base,132,112,'var(--acid)',.2,{inside})}${K.bung(cx,top-8,27)}
        ${K.dtube(`M${cx} ${top-8} V44 Q${cx} 34 ${cx+10} 34 H196 Q206 34 206 44 V70 H214`)}
        ${K.stand(422,40,[[70,422]])}${K.syringe(212,70,200,V)}
        <rect x="18" y="${B-74}" width="154" height="74" rx="4" fill="#fff" fill-opacity=".12" stroke="#a9b6bb" stroke-width="1.5"/>
        <rect x="126" y="${B-22}" width="40" height="16" rx="3" fill="url(#kLCD)" stroke="#0005"/>${K.T(146,B-10,st.T+' °C',{s:9,f:'#1f2a18'})}
        ${K.T(312,104,'gas syringe / cm³',{s:10})}${K.TB(95,'water bath')}${K.TB(330,'marble chips + 20 cm³ acid',{s:9.5})}`)}
    function show(t,V,rate){rig(V,rate);A.read([[fx(t,0),'time / s'],[fx(V,1),'CO₂ / cm³'],[fx(V/24000*44,3),'mass lost / g']])}
    A.redraw=()=>{const all=[...runs,...(run&&run.go?[run]:[])];const tm=Math.max(60,...all.map(r=>r.pts.at(-1).x));
      plot(A.cv,{series:all.map(r=>({pts:r.pts,col:r.col})),xl:'time / s',yl:'volume CO₂ / cm³',xmax:Math.ceil(tm/60)*60,ymax:100,empty:'Each run is plotted in its own colour.'});
      A.legend(all.map((r,i)=>[r.col,`Run ${i+1}: ${fx(r.c,2)} mol l⁻¹, ${r.T} °C, ${SZ[r.a].toLowerCase()}`]))};
    const row=(t,v,o)=>A.table.add([runs.length+1,t,fx(v,1),fx(v/24000*44,3),o]);
    function step(now){const dt=(now-last)/1000*speed;last=now;const prev=run.t;run.t+=dt;
      const V=run.V0*(1-Math.exp(-run.k*run.t)),rate=run.V0*run.k*Math.exp(-run.k*run.t);
      for(let tt=Math.ceil((prev+1e-9)/run.iv)*run.iv;tt<=run.t;tt+=run.iv){const vr=Math.max(0,Math.round((run.V0*(1-Math.exp(-run.k*tt))+gauss()*.3)*2)/2);
        run.pts.push({x:tt,y:vr});row(tt,vr,desc(run.V0*run.k*Math.exp(-run.k*tt)));if(!run.done&&run.V0-vr<.5)run.done=tt}
      show(run.t,V,rate);A.redraw();A.obs(desc(rate));
      if((run.done&&run.pts.at(-1).x>=run.done+2*run.iv)||run.t>600){finish();return}requestAnimationFrame(step)}
    function finish(){run.go=false;runs.push(run);A.lock(false);$('[data-act=start]',A.root).disabled=false;
      A.obs('Reaction complete. Change one variable and run again.');
      $('.sum',A.root).innerHTML=runs.map((r,i)=>{const a=r.pts.find(p=>p.x>=30)||r.pts.at(-1);return `<tr><td><span class="dot" style="background:var(${r.col})"></span>${i+1}</td><td>${fx(r.c,2)}</td><td>${r.T}</td><td>${SZ[r.a]}</td><td>${fx(r.pts.at(-1).y,1)}</td><td>${r.done||Math.round(r.t)}</td><td>${fx(a.y/a.x,2)}</td></tr>`}).join('');A.redraw()}
    A.acts.start=b=>{if(run&&run.go)return;run={...st,k:kOf(st),V0:vmax(st.c),t:0,pts:[{x:0,y:0}],go:true,col:COLS[runs.length%6]};
      row(0,0,'Marble added to the acid and bung inserted.');A.lock(true);b.disabled=true;last=performance.now();requestAnimationFrame(step)};
    A.acts.speed=b=>{speed=speed===1?5:speed===5?20:1;b.textContent='Speed ×'+speed};
    A.acts.reset=()=>{if(run&&run.go)return;runs=[];run=null;$('.sum',A.root).innerHTML='<tr class="empty"><td colspan="7">Each finished run is summarised here.</td></tr>';show(0,0,0);A.redraw()};
    A.changed=()=>show(0,0,0);show(0,0,0);A.obs('Set your conditions, then press Start.')}});

LABS.push({id:'titration',unit:'u1',name:'Titration',
  aim:'Find the concentration of a sodium hydroxide solution by titrating it with hydrochloric acid of known concentration.',
  eq:'HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(ℓ) · 20.0 cm³ of sodium hydroxide pipetted into the flask',
  svgLabel:'Burette of acid above a conical flask containing alkali and indicator',
  st:{s:'A',c:.1,ind:'Phenolphthalein'},
  controls:p=>sg('s','Sodium hydroxide sample',[['A','Sample A'],['B','Sample B'],['C','Sample C']],'A')+sg('c','Acid in burette',[[.1,'0.10 mol l⁻¹'],[.2,'0.20 mol l⁻¹']],.1)+sg('ind','Indicator',['Phenolphthalein','Methyl orange','Universal indicator'],'Phenolphthalein'),
  actions:'<button type="button" class="btn" data-act="a1">Add 1.0 cm³</button><button type="button" class="btn" data-act="a01">Add 0.1 cm³</button><button type="button" class="btn ghost" data-act="rec">Record titre</button><button type="button" class="btn ghost" data-act="nf">New flask</button>',
  hint:'Do a rough titration first, then accurate ones adding acid 0.1 cm³ at a time near the end-point. Changing the sample, acid or indicator starts a new flask.',
  cols:[{h:'Sample'},{h:'Acid / mol l⁻¹'},{h:'Titration'},{h:'Initial reading / cm³'},{h:'Final reading / cm³'},{h:'Titre / cm³'},{h:'Notes',edit:'text',wide:1}],
  extra:p=>`<p class="hint" id="${p}-mean">Concordant titres are within 0.2 cm³ of each other.</p><div class="check"><label for="${p}-ans" class="lbl">Concentration of NaOH (mol l⁻¹)</label><input id="${p}-ans" inputmode="decimal" placeholder="0.000"><button type="button" class="btn sm" data-act="chk">Check</button><span class="msg" id="${p}-chkmsg" aria-live="polite"></span></div>`,
  concl:'Show your calculation: moles of acid = c × V, use the mole ratio, then c = n ÷ V for the alkali.',
  init(A){const st=A.st,NAOH={A:.08,B:.115,C:.15};let read=r05(rnd(.2,1.4)),start=read,flask=0,done=false;const count={};
    const pH=()=>{const nOH=NAOH[st.s]*.02,nH=st.c*flask/1000,V=(20+flask)/1000;if(Math.abs(nOH-nH)<1e-10)return 7;return nOH>nH?14+Math.log10((nOH-nH)/V):-Math.log10((nH-nOH)/V)};
    const ind=p=>st.ind==='Phenolphthalein'?(p>8.3?['#e0389a','pink']:['transparent','colourless']):st.ind==='Methyl orange'?(p<3.4?['#d62828','red']:p<4.4?['#f08c00','orange']:['#f2c200','yellow']):(c=>[c[1],c[2]])(uiCol(p));
    function show(){const p=pH(),[col,name]=ind(p),ly=15+read/50*170;let tk='';
      for(let v=0;v<=50;v+=5){const y=15+v/50*170;tk+=`<line x1="214" y1="${y}" x2="${v%10?220:224}" y2="${y}" stroke="var(--muted)"/>`;if(v%10===0)tk+=TX(208,y+4,v,{s:10,a:'end'})}
      const fl=col==='transparent'?'var(--acid)':col;
      A.svg(`${K.stand(165,8,[[14,213],[134,213]])}${K.burette(206,24,124,Math.min(50.5,read),'var(--acid)')}
        ${K.tile(213,110)}${K.flask(213,K.BENCH-4,62,84,fl,.42,{op:col==='transparent'?1:.85,nw:24,nh:20})}
        ${K.lens(352,92,54,Math.min(50,read),'var(--acid)')}${K.tag(352,172,'reading '+fx(read,2)+' cm³',{s:11})}
        ${K.T(10,40,'NaOH sample '+st.s,{s:11,f:'var(--ink)',a:'start'})}${K.T(10,56,'20.0 cm³ +',{s:9.5,a:'start'})}${K.T(10,70,st.ind.toLowerCase(),{s:9.5,a:'start'})}${K.T(10,84,'flask: '+name,{s:9.5,a:'start'})}${K.TB(213,'white tile')}`);
      A.read([[fx(start,2),'initial / cm³'],[fx(read,2),'reading / cm³'],[fx(read-start,2),'acid added / cm³']]);
      const veq=NAOH[st.s]*20/st.c,gap=veq-flask;

    function newFlask(){if(read>30){read=r05(rnd(.2,1.4))}start=read;flask=0;done=false;show()}
    function add(v){if(read+v>50.001){A.obs('Not enough acid left. Press New flask to refill the burette.');return}flask+=v;read=Math.round((read+v)*100)/100;show()}

        ${K.wire(`M403 78 C403 120 ${ex2+30} 40 ${ex2} 76`,'#1d1d1d')}${K.croc(ex2,78,'#1d1d1d')}
        ${K.TB(cx,st.sub+' · '+st.state.toLowerCase())}${r&&!r.can?K.tag(cx,118,'cannot be tested this way',{f:'var(--bad)'}):''}`);

LABS.push({id:'fuels',unit:'u2',name:'Energy from fuels',

    function draw(){const c1=PCOLS[real()]||'#f2f6f8',c2=PCOLS[st.b]||'#f2f6f8';const base=mixHex(c1,c2,.5);
      const B=K.BENCH,tx=205,ty=70,th=150,tw=32,bt=ty+th,lv=.5,ly=bt-(th-6)*lv;
      const inside=res&&res.p?`<rect x="${tx+2}" y="${(ly+4).toFixed(1)}" width="${tw-4}" height="${(bt-ly-10).toFixed(1)}" fill="${res.p[2]}" opacity="${(.55*k*(1.2-k*.5)).toFixed(2)}" filter="url(#kHaze)"/><path d="M${tx+2} ${(bt-14-14*k).toFixed(1)} V${bt-16} A14 14 0 0 0 ${tx+tw-2} ${bt-16} V${(bt-14-14*k).toFixed(1)} Z" fill="${res.p[2]}" opacity="${(.95*k).toFixed(2)}"/>`:'';
      A.svg(`${K.rack(150,150,[221,276])}${K.tube(tx,ty,th,res?base:'var(--acid)',lv,tw,{inside,op:.85})}${K.tube(263,110,110,'var(--acid)',0,26)}${K.rackFront(150,150)}
        ${K.dropper(50,B-62,st.a==='Unknown solution U'?'var(--acid)':c1,st.a==='Unknown solution U'?'U':st.a.split(' ')[0])}${K.dropper(372,B-62,c2,st.b.split(' ')[0])}
        ${res&&k<1?`<path d="M${tx+tw/2-3} 12 h6 v38 l-2 10 h-2 l-2 -10 z" fill="url(#kGlass)" stroke="${K.GL}"/><path d="M${tx+tw/2-4} 0 h8 v13 h-8z" fill="#2b2b2b"/>${K.drop(tx+tw/2,70+k*60,c2)}`:''}`);
      A.read([[res?(res.p?res.p[1]:'none'):'—','precipitate colour']])}
    A.acts.mix=b=>{if(busy)return;busy=true;b.disabled=true;res={p:find()};const t0=performance.now();
      const step=n=>{k=Math.min(1,(n-t0)/1200);draw();if(k<1){requestAnimationFrame(step);return}busy=false;b.disabled=false;
        let o=res.p?`A ${res.p[1]} precipitate forms.`:'No precipitate: the mixture stays clear.';if(real()==='Iron(III) chloride'&&st.b==='Potassium iodide'){o='The solution turns darker brown (a redox reaction makes iodine); no precipitate.'}
        if(res.p&&res.p[0]==='Calcium hydroxide')o='A faint white cloudiness forms (calcium hydroxide is only slightly soluble).';
        A.obs(o);A.table.add([st.a,st.b,o,'',''],{3:res.p?res.p[0]:'No precipitate'})};requestAnimationFrame(step)};
    A.acts.chk=()=>{const v=$('#precip-u').value;$('#precip-umsg').textContent=!v?'Choose an answer.':v===U?'Correct!':'Not right. Try more test solutions.'};
    A.changed=()=>{res=null;k=0;draw()};draw();A.obs('Choose two solutions and mix them.')}});

/* ---------- Flame tests ---------- */
const FLAME={Lithium:['#d21f3c','red'],Sodium:['#ffb400','yellow'],Potassium:['#b98ee6','lilac'],Calcium:['#ff6a1a','orange-red'],Copper:['#2fbf9b','blue-green'],Barium:['#8fd14f','green'],Strontium:['#e3132d','red']};
const FKEYS=Object.keys(FLAME);
LABS.push({id:'flame',unit:'u3',name:'Flame tests',
  aim:'Identify metal ions from the colour they give to a flame, and find the metals in three unknown samples.',
  eq:'Flame colours are listed in the data booklet. A clean loop matters: sodium contamination gives a strong yellow flame.',
  svgLabel:'Bunsen burner flame with a wire loop holding the sample',
  st:{m:'Lithium chloride',clean:'yes'},
  controls:p=>`<div class="f"><label for="${p}-m">Sample</label><select id="${p}-m" data-k="m"><optgroup label="Known compounds">${FKEYS.map(k=>`<option>${k} chloride</option>`).join('')}</optgroup><optgroup label="Unknowns"><option>Unknown X</option><option>Unknown Y</option><option>Unknown Z</option></optgroup></select></div>`+sg('clean','Clean the loop first',[['yes','Yes, in acid'],['no','No']],'yes'),
  actions:'<button type="button" class="btn" data-act="test">Hold in the flame</button>',
  hint:'Lithium and strontium both give red flames, so they are hard to tell apart.',
  side:p=>`<div class="check" style="display:block"><div class="idgrid">${['X','Y','Z'].map(u=>`<div><label class="lbl" for="${p}-u${u}">Unknown ${u}</label><select id="${p}-u${u}"><option value="">Choose…</option>${FKEYS.map(k=>`<option>${k}</option>`).join('')}</select></div>`).join('')}</div><div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-act="chk">Check unknowns</button><span class="msg" id="${p}-fmsg" aria-live="polite"></span></div></div>`,
  cols:[{h:'Sample'},{h:'Flame colour'},{h:'Metal ion',edit:'select',opts:FKEYS,ans:1}],
  concl:'Explain why a clean loop is needed. Suggest why flame tests cannot always identify a metal on their own.',
  init(A){const st=A.st;const pool=shuffle(FKEYS.filter(k=>k!=='Strontium'));const UNK={'Unknown X':pool[0],'Unknown Y':pool[1],'Unknown Z':pool[2]};let lit=null,dirty=false;
    const metal=()=>UNK[st.m]||st.m.replace(' chloride','');
    function draw(){const B=K.BENCH;A.svg(`${K.bunsen(210,lit||'blue')}
      <path d="M400 54 L250 120" stroke="#8a6a3a" stroke-width="7" stroke-linecap="round"/><path d="M252 119 L223 132" stroke="#b9bfc3" stroke-width="1.5"/><circle cx="219" cy="134" r="4.5" fill="none" stroke="#c9ced2" stroke-width="1.6"/>
      ${K.beaker(40,170,56,62,'rgba(220,235,240,.6)',.6)}${K.T(68,160,'acid to clean the loop',{s:9})}
      ${K.shadow(340,60)}<path d="M310 ${B-2} q30 -10 60 0" fill="url(#kGlass)" stroke="${K.GL}"/>${K.heap(340,B-5,26,'#f4f4f0')}
      ${K.T(110,40,st.m,{s:12,f:'var(--ink)'})}${K.TB(210,'Bunsen burner',{s:9.5})}${K.TB(340,'sample',{s:9.5})}`);
      A.read([[lit?'lit':'blue','flame']])}
    A.acts.test=()=>{const m=metal(),f=FLAME[m];let col=f[0],name=f[1];if(st.clean==='no'&&dirty&&m!=='Sodium'){col=mixHex(f[0],'#ffb400',.55);name=f[1]+', hidden by a strong yellow'}
      lit=col;draw();dirty=true;A.obs(`The flame turns ${name}.`);A.table.add([st.m,name],{2:m});setTimeout(()=>{lit=null;draw()},1600)};
    A.acts.chk=()=>{let ok=0,n=0;['X','Y','Z'].forEach(u=>{const s=$('#flame-u'+u);if(!s.value)return;n++;const g=s.value===UNK['Unknown '+u];s.parentElement.className=g?'ok':'bad';ok+=g});$('#flame-fmsg').textContent=n?`${ok} of ${n} correct.`:'Choose at least one answer.'};
    A.changed=k=>{if(k==='clean'&&st.clean==='yes')dirty=false;draw()};draw();A.obs('Clean the loop, dip it in a sample and hold it in the flame.')}});

/* ---------- Chromatography of food dyes ---------- */
const DYES=[['Red dye R1',.52,'#d6283a'],['Yellow dye Y1',.78,'#f2c200'],['Blue dye B1',.90,'#2d6fd2'],['Red dye R2',.30,'#a8123f'],['Yellow dye Y2',.62,'#e9a400']];
LABS.push(chromLab({id:'chromatography',unit:'u3',name:'Chromatography of food dyes',
  aim:'Separate the dyes in coloured sweets by paper chromatography and identify them by comparing with known dyes.',
  eq:'Solvent: water · each dye moves a different distance depending on how soluble it is and how strongly it sticks to the paper',
  std:DYES,samples:[['Red dye R1',['Red dye R1']],['Yellow dye Y1',['Yellow dye Y1']],['Blue dye B1',['Blue dye B1']],['Orange sweet','?'],['Green sweet','?'],['Red dye R2',['Red dye R2']],['Yellow dye Y2',['Yellow dye Y2']]],
  unknowns:['Orange sweet','Green sweet'],idTitle:'Which dyes are in each sweet?',pick:u=>{const r=Math.random()<.5?'Red dye R1':'Red dye R2',y=Math.random()<.5?'Yellow dye Y1':'Yellow dye Y2';return u==='Orange sweet'?[r,y]:[y,'Blue dye B1']},
  concl:'Identify the dyes in each sweet. Explain how chromatography separates the dyes and why the start line is drawn in pencil.'}));

/* ---------- navigation: one experiment at a time (menu is index.html) ---------- */
LK.init('n5');
$('#labs').innerHTML=LABS.map(shell).join('');
LABS.forEach(mount);
let current=null;
function open(id){const L=LABS.find(l=>l.id===id);if(!L){location.replace('index.html');return}current=L;
  $$('.lab').forEach(s=>s.hidden=s.id!=='lab-'+L.id);try{history.replaceState(null,'','#'+L.id)}catch(_){}
  const root=$('#lab-'+L.id);LK.attach(L.id,{root,after:$('header',root)});L.A.redraw();window.scrollTo(0,0)}
addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id&&(!current||current.id!==id))open(id)});
addEventListener('resize',()=>current&&current.A.redraw());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>current&&current.A.redraw());
open((location.hash||'').slice(1));
</script>
