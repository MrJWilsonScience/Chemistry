const LEVEL="N5";

const cap1=s=>s[0].toUpperCase()+s.slice(1);

const RAM_H={H:1.0,He:4.0,Li:6.9,Be:9.0,B:10.8,C:12.0,N:14.0,O:16.0,F:19.0,Ne:20.2,Na:23.0,Mg:24.3,Al:27.0,Si:28.1,P:31.0,S:32.1,Cl:35.5,Ar:39.9,K:39.1,Ca:40.1,Ti:47.9,V:50.9,Cr:52.0,Mn:54.9,Fe:55.8,Co:58.9,Ni:58.7,Cu:63.5,Zn:65.4,Br:79.9,Rb:85.5,Sr:87.6,Ag:107.9,Sn:118.7,I:126.9,Ba:137.3,Hg:200.6,Pb:207.2};

const SOLTAB={aluminium:"vs - vs vs vs i vs i i",ammonium:"vs vs vs vs vs vs vs - -",barium:"vs i vs vs vs i i vs vs",calcium:"vs i vs vs vs i s s s","copper(II)":"vs i vs - vs i vs i i","iron(II)":"vs i vs vs vs i vs i i","iron(III)":"vs - vs - vs i vs i i","lead(II)":"s i s i vs i i i i",lithium:"vs vs vs vs vs i vs vs vs",magnesium:"vs i vs vs vs i vs i i",nickel:"vs i vs vs vs i vs i i",potassium:"vs vs vs vs vs vs vs vs vs",silver:"i i i i vs i s i -",sodium:"vs vs vs vs vs vs vs vs vs","tin(II)":"vs i vs s - i vs i i",zinc:"vs i vs vs vs i vs i i"};

function parse(f){const tok=f.match(/[A-Z][a-z]?|\d+|\(|\)/g),st=[{}];let i=0;
  const merge=(a,b,k)=>{for(const x in b)a[x]=(a[x]||0)+b[x]*k;};
  while(i<tok.length){const t=tok[i++];

const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const gcd=(a,b)=>b?gcd(b,a%b):a, lcm=(a,b)=>a*b/gcd(a,b);
function sf(x,n=3){if(!isFinite(x))return"?";if(x===0)return"0";const d=n-1-Math.floor(Math.log10(Math.abs(x)));
  if(d<=0){const p=10**(-d);return String(Math.round(x/p)*p)}return(Math.round(x*10**d)/10**d).toFixed(d)}
const fx=(x,d)=>(Math.round(x*10**d)/10**d).toFixed(d);
/* chemical text: digits after a letter or ) become subscripts, ^{..} superscript */
function chem(s){return s.split(/(\^\{[^}]*\})/).map(p=>p.startsWith("^{")?`<sup>${p.slice(2,-1)}</sup>`:p.replace(/([A-Za-z\)•])(\d+)/g,"$1<sub>$2</sub>")).join("")}
const cf=x=>x===1?"":Number.isInteger(x)?String(x):(Math.floor(x)||"")+"½";

/* ---------- molecule model ---------- */
function Mol(){this.atoms=[];this.bonds=[]}
Mol.prototype.add=function(el,x,y,p){this.atoms.push(Object.assign({el,x,y},p||{}));return this.atoms.length-1};
Mol.prototype.bond=function(a,b,o=1){this.bonds.push({a,b,o})};
const clone=m=>Object.assign(new Mol(),JSON.parse(JSON.stringify(m)));
const VAL={C:4,N:3,O:2,S:2};
const nbrs=(m,i)=>m.bonds.filter(b=>b.a===i||b.b===i).map(b=>({j:b.a===i?b.b:b.a,o:b.o}));
function hCount(m,i){const a=m.atoms[i];if(!VAL[a.el])return 0;let o=0;m.bonds.forEach(b=>{if(b.a===i||b.b===i)o+=b.o});return Math.max(0,VAL[a.el]-o+(a.chg||0))}
function mrOf(m){const W={C:12,O:16,N:14,S:32};let t=0;m.atoms.forEach((a,i)=>{t+=(W[a.el]||0)+hCount(m,i)});return t}
function formulaOf(m){const c={C:0,H:0,N:0,O:0,S:0};m.atoms.forEach((a,i)=>{if(c[a.el]!==undefined)c[a.el]++;c.H+=hCount(m,i)});
  return["C","H","N","O","S"].filter(e=>c[e]).map(e=>e+(c[e]>1?c[e]:"")).join("")}

/* svg text with sub/superscripts */
function svgText(s){let out="",off=0,i=0;const emit=(t,dy,fs)=>{out+=`<tspan dy="${dy}"${fs?` font-size="${fs}"`:""}>${t}</tspan>`};
  const isSub=j=>/\d/.test(s[j])&&j>0&&/[A-Za-z\)]/.test(s[j-1]);
  while(i<s.length){
    if(s.startsWith("^{",i)){const j=s.indexOf("}",i);emit(s.slice(i+2,j),-10-off,16);off=-10;i=j+1;continue}
    if(isSub(i)){let j=i;while(/\d/.test(s[j]||""))j++;emit(s.slice(i,j),6-off,16);off=6;i=j;continue}
    let j=i;while(j<s.length&&!s.startsWith("^{",j)&&!isSub(j))j++;emit(s.slice(i,j),-off);off=0;i=j}
  return out}
const textW=s=>{let w=0,i=0;const isSub=j=>/\d/.test(s[j])&&j>0&&/[A-Za-z\)]/.test(s[j-1]);
  while(i<s.length){if(s.startsWith("^{",i)){const j=s.indexOf("}",i);w+=(j-i-2)*10;i=j+1}else{w+=isSub(i)?10:/[ ]/.test(s[i])?7:15;i++}}return w};

/* draw one molecule; returns svg body + bbox */
function render(m,o){
  const full=o.full!==false,showH=o.showH!==false,UX=full?70:92,UY=70,A=m.atoms,lab=[],wid=[],skip=new Set();
  A.forEach((a,i)=>{const ns=nbrs(m,i),h=hCount(m,i);
    if(a.lab)lab[i]=a.lab;else if(full)lab[i]=a.el;
    else{const cn=ns.filter(n=>A[n.j].el==="C"),right=cn.length&&A[cn[0].j].x>a.x+.1;
      if(a.fg==="acid"){ns.filter(n=>A[n.j].el==="O").forEach(n=>skip.add(n.j));lab[i]=!cn.length?"HCOOH":right?"HOOC":"COOH"}
      else if(a.fg==="ald"){ns.filter(n=>A[n.j].el==="O").forEach(n=>skip.add(n.j));lab[i]=!cn.length?"HCHO":right?"OHC":"CHO"}
      else{const Hs=h?"H"+(h>1?h:""):"";const lead=ns.length===1&&A[ns[0].j].x>a.x+.1&&Math.abs(A[ns[0].j].y-a.y)<.1;lab[i]=lead?Hs+a.el:a.el+Hs}}
    wid[i]=Math.max(18,textW(lab[i]))});
  const ko=A.map((a,i)=>{const L=lab[i];if(!L||skip.has(i)||L===a.el)return 0;const nh=nbrs(m,i).filter(n=>!skip.has(n.j)).length;if(nh<1)return 0;
    if(nh>1){const ns2=nbrs(m,i).filter(n=>!skip.has(n.j));if(ns2.every(n=>Math.abs(A[n.j].y-a.y)<.1))return 0;}
    const ew=textW(a.el);if(L.startsWith(a.el))return -(wid[i]-ew)/2;if(L.endsWith(a.el))return (wid[i]-ew)/2;return 0});
  const ext=(i,ux)=>ux>0?wid[i]/2-ko[i]:ux<0?wid[i]/2+ko[i]:wid[i]/2;
  let s="";const pts=[];
  m.bonds.forEach(b=>{if(skip.has(b.a)||skip.has(b.b))return;const P=A[b.a],Q=A[b.b];
    const x1=P.x*UX,y1=P.y*UY,x2=Q.x*UX,y2=Q.y*UY,L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L;
    const t1=Math.abs(ux)*(ext(b.a,ux)+5)+Math.abs(uy)*15,t2=Math.abs(ux)*(ext(b.b,-ux)+5)+Math.abs(uy)*15;
    const ax=x1+ux*t1,ay=y1+uy*t1,bx=x2-ux*t2,by=y2-uy*t2;
    (b.o===2?[-4,4]:b.o===3?[-6,0,6]:[0]).forEach(k=>s+=`<line x1="${ax-uy*k}" y1="${ay+ux*k}" x2="${bx-uy*k}" y2="${by+ux*k}" class="bd"/>`)});
  if(full)A.forEach((a,i)=>{const h=hCount(m,i);if(!h||a.lab)return;const ns=nbrs(m,i);
    const used=new Set(ns.map(n=>Math.sign(A[n.j].x-a.x)+","+Math.sign(A[n.j].y-a.y)));
    if(a.hd){a.hd.slice(0,h).forEach(([dx,dy])=>{if(!showH)return;const x=a.x*UX,y=a.y*UY,L=UY*.56;pts.push([x+dx*L,y+dy*L]);
      s+=`<line x1="${x+dx*14}" y1="${y+dy*14}" x2="${x+dx*(L-11)}" y2="${y+dy*(L-11)}" class="hb"/><text x="${x+dx*L}" y="${y+dy*L}" class="hh">H</text>`});return}
    const dirs=[[0,-1],[0,1],[-1,0],[1,0]];if(a.el!=="C"&&ns.length){const p=A[ns[0].j];dirs.unshift([-Math.sign(p.x-a.x),-Math.sign(p.y-a.y)])}
    const free=[];dirs.forEach(d=>{const k=d+"";if(used.has(k)||free.some(f=>f+""===k))return;
      if(A.some(b=>b!==a&&Math.abs(b.x-(a.x+d[0]*.6))<.55&&Math.abs(b.y-(a.y+d[1]*.6))<.55))return;free.push(d)});
    free.slice(0,h).forEach(([dx,dy])=>{if(!showH)return;const x=a.x*UX,y=a.y*UY,L=UY*.56;pts.push([x+dx*L,y+dy*L]);
      s+=`<line x1="${x+dx*14}" y1="${y+dy*14}" x2="${x+dx*(L-11)}" y2="${y+dy*(L-11)}" class="hb"/><text x="${x+dx*L}" y="${y+dy*L}" class="hh">H</text>`})});
  (o.boxes||[]).forEach(([x0,y0,x1,y1])=>s+=`<rect x="${x0*UX}" y="${y0*UY}" width="${(x1-x0)*UX}" height="${(y1-y0)*UY}" rx="10" class="box"/>`);
  (o.hl||[]).forEach(i=>{const a=A[i];s+=`<ellipse cx="${a.x*UX-ko[i]}" cy="${a.y*UY}" rx="${wid[i]/2+11}" ry="21" class="ring"/>`});
  A.forEach((a,i)=>{if(skip.has(i))return;pts.push([a.x*UX-ko[i]-wid[i]/2,a.y*UY],[a.x*UX-ko[i]+wid[i]/2,a.y*UY]);
    s+=`<text x="${a.x*UX-ko[i]}" y="${a.y*UY}" class="lb">${svgText(lab[i])}</text>`});
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),P=26;
  return{body:s,minx:Math.min(...xs)-P,maxx:Math.max(...xs)+P,miny:Math.min(...ys)-P-10,maxy:Math.max(...ys)+P+10}}

/* lay several molecules / operators out in a row */
function compose(items,o){let x=0,parts=[],miny=-70,maxy=70;
  items.forEach(it=>{if(typeof it==="string"){const w=textW(it)+44;parts.push(`<text x="${x+w/2}" y="0" class="lb op">${svgText(it)}</text>`);x+=w;return}
    const r=render(it,Object.assign({},o,it.opts||{}));parts.push(`<g transform="translate(${x-r.minx},0)">${r.body}</g>`);
    x+=r.maxx-r.minx;miny=Math.min(miny,r.miny);maxy=Math.max(maxy,r.maxy)});
  return`<div class="molwrap"><svg class="mol" viewBox="0 ${miny} ${x} ${maxy-miny}" style="aspect-ratio:${x}/${maxy-miny};max-width:${Math.round(x*1.15)}px;margin:0 auto" role="img" aria-label="Structural formula">${parts.join("")}</svg></div>`}

/* ---------- systematic naming (main chain up to 8) ---------- */
const PRE=["","meth","eth","prop","but","pent","hex","hept","oct"],MULT=["","","di","tri","tetra","penta","hexa"];
function nameOf(m){const A=m.atoms,C=A.map((a,i)=>a.el==="C"?i:-1).filter(i=>i>=0),adj={};C.forEach(i=>adj[i]=[]);
  m.bonds.forEach(b=>{if(A[b.a].el==="C"&&A[b.b].el==="C"){adj[b.a].push(b.b);adj[b.b].push(b.a)}});
  const R=C.filter(i=>A[i].fg),terms=C.filter(i=>adj[i].length<=1);
  const path=(s,t)=>{const par={};par[s]=-1;const q=[s];while(q.length){const u=q.shift();for(const v of adj[u])if(!(v in par)){par[v]=u;q.push(v)}}
    const p=[];let x=t;while(x!==-1){p.push(x);x=par[x]}return p.reverse()};
  let cands=C.length===1?[[C[0]]]:[];for(const s of terms)for(const t of terms)if(s!==t)cands.push(path(s,t));
  cands=cands.filter(p=>R.every(r=>p.includes(r)));if(!cands.length)return null;
  const L=Math.max(...cands.map(p=>p.length));if(L>8)return null;cands=cands.filter(p=>p.length===L);
  const size=(n,f,S)=>{let c=1;for(const v of adj[n])if(v!==f&&!S.has(v))c+=size(v,n,S);return c};
  const HALN={F:"fluoro",Cl:"chloro",Br:"bromo",I:"iodo"};
  const info=cands.map(p=>{const S=new Set(p),subs=[];p.forEach((a,k)=>{adj[a].forEach(nb=>{if(!S.has(nb)){const z=size(nb,a,S);subs.push({loc:k+1,size:z,nm:["","methyl","ethyl","propyl"][z]||"x"})}});
      m.bonds.forEach(b=>{const o=b.a===a?b.b:b.b===a?b.a:-1;if(o>=0&&HALN[A[o].el])subs.push({loc:k+1,size:0,nm:HALN[A[o].el]})})});
    return{subs,fl:R.map(r=>p.indexOf(r)+1).sort((x,y)=>x-y),locs:subs.map(s=>s.loc).sort((x,y)=>x-y),
      cite:[...subs].sort((x,y)=>x.nm<y.nm?-1:x.nm>y.nm?1:x.loc-y.loc).map(s=>s.loc)}});
  const mx=Math.max(...info.map(i=>i.subs.length)),lex=(a,b)=>{for(let i=0;i<a.length;i++)if(a[i]!==b[i])return a[i]-b[i];return 0};
  const best=info.filter(i=>i.subs.length===mx).sort((a,b)=>lex(a.fl,b.fl)||lex(a.locs,b.locs)||lex(a.cite,b.cite))[0];
  if(best.subs.some(s=>s.size>3))return null;
  const g={};best.subs.forEach(s=>{const k=s.nm;(g[k]=g[k]||[]).push(s.loc)});
  const pre=Object.keys(g).sort().map(k=>g[k].sort((x,y)=>x-y).join(",")+"-"+MULT[g[k].length]+k).join("-");
  const st=PRE[L],fl=best.fl,f=m.fam;
  if(f==="alkane")return pre+st+"ane";
  if(f==="alkene")return pre+(L===2?"ethene":L===3?"propene":st+"-"+fl[0]+"-ene");
  if(f==="alcohol")return pre+(L<=2?st+"anol":st+"an-"+fl[0]+"-ol");
  if(f==="aldehyde")return fl[0]===1?pre+st+"anal":null;
  if(f==="acid")return fl[0]===1?pre+st+"anoic acid":null;
  if(f==="ketone"){if(!pre&&L===3)return"propanone";if(!pre&&L===4)return"butanone";return pre+st+"an-"+fl[0]+"-one"}
  return null}

/* random alcohol (optionally of a set class) */
function buildAlc(cls){
  for(let t=0;t<5000;t++){const n=rnd(1,6),p=rnd(0,n-1),m=new Mol(),occ={"-1":{},"1":{}},used=[];
    for(let i=0;i<n;i++){m.add("C",i,0);used.push((i>0)+(i<n-1));if(i)m.bond(i-1,i)}
    const side=q=>{const s=shuffle([-1,1]).find(s=>!occ[s][q]&&!occ[s][q-1]&&!occ[s][q+1]);if(s!==undefined)occ[s][q]=1;return s};
    let O;if(n===1||p===0)O=m.add("O",-1,0);else if(p===n-1)O=m.add("O",n,0);else O=m.add("O",p,side(p));
    m.bond(p,O);used[p]++;m.atoms[p].fg="oh";
    let tot=n;const want=cls==="tertiary"?rnd(1,3):rnd(0,3);
    for(let b=0;b<want;b++){const sz=Math.random()<.6?1:2;if(n<3||tot+sz>8)continue;const q=(cls==="tertiary"&&b===0&&p>0&&p<n-1)?p:rnd(1,n-2);
      if(used[q]>=4)continue;const s=side(q);if(s===undefined)continue;used[q]++;tot+=sz;let prev=q;
      for(let j=1;j<=sz;j++){const c=m.add("C",q,s*j);m.bond(prev,c);prev=c}}
    m.fam="alcohol";const nm=nameOf(m);if(!nm)continue;m.name=nm;
    const k=m.bonds.filter(b=>(b.a===p||b.b===p)&&m.atoms[b.a===p?b.b:b.a].el==="C").length;
    m.cls=k<=1?"primary":k===2?"secondary":"tertiary";m.ohC=p;m.O=O;
    if(cls&&m.cls!==cls)continue;return m}}
/* oxidise an alcohol to aldehyde / acid / ketone */
function oxid(m,to){const r=clone(m),c=r.ohC,a=r.atoms[c];
  if(to==="acid"){const s=shuffle([-1,1]).find(s=>!r.atoms.some(b=>Math.abs(b.y-s)<.1&&Math.abs(b.x-a.x)<1.1));if(s===undefined)return null;
    const o=r.add("O",a.x,s);r.bond(c,o,2);a.fg="acid";r.fam="acid"}
  else{r.bonds.find(b=>(b.a===c&&b.b===r.O)||(b.b===c&&b.a===r.O)).o=2;a.fg=to==="ketone"?"co":"ald";r.fam=to==="ketone"?"ketone":"aldehyde"}
  r.name=nameOf(r);return r.name?r:null}

/* simple straight-chain builder: oh positions (1-based), ket, ald, acid, branches [[pos,size,side]] */
function spec(n,o={}){const m=new Mol();for(let i=0;i<n;i++){m.add("C",i,0);if(i)m.bond(i-1,i)}
  (o.oh||[]).forEach(q=>{const p=q-1;let O;if(p===0)O=m.add("O",-1,0);else if(p===n-1)O=m.add("O",n,0);else O=m.add("O",p,-1);m.bond(p,O);m.atoms[p].fg="oh"});
  if(o.ket){const p=o.ket-1,O=m.add("O",p,-1);m.bond(p,O,2);m.atoms[p].fg="co"}
  if(o.ald){const O=m.add("O",-1,0);m.bond(0,O,2);m.atoms[0].fg="ald"}
  if(o.acid){const O1=m.add("O",0,-1);m.bond(0,O1,2);const O2=m.add("O",-1,0);m.bond(0,O2);m.atoms[0].fg="acid"}
  (o.br||[]).forEach(([q,sz,s])=>{let prev=q-1;for(let j=1;j<=sz;j++){const c=m.add("C",q-1,s*j);m.bond(prev,c);prev=c}});
  return m}

/* ring (cycloalkane) with outward H directions */
function ringMol(n){const m=new Mol(),Rr=1.15/(2*Math.sin(Math.PI/n));
  for(let i=0;i<n;i++){const a=-Math.PI/2+Math.PI/n+2*Math.PI*i/n;m.add("C",Rr*Math.cos(a),Rr*Math.sin(a),{hd:[[Math.cos(a-.5),Math.sin(a-.5)],[Math.cos(a+.5),Math.sin(a+.5)]]})}
  for(let i=0;i<n;i++)m.bond(i,(i+1)%n);m.name="cyclo"+PRE[n]+"ane";m.fam="cycloalkane";return m}
/* random alkane / alkene with straight branches; main chain up to 8 */
function buildHC(fam,o={}){
  for(let t=0;t<5000;t++){const n=rnd(o.min||(fam==="alkene"?2:1),o.max||7),m=new Mol(),occ={"-1":{},"1":{}},used=[];
    for(let i=0;i<n;i++){m.add("C",i,0);used.push((i>0)+(i<n-1));if(i)m.bond(i-1,i)}
    let d=-1;if(fam==="alkene"){d=rnd(0,n-2);m.bonds[d].o=2;used[d]++;used[d+1]++;m.atoms[d].fg="ene";m.atoms[d+1].fg="ene"}
    const side=q=>{const s=shuffle([-1,1]).find(s=>!occ[s][q]&&!occ[s][q-1]&&!occ[s][q+1]);if(s!==undefined)occ[s][q]=1;return s};
    const want=o.branches!==undefined?o.branches:rnd(0,2);let tot=n;
    for(let b=0;b<want;b++){const sz=Math.random()<.7?1:2;if(n<3||tot+sz>(o.maxC||8))continue;const q=rnd(1,n-2);if(used[q]>=4)continue;const s=side(q);if(s===undefined)continue;
      used[q]++;tot+=sz;let prev=q;for(let j=1;j<=sz;j++){const c=m.add("C",q,s*j);m.bond(prev,c);prev=c}}
    m.fam=fam;const nm=nameOf(m);if(!nm)continue;m.name=nm;m.dbl=d;return m}}

const T={};
const MOL=(items,o)=>compose(items,o);
const cap=s=>s[0].toUpperCase()+s.slice(1);

/* ---------- helpers for addition reactions ---------- */
function freeSlot(m,i){const a=m.atoms[i];const used=new Set(nbrs(m,i).map(n=>Math.sign(m.atoms[n.j].x-a.x)+","+Math.sign(m.atoms[n.j].y-a.y)));
  return shuffle([[0,-1],[0,1]]).concat([[-1,0],[1,0]]).find(([dx,dy])=>!used.has(dx+","+dy)&&!m.atoms.some(b=>Math.abs(b.x-(a.x+dx))<.6&&Math.abs(b.y-(a.y+dy))<.6))}
function addTo(alk,reag,onFirst){const m=clone(alk),[i,j]=[alk.dbl,alk.dbl+1];m.bonds.find(b=>(b.a===i&&b.b===j)||(b.a===j&&b.b===i)).o=1;delete m.atoms[i].fg;delete m.atoms[j].fg;
  const put=(k,el)=>{const s=freeSlot(m,k);if(!s)return false;const x=m.add(el,m.atoms[k].x+s[0],m.atoms[k].y+s[1]);m.bond(k,x);if(el==="O")m.atoms[k].fg="oh";return true};
  let ok=true;if(reag==="H2"){m.fam="alkane"}else if(reag==="Br2"||reag==="Cl2"){const X=reag.slice(0,2);ok=put(i,X)&&put(j,X);m.fam="alkane"}
  else{const X=reag==="H2O"?"O":reag.slice(1);ok=put(onFirst?i:j,X);m.fam=reag==="H2O"?"alcohol":"alkane"}
  if(!ok)return null;m.name=nameOf(m);return m.name?m:null}
const RNAME={H2:"hydrogen",Br2:"bromine",Cl2:"chlorine",HBr:"hydrogen bromide",HCl:"hydrogen chloride",H2O:"water"};
T.addition={group:"Hydrocarbons",title:"Addition reactions",organic:true,intro:"Alkenes react by addition with hydrogen, halogens, hydrogen halides and water.",
  modes:[["product","Name the product"],["alkene","Which alkene?"],["test","Bromine test"],["which","Alkene or cycloalkane?"]],
  gen(mode){if(mode==="test"){const k=pick(["alkane","alkene","cyclo"]);return{k,m:k==="cyclo"?ringMol(rnd(3,6)):buildHC(k,{max:6,maxC:7})}}
    if(mode==="which"){const n=rnd(3,6);let a;do a=buildHC("alkene",{min:2,max:n,maxC:n});while(formulaOf(a)!==`C${n}H${2*n}`);return{a,c:ringMol(n),aFirst:Math.random()<.5}}
    for(;;){const alk=buildHC("alkene",{max:6,maxC:7}),reag=mode==="alkene"?pick(["Br2","Cl2"]):pick(["H2","Br2","Cl2","HBr","HCl","H2O"]);
      const p1=addTo(alk,reag,true),p2=["HBr","HCl","H2O"].includes(reag)?addTo(alk,reag,false):null;if(p1&&(p2||!["HBr","HCl","H2O"].includes(reag)))return{alk,reag,p1,p2}}},

      a:`<p>This is <b>${d.m.name}</b>, ${d.k==="alkene"?"an alkene":d.k==="alkane"?"an alkane":"a cycloalkane"}.</p><p>The bromine solution <b>${un?"is decolourised quickly":"is not decolourised quickly (it stays orange/brown)"}</b>. ${un?"The C=C double bond makes it unsaturated, so bromine adds across it.":"It is saturated: it has only C–C single bonds."}</p>`}}

$("sheetans").onclick=()=>{const a=$("sheeta");a.hidden=!a.hidden;$("sheetans").textContent=a.hidden?"Show answers":"Hide answers";};
$("marks-btn").onclick=()=>{MARKS=!MARKS;$("marks-btn").setAttribute("aria-pressed",MARKS);$("marks-btn").textContent=MARKS?"Hide marks":"Show marks";
  if(SHEET)renderSheet();else{const open=!$("work").hidden;render();$("work").hidden=!open;}};
$("home-btn").onclick=showHome;
/* ---------- score tracking ---------- */
const SKEY="chemscore:"+APP.title;let SC={};try{SC=JSON.parse(localStorage.getItem(SKEY)||"{}")||{};}catch(e){SC={};}
function saveSC(){try{localStorage.setItem(SKEY,JSON.stringify(SC));}catch(e){}}
function score(Q,ok){const id=Q._id;if(!id)return;const r=SC[id]=SC[id]||{c:0,a:0};r.a++;if(ok)r.c++;saveSC();showScore();selfState();}
function scoreTxt(id){const r=SC[id];return r&&r.a?`<span class="sc">Score: ${r.c} / ${r.a}</span>`:"";}
function showScore(){const id=CUR&&CUR._id,r=id&&SC[id];$("score").textContent=r&&r.a?`${MIX?CUR._topic+": ":""}${r.c} / ${r.a} correct`:"";}
function selfState(){const done=CUR&&CUR._scored;$("selfmark").hidden=!CUR||!CUR.steps.length||done;showScore();}
$("sm-ok").onclick=()=>{if(!CUR._scored){CUR._scored=1;score(CUR,true);}};
$("sm-no").onclick=()=>{if(!CUR._scored){CUR._scored=1;score(CUR,false);}};
/* ---------- presentation mode ---------- */
function presSync(){if(!document.body.classList.contains("present"))return;const sh=!!SHEET;$("p-num").textContent=sh?"Worksheet":$("qnum").textContent;$("p-prev").hidden=$("p-next").hidden=$("p-new").hidden=sh;$("p-prev").disabled=$("prev").disabled;$("p-next").disabled=$("nextq").disabled;
  $("p-show").textContent=sh?($("sheeta").hidden?"Show answers":"Hide answers"):($("work").hidden?"Show answer":"Hide answer");}
function setPres(on){document.body.classList.toggle("present",on);$("pbar").hidden=!on;$("pres-btn").setAttribute("aria-pressed",on);$("pres-btn").textContent=on?"Exit presentation":"Presentation mode";
  try{if(on&&!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}
  presSync();window.scrollTo(0,0);}
$("pres-btn").onclick=()=>setPres(!document.body.classList.contains("present"));
$("p-exit").onclick=()=>setPres(false);
$("p-prev").onclick=()=>{$("prev").click();presSync();};$("p-next").onclick=()=>{$("nextq").click();presSync();};$("p-new").onclick=()=>{$("new").click();presSync();window.scrollTo(0,0);};
$("p-show").onclick=()=>{(SHEET?$("sheetans"):$("show")).click();presSync();if(!SHEET&&!$("work").hidden)$("work").scrollIntoView({behavior:"smooth"});};
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.body.classList.contains("present"))setPres(false);});
document.addEventListener("keydown",e=>{if(!document.body.classList.contains("present")||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const k=e.key;if(k==="ArrowRight"){$("p-next").disabled?$("p-new").click():$("p-next").click();}else if(k==="ArrowLeft")$("p-prev").click();else if(k==="n"||k==="N")$("p-new").click();else if(k===" "||k==="a"||k==="A"){e.preventDefault();$("p-show").click();}else if(k==="Escape")setPres(false);else return;});
/* ---------- timed quiz ---------- */
let TIMER=null;
function stopQuiz(){if(TIMER){clearInterval(TIMER);TIMER=null;}$("timer").hidden=true;$("quiz-btn").textContent="Start quiz";}
$("quiz-btn").onclick=()=>{if(TIMER){finishQuiz();return;}makeSheet();let left=Number($("quizmin").value)*60;$("timer").hidden=false;$("quiz-btn").textContent="Finish now";$("sheetans").hidden=true;
  const tick=()=>{$("timer").textContent=`Time left ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;if(left--<=0)finishQuiz();};tick();TIMER=setInterval(tick,1000);};
function finishQuiz(){stopQuiz();$("sheetans").hidden=false;$("sheeta").hidden=false;$("sheetans").textContent="Hide answers";
  $("sheeta").querySelectorAll("li").forEach((li,i)=>{const d=document.createElement("label");d.className="qnum";d.innerHTML=`<input type="checkbox" data-i="${i}"> I got this right`;li.appendChild(d);});
  const tot=document.createElement("p");tot.id="quiztot";tot.className="qnum";$("sheeta").after(tot);
  const upd=()=>{const n=$("sheeta").querySelectorAll("input:checked").length;tot.textContent=`Quiz score: ${n} / ${SHEET.length}`;};
  $("sheeta").querySelectorAll("input").forEach(c=>c.onchange=()=>{const Q=SHEET[c.dataset.i];if(!Q._scored){Q._scored=1;score(Q,c.checked);}else if(Q._id&&SC[Q._id]){SC[Q._id].c+=c.checked?1:-1;saveSC();}upd();});upd();
  $("sheeta").scrollIntoView({behavior:"smooth"});}
/* ---------- data booklet drawer ---------- */
const BT=(rows,head)=>`<table>${head?`<tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>`:""}${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
function bookTabs(){const ram=LEVEL==="N5"?RAM_N5:RAM_H,t={};
  t["Relationships"]=LEVEL==="N5"?BT([["n = m ÷ GFM"],["n = c × V"],["% by mass = (m of element ÷ GFM) × 100"],["average rate = Δquantity ÷ Δtime"],["E<sub>h</sub> = c m ΔT  (c = 4.18 kJ kg<sup>−1</sup> °C<sup>−1</sup>)"]]):
    BT([["n = m ÷ GFM, n = c × V, V = n × V<sub>m</sub>"],["E<sub>h</sub> = c m ΔT  (c = 4.18 kJ kg<sup>−1</sup> °C<sup>−1</sup>)"],["% yield = actual ÷ theoretical × 100"],["atom economy = mass of desired product ÷ total mass of reactants × 100"],["rate ∝ 1 ÷ t"],["pH = −log[H<sup>+</sup>], K<sub>w</sub> = [H<sup>+</sup>][OH<sup>−</sup>] = 1.01 × 10<sup>−14</sup> at 25 °C"],["E = Lhc ÷ λ, c = fλ"],["ΔG° = ΔH° − TΔS°"]]);
  t["Relative atomic masses"]=BT(Object.entries(ram).map(([k,v])=>[k,v]),["Element","RAM"]);
  if(LEVEL==="N5"){t["Solubility"]=BT(Object.entries(SOLTAB).map(([k,v])=>[k,...v.split(" ").map(x=>x==="-"?"−":x)]),["",...SOL_AN]);
    t["Flame colours"]=BT([["barium","green"],["calcium","orange-red"],["copper","blue-green"],["lithium","red"],["potassium","lilac"],["sodium","yellow"],["strontium","red"]],["Ion","Colour"]);
    t["Electrochemical series"]=BT(["lithium","potassium","calcium","sodium","magnesium","aluminium","zinc","iron","nickel","tin","lead","copper","silver","mercury","gold"].map((x,i)=>[i+1,x]),["","Most reactive at the top"]);}
  else{t["Radius, IE, EN"]=BT([["Li",130,520,"1.0"],["Be",99,900,"1.6"],["B",84,801,"2.0"],["C",75,1086,"2.6"],["N",71,1402,"3.0"],["O",64,1314,"3.4"],["F",60,1681,"4.0"],["Na",160,496,"0.9"],["Mg",140,738,"1.3"],["Al",124,578,"1.6"],["Si",114,787,"1.9"],["P",109,1012,"2.2"],["S",104,1000,"2.6"],["Cl",100,1251,"3.2"],["K",200,419,"0.8"],["Ca",174,590,"1.0"],["Br",117,1140,"3.0"],["Rb",215,403,"0.8"],["I",136,1008,"2.7"]],["Element","Covalent radius / pm","1st IE / kJ mol<sup>−1</sup>","Electronegativity"]);
  t["Colour wheel"]=BT([["purple","green"],["violet","yellow-green"],["blue","yellow"],["green-blue","orange"],["blue-green","red"]],["Colour","Opposite (complementary)"])+'<p class="qnum">Booklet wavelengths: 380, 400, 435, 480, 490, 500, 560, 580, 595, 605, 750 nm around the wheel.</p>';}
  if(LEVEL!=="N5")t["Constants"]=BT([["Avogadro constant, L","6.02 × 10<sup>23</sup> mol<sup>−1</sup>"],["Planck constant, h","6.63 × 10<sup>−34</sup> J s"],["Speed of light, c","3.00 × 10<sup>8</sup> m s<sup>−1</sup>"],["Specific heat capacity of water","4.18 kJ kg<sup>−1</sup> °C<sup>−1</sup>"],["K<sub>w</sub> (25 °C)","1.01 × 10<sup>−14</sup>"]]);
  return t;}
$("book-btn").onclick=()=>{const t=bookTabs(),k=Object.keys(t);$("booktabs").innerHTML=k.map((x,i)=>`<button class="btn alt" aria-pressed="${i===0}" data-k="${x}">${x}</button>`).join("");
  const sh=x=>{$("bookbody").innerHTML=t[x];$("booktabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===x));};
  $("booktabs").querySelectorAll("button").forEach(b=>b.onclick=()=>sh(b.dataset.k));sh(k[0]);$("book").hidden=false;};
$("book-close").onclick=()=>$("book").hidden=true;
(function(){const h=location.hash.slice(1);if(h&&byId(h))openTopic(h);else if(h&&UNITS.find(u=>u.id===h))showUnit(h);else showHome();})();
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&byId(h))openTopic(h);});

</script>
