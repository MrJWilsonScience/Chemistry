:root[data-theme="dark"]{
  --bg:#10181d; --paper:#17232a; --ink:#e4edf2; --muted:#93a6b2; --line:#2a3a44;

#present .ptop{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-family:var(--display);font-weight:600;font-size:clamp(1rem,2vw,1.4rem)}

<script>
// Blanks: {answer|distractor|distractor...}
const TOPICS=[
{t:"Rates of Reaction",l:"Following reactions, factors affecting rate, catalysts and average rate",s:[
"The progress of a reaction can be followed by measuring changes in {mass|colour only|smell|sound} or volume of gas over time.",
"On a graph of quantity against time, the reaction has finished when the line becomes {flat (horizontal)|steepest|a straight rising line|zero}.",
"The steeper the line on a graph of product against time, the {faster|slower|more constant|less} the rate of reaction.",
"Increasing the {temperature|particle size|volume of the container|mass of the container} of a reaction mixture increases the rate.",
"Increasing the {concentration|temperature only|particle size|activation energy} of a reactant increases the rate of reaction.",
"Decreasing the particle size increases the {surface area|concentration|activation energy|temperature} of a solid, so the rate increases.",
"A catalyst {speeds up|slows down|stops|reverses} a reaction and is chemically {unchanged|used up|destroyed|converted into product} at the end.",
"Average rate = {change in quantity ÷ time|time ÷ change in quantity|quantity × time|time − quantity}.",
"If a reaction produces gas, the units of average rate could be {cm³ s⁻¹|mol l⁻¹|kJ mol⁻¹|g cm⁻³}.",
"The rate of a reaction {decreases|increases|stays the same|doubles} over time as the reactants are used up.",
"Calculating the average rate for the first minute and then for the second minute shows the rate has {fallen|risen|not changed|become zero}."]},

{t:"Atomic Structure & the Periodic Table",l:"Atoms, isotopes, relative atomic mass and electron arrangements",s:[
"Elements in the periodic table are arranged in order of increasing {atomic number|mass number|relative atomic mass|number of neutrons}.",
"The periodic table shows whether an element is a {metal or non-metal|solid or liquid|gas or liquid|acid or base}.",
"Elements in the same group have the same number of {outer electrons|neutrons|protons|energy levels}, given by the group number.",
"Elements in the same group have the same valency and similar {chemical|physical|nuclear|radioactive} properties.",
"The nucleus of an atom contains {protons and neutrons|protons and electrons|neutrons and electrons|only protons}.",
"Protons have a charge of {+1|−1|0|+2}, neutrons have a charge of {0|+1|−1|−2} and electrons have a charge of {−1|+1|0|+2}.",
"Protons and neutrons each have a mass of about {1 atomic mass unit|2 atomic mass units|0 atomic mass units|1/2000 atomic mass unit}, while electrons have virtually no mass.",
"The atomic number of an atom is the number of {protons|neutrons|protons plus neutrons|outer electrons}.",
"In a neutral atom, the number of electrons is {equal to|greater than|less than|double} the number of protons.",
"Mass number = number of protons plus number of {neutrons|electrons|energy levels|isotopes}.",
"Isotopes are atoms with the same {atomic number|mass number|number of neutrons|relative atomic mass} but different mass numbers.",
"Isotopes of an element have the same number of protons but different numbers of {neutrons|electrons|protons|outer electrons}.",
"In nuclide notation such as ²³Na, the number 23 is the {mass number|atomic number|number of neutrons|charge}.",
"Relative atomic mass is the {weighted average|largest|smallest|total} mass of the isotopes of an element, taking account of their proportions.",
"The electron arrangement of the first 20 elements can be written as numbers; for example, sodium is {2,8,1|2,8,2|2,1|2,8,8,1}."]},

{t:"Covalent Bonding",l:"Shared pairs, molecules, shapes and the properties of covalent substances",s:[
"Covalent bonds form between {non-metal|metal|noble gas|transition metal} atoms.",
"A covalent bond is a shared pair of electrons that is attracted to the {two positive nuclei|two negative ions|one nucleus only|electrons in other atoms}.",
"The seven diatomic elements are H₂, N₂, O₂, F₂, Cl₂, Br₂ and {I₂|S₂|P₂|C₂}.",
"The shape of a molecule depends on the number of bonds and how they are {arranged around the central atom|coloured|dissolved|heated}.",
"The shape of a methane molecule, CH₄, is {tetrahedral|linear|angular|trigonal pyramidal}.",
"The shape of an ammonia molecule, NH₃, is {trigonal pyramidal|tetrahedral|linear|angular}.",
"The shape of a water molecule, H₂O, is {angular|linear|tetrahedral|trigonal pyramidal}.",
"The shape of a hydrogen chloride molecule, HCl, is {linear|angular|tetrahedral|trigonal pyramidal}.",
"Covalent substances are either discrete molecular or {giant network|metallic|ionic|monatomic only} structures.",
"In a covalent molecular substance the bonds within molecules are {strong|weak|absent|ionic}, while the forces between molecules are {weak|strong|covalent|metallic}.",
"Covalent molecular substances have {low|high|very high|variable} melting and boiling points because only the weak forces between molecules need to be overcome.",
"Covalent molecular substances do not conduct electricity because they have no {free charged particles|atoms|bonds|neutrons}.",
"Covalent molecular substances that are insoluble in water may dissolve in {other solvents|acid only|alkali only|molten metals}.",
"Covalent network substances, such as diamond, have {very high|very low|low|moderate} melting and boiling points because of a giant structure of strong covalent bonds.",
"Covalent network substances do not dissolve and generally {do not conduct|conduct well|conduct when dissolved|conduct only when molten} electricity."]},

{t:"Ionic Bonding",l:"Ions, ion-electron equations, lattices and the properties of ionic compounds",s:[
"Atoms form ions by losing or gaining electrons to achieve a {noble gas|halogen|transition metal|metallic} electron arrangement.",
"Metal atoms generally {lose|gain|share|keep} electrons to form positive ions.",
"Non-metal atoms generally {gain|lose|share|keep} electrons to form negative ions.",
"The ion-electron equation Na → Na⁺ + e⁻ shows sodium {losing|gaining|sharing|splitting} an electron.",
"The ion-electron equation Cl + e⁻ → Cl⁻ shows chlorine {gaining|losing|sharing|splitting} an electron.",
"An ionic bond is the electrostatic attraction between {positive and negative ions|two positive ions|two negative ions|shared electrons and nuclei}.",
"In an ionic lattice, each ion is surrounded by ions of {opposite|the same|neutral|no} charge.",
"Ionic compounds have {high|low|very low|variable} melting and boiling points because strong ionic bonds must be broken to break up the lattice.",
"When an ionic compound dissolves in water, the lattice breaks up and water molecules {surround the separated ions|react with the ions|bond covalently to the ions|stop the ions moving}.",
"Ionic compounds do not conduct when solid because the ions are {fixed in the lattice|absent|neutral|too small}.",
"Ionic compounds conduct when {molten or dissolved|solid|heated but still solid|cooled}, because the ions are free to move.",
"During conduction by an ionic solution, positive ions move to the {negative|positive} electrode and negative ions move to the {positive|negative} electrode."]},

{t:"Chemical Formulae",l:"Naming compounds, valency, covalent and ionic formulae",s:[
"A compound name ending in -ide contains {two elements only|oxygen as well|three elements|a metal only}.",
"A compound name ending in -ate or -ite contains {oxygen|hydrogen|nitrogen only|a noble gas}.",
"The formula of a two-element compound can be written using the valency of each element, found from its {group number|mass number|period number|atomic mass}.",
"A Roman numeral in a name, such as iron(III) oxide, shows the {valency|mass|number of atoms in a molecule|charge on the electrons} of the metal.",
"The prefixes di-, tri- and tetra- in names such as carbon dioxide show the {number of atoms|charge|valency|mass} of an element.",
"The formula of a covalent molecular substance shows the {number of each atom in one molecule|simplest ratio of atoms|ratio of ions|mass of the molecule}.",
"The formula of a covalent network substance shows the {simplest ratio|exact number of atoms in a molecule|number of electrons|number of bonds} of atoms.",
"Group ions such as sulfate, SO₄²⁻, have formulae and charges that are found in the {data booklet|periodic table only|electrochemical series only|periodic table column}.",
"The formula of an ionic compound shows the {simplest ratio of ions|number of atoms in a molecule|number of bonds|mass of one ion}.",
"In formulae, charges are written as {superscripts|subscripts|prefixes|brackets only} and the numbers of atoms or ions are written as {subscripts|superscripts|coefficients only|prefixes}.",
"The formula for calcium chloride is {CaCl₂|CaCl|Ca₂Cl|Ca₂Cl₂}.",
"The formula for aluminium oxide is {Al₂O₃|AlO|Al₃O₂|Al₂O}.",
"The formula for sodium sulfate is {Na₂SO₄|NaSO₄|Na(SO₄)₂|Na₂SO₃}."]},

{t:"Moles & Balanced Equations",l:"Gram formula mass, moles, concentration and percentage composition",s:[
"Chemical equations should show the correct formulae and be {balanced|coloured|reversible|ionic} with state symbols.",
"The state symbol for a substance dissolved in water is {(aq)|(s)|(l)|(g)}.",
"The molar mass of a substance is the mass in grams of {one mole|one atom|one molecule|one litre} of it.",
"The molar mass (gram formula mass) is calculated by adding the {relative atomic masses|atomic numbers|numbers of neutrons|numbers of electrons} of the atoms in the formula.",
"Number of moles = {mass ÷ molar mass|molar mass ÷ mass|mass × molar mass|mass ÷ volume}.",
"When a solute dissolves in a solvent, the result is a {solution|precipitate|suspension|mixture of gases}.",
"Concentration (mol l⁻¹) = {moles ÷ volume in litres|volume in litres ÷ moles|moles × volume in litres|mass ÷ volume in litres}.",
"A volume of 250 cm³ is equal to {0.25|25|2.5|0.025} litres.",
"The ratio of moles in a balanced equation allows the {mass or moles of one substance|colour of one substance|state of one substance|pH of one substance} to be calculated from another.",
"In the reaction 2Mg + O₂ → 2MgO, 2 moles of magnesium produce {2|1|4|3} moles of magnesium oxide.",
"The percentage of an element in a compound = (mass of the element in one mole ÷ {gram formula mass of the compound|atomic number of the element|number of atoms|mass of the element only}) × 100.",
"The percentage of hydrogen in water, H₂O, is about {11%|2%|33%|89%}."]},

{t:"pH & Acid-Base Properties",l:"The pH scale, H⁺ and OH⁻ ions, oxides and bases",s:[
"pH is an indication of the {hydrogen ion concentration|mass|oxygen content|temperature} of a solution.",
"The pH scale runs from below {0|1|5|7} to above 14.",
"In a neutral solution, the concentrations of H⁺(aq) and OH⁻(aq) are {equal|zero|both very high|different}.",
"In water, H₂O(ℓ) ⇌ H⁺(aq) + OH⁻(aq); the symbol ⇌ shows that the reaction is {reversible|irreversible|complete|exothermic}.",
"Only a {few|most|all|half of the} water molecules are dissociated at any time.",
"In an acidic solution there are more {H⁺(aq)|OH⁻(aq)|neutral molecules|metal ions} than OH⁻(aq), and the pH is below 7.",
"In an alkaline solution there are more {OH⁻(aq)|H⁺(aq)|neutral molecules|acid molecules} than H⁺(aq), and the pH is above 7.",
"When an acid is diluted with water, the H⁺ concentration {falls|rises|stays the same|doubles} and the pH {rises|falls|stays the same|drops to zero} towards 7.",
"When an alkali is diluted with water, the OH⁻ concentration falls and the pH {falls|rises|stays the same|rises above 14} towards 7.",
"Soluble non-metal oxides form {acidic|alkaline|neutral|salt} solutions when dissolved in water.",
"Soluble metal oxides form {alkaline|acidic|neutral|covalent} solutions, because metal oxide + water → metal {hydroxide|carbonate|chloride|nitrate}.",
"Metal oxides, metal hydroxides, metal carbonates and {ammonia|chlorine|hydrogen|water vapour} are bases that neutralise acids.",
"Bases that dissolve in water form {alkaline|acidic|neutral|corrosive only} solutions."]},

{t:"Neutralisation & Salts",l:"Neutralisation equations, spectator ions, titration and preparing salts",s:[
"Neutralisation is the reaction of a {base|metal|salt|noble gas} with an acid to form water and a salt.",
"Metal oxide + acid → {salt + water|salt + hydrogen|salt + carbon dioxide|water only}.",
"Metal carbonate + acid → salt + water + {carbon dioxide|hydrogen|oxygen|nitrogen}.",
"Hydrochloric acid forms {chlorides|sulfates|nitrates|carbonates}, sulfuric acid forms {sulfates|chlorides|nitrates|sulfites} and nitric acid forms {nitrates|chlorides|sulfates|nitrites}.",
"Ions that are present but do not take part in a reaction are called {spectator ions|catalysts|isotopes|group ions}.",
"The simplified ionic equation for a metal hydroxide reacting with an acid is H⁺(aq) + OH⁻(aq) → {H₂O(ℓ)|H₂(g)|OH(aq)|H₂O₂(ℓ)}.",
"The ionic equation for an aqueous carbonate reacting with acid is 2H⁺(aq) + CO₃²⁻(aq) → H₂O(ℓ) + {CO₂(g)|CO(g)|C(s)|H₂(g)}.",
"A titration uses accurately measured {volumes|masses of solid only|temperatures|pressures} to find the concentration of a solution.",
"In a titration, an indicator is used to show the {end-point|start-point|temperature|mass} of the reaction.",
"Titres that agree to within 0.2 cm³ are said to be {concordant|standard|neutral|accurate only}.",
"Solutions of accurately known concentration are called {standard solutions|saturated solutions|neutral solutions|dilute solutions}.",
"To prepare a pure, dry salt by titration, the experiment is repeated without the {indicator|acid|alkali|burette}, and the solution is then evaporated to dryness.",
"To prepare a soluble salt from an insoluble base, add an {excess|small amount|exact amount|indicator} of the base to the acid, filter, and evaporate the filtrate.",
"An insoluble salt can be prepared by {precipitation|titration|distillation|combustion}."]},

{t:"Systematic Carbon Chemistry",l:"Homologous series, hydrocarbons, saturated and unsaturated compounds, isomers",s:[
"A homologous series is a family of compounds with the same {general formula|melting point|boiling point|colour} and similar chemical properties.",
"Within a homologous series, melting and boiling points generally {increase|decrease|stay the same|vary randomly} as the molecules get bigger.",
"Hydrocarbons contain only {hydrogen and carbon|carbon and oxygen|hydrogen and oxygen|carbon and nitrogen}.",
"Saturated hydrocarbons contain only {single carbon-carbon bonds|double carbon-carbon bonds|triple bonds|ionic bonds}.",
"Unsaturated hydrocarbons contain at least one carbon-carbon {double bond|single bond|ionic bond|hydrogen bond}.",
"Bromine solution is used to tell saturated and unsaturated compounds apart; unsaturated compounds {decolourise it quickly|do not change it|turn it blue|turn it black}.",
"Structures can be drawn as full structural formulae or as {shortened structural formulae|ionic formulae|empirical formulae only|electron diagrams only}.",
"Isomers have the same {molecular formula|structural formula|name|boiling point} but different structural formulae.",
"Isomers may belong to {different homologous series|only the same homologous series|no homologous series|only the alkanes}.",
"Isomers usually have different {physical properties|molecular formulae|atomic numbers|numbers of atoms}.",
"C₄H₁₀ has {2|1|3|4} isomers: butane and methylpropane."]},

{t:"Alkanes & Cycloalkanes",l:"Names, formulae and properties of alkanes and cycloalkanes",s:[
"Alkanes are {saturated|unsaturated|ionic|aromatic} hydrocarbons that are commonly used as {fuels|polymers|bleaches|fertilisers}.",
"Alkanes are {insoluble|very soluble|completely miscible|reactive} in water.",
"The general formula for the alkanes is {CₙH₂ₙ₊₂|CₙH₂ₙ|CₙH₂ₙ₋₂|CₙHₙ}.",
"The alkane with 3 carbon atoms is {propane|ethane|butane|propene}.",
"The molecular formula of pentane is {C₅H₁₂|C₅H₁₀|C₅H₈|C₄H₁₀}.",
"The molecular formula of octane is {C₈H₁₈|C₈H₁₆|C₇H₁₆|C₉H₂₀}.",
"A methyl group has the formula {CH₃|CH₂|CH₄|C₂H₅}.",
"In 2-methylbutane, the methyl group is attached to carbon number {2|1|3|5} of the longest chain.",
"Cycloalkanes are saturated hydrocarbons with carbon atoms joined in a {ring|straight chain|double bond|branched chain}.",
"The general formula for the cycloalkanes is {CₙH₂ₙ|CₙH₂ₙ₊₂|CₙH₂ₙ₋₂|CₙHₙ}.",
"The cycloalkane with 6 carbon atoms is {cyclohexane|hexane|cyclopentane|benzene}.",
"The molecular formula of cyclopropane is {C₃H₆|C₃H₈|C₃H₄|C₆H₁₂}.",
"Cycloalkanes are used as {fuels and solvents|polymers|fertilisers|bleaches}."]},

{t:"Alkenes",l:"Names, formulae and addition reactions of alkenes",s:[
"Alkenes are {unsaturated|saturated|ionic|aromatic} hydrocarbons used to make polymers and alcohols.",
"Alkenes contain the {C=C double bond|C≡C triple bond|–OH group|–COOH group} functional group.",
"The general formula for the alkenes is {CₙH₂ₙ|CₙH₂ₙ₊₂|CₙH₂ₙ₋₂|CₙHₙ}.",
"Alkenes are {insoluble|very soluble|completely miscible|reactive} in water.",
"The alkene with 2 carbon atoms is {ethene|ethane|ethyne|ethanol}.",
"In but-2-ene, the 2 shows the position of the {double bond|methyl group|hydroxyl group|first carbon atom}.",
"The molecular formula of pent-1-ene is {C₅H₁₀|C₅H₁₂|C₅H₈|C₄H₈}.",
"An addition reaction of an alkene with hydrogen forms an {alkane|alkene|alcohol|dihaloalkane}; this reaction is called hydrogenation.",
"An addition reaction of an alkene with a halogen such as bromine forms a {dihaloalkane|haloalkane|alcohol|alkane}.",
"An addition reaction of an alkene with water forms an {alcohol|alkane|carboxylic acid|ester}; this reaction is called hydration.",
"Ethene + bromine → {1,2-dibromoethane|bromoethane|ethanol|1,1-dibromoethane}."]},

{t:"Alcohols",l:"Names, formulae and properties of alcohols",s:[
"Alcohols are used as {fuels and solvents|polymers|fertilisers|bleaches}.",
"Alcohols contain the {hydroxyl (–OH)|carboxyl (–COOH)|carbonyl (C=O)|amino (–NH₂)} functional group.",
"The general formula for the straight-chain saturated alcohols is {CₙH₂ₙ₊₁OH|CₙH₂ₙ₊₁COOH|CₙH₂ₙ₊₂|CₙH₂ₙ}.",
"Methanol, ethanol and propanol are {miscible|insoluble|only slightly soluble|immiscible} with water.",
"Beyond propanol, the solubility of alcohols in water {decreases|increases|stays the same|stops completely} with increasing size.",
"Melting and boiling points of alcohols {increase|decrease|stay the same|vary randomly} as the molecules get bigger.",
"Alcohols burn with a clean, {highly flammable|non-flammable|smoky|explosive only} flame.",
"The molecular formula of ethanol is {C₂H₅OH|C₂H₆|CH₃OH|C₂H₄}.",
"The alcohol with 4 carbon atoms and the –OH group on carbon 1 is {butan-1-ol|butan-2-ol|butanol-4|butane}.",
"In propan-2-ol, the –OH group is attached to carbon number {2|1|3|0}.",
"The molecular formula of butan-1-ol is {C₄H₉OH|C₄H₁₀|C₃H₇OH|C₅H₁₁OH}."]},

{t:"Carboxylic Acids",l:"Names, formulae, properties and reactions of carboxylic acids",s:[
"Carboxylic acids are used in {preservatives, soaps and medicines|fuels|polymers only|fertilisers only}.",
"Vinegar contains {ethanoic acid|methanoic acid|propanoic acid|sulfuric acid}, CH₃COOH.",
"Ethanoic acid is non-toxic, so it is used in {household cleaning products|fuels|fertilisers|explosives}.",
"Carboxylic acids contain the {carboxyl (–COOH)|hydroxyl (–OH)|carbonyl (C=O)|amino (–NH₂)} functional group.",
"The general formula for the straight-chain saturated carboxylic acids is {CₙH₂ₙ₊₁COOH|CₙH₂ₙ₊₁OH|CₙH₂ₙ₊₂|CₙH₂ₙ}.",
"Methanoic, ethanoic, propanoic and butanoic acids are {miscible|insoluble|only slightly soluble|immiscible} with water.",
"Beyond butanoic acid, the solubility of carboxylic acids in water {decreases|increases|stays the same|stops completely} with increasing size.",
"Melting and boiling points of carboxylic acids {increase|decrease|stay the same|vary randomly} with increasing size.",
"The pH of a carboxylic acid solution is {below 7|exactly 7|above 7|above 14}.",
"Carboxylic acids react with metals, metal oxides, metal hydroxides and metal {carbonates|chlorides|nitrates|sulfates} to form salts.",
"The salt formed when ethanoic acid reacts with sodium hydroxide is sodium {ethanoate|ethanol|ethane|ethoxide}.",
"The molecular formula of propanoic acid is {C₂H₅COOH|C₃H₇OH|C₃H₈|CH₃COOH}.",
"The formula of the carboxylic acid with 4 carbon atoms is {C₃H₇COOH|C₄H₉OH|C₄H₁₀|C₄H₉COOH}."]},

{t:"Energy from Fuels",l:"Exothermic and endothermic changes, combustion and Eₕ = cmΔT",s:[
"A reaction that releases heat is {exothermic|endothermic|neutral|reversible}.",
"A reaction that takes in heat from its surroundings is {endothermic|exothermic|neutral|catalytic}.",
"Combustion is a reaction of a substance with {oxygen|hydrogen|water|nitrogen} that releases energy.",
"When hydrocarbons and alcohols burn completely in plenty of oxygen they form carbon dioxide and {water|carbon monoxide|soot|hydrogen}.",
"Complete combustion of methane: CH₄ + 2O₂ → CO₂ + {2H₂O|H₂O|2H₂|C}.",
"Different fuels release {different|the same} quantities of energy when they burn.",
"The heat energy released can be calculated using Eₕ = {cmΔT|cm ÷ ΔT|c ÷ mΔT|mΔT ÷ c}.",
"In Eₕ = cmΔT, c is the {specific heat capacity|concentration|speed of light|molar mass}.",
"In Eₕ = cmΔT, the unit of m is {kg|g only|mol|cm³} when c is in kJ kg⁻¹ °C⁻¹.",
"The specific heat capacity of water is {4.18 kJ kg⁻¹ °C⁻¹|1 kJ kg⁻¹ °C⁻¹|418 kJ kg⁻¹ °C⁻¹|0.418 kJ kg⁻¹ °C⁻¹}.",
"In Eₕ = cmΔT, ΔT is the {change in temperature|starting temperature|final temperature|time taken}.",
"In experiments to find Eₕ, the temperature change of {water|the fuel|the flame|the air} is usually measured."]},

{t:"Metals & Reactivity",l:"Metallic bonding, reactions of metals and preparing salts from metals",s:[
"A metallic bond is the electrostatic attraction between {positive ions and delocalised electrons|positive and negative ions|shared electron pairs and nuclei|neutral atoms}.",
"Metals conduct electricity because their {delocalised electrons|ions|protons|neutrons} are free to move.",
"Metal + oxygen → {metal oxide|metal hydroxide|salt|metal carbonate}.",
"Metal + water → metal hydroxide + {hydrogen|oxygen|water|carbon dioxide}.",
"Metal + dilute acid → {salt + hydrogen|salt + water|salt + oxygen|oxide + hydrogen}.",
"Metals can be placed in order of reactivity by comparing their {rates of reaction|densities|melting points|colours}.",
"Magnesium reacts with dilute hydrochloric acid to form magnesium chloride and {hydrogen|oxygen|water|carbon dioxide}.",
"A more reactive metal reacts {faster|slower|at the same speed|not at all} with dilute acid than a less reactive metal.",
"A soluble salt can be made by adding an {excess|exact amount|small amount|indicator} of metal to acid.",
"After the reaction, the unreacted metal is removed by {filtration|distillation|titration|chromatography}.",
"The salt solution is then {evaporated|burned|electrolysed|distilled} to dryness to obtain the salt."]},

{t:"Redox & Extraction of Metals",l:"Oxidation and reduction, ion-electron equations, extraction and electrolysis",s:[
"Reduction is the {gain|loss|sharing|transfer to a nucleus} of electrons.",
"Oxidation is the {loss|gain|sharing|decrease} of electrons.",
"In a redox reaction, reduction and oxidation take place {at the same time|one after the other|in separate reactions|only in solution}.",
"The ion-electron equation Fe³⁺ + e⁻ → Fe²⁺ shows {reduction|oxidation|neutralisation|combustion}.",
"The ion-electron equation Mg → Mg²⁺ + 2e⁻ shows {oxidation|reduction|neutralisation|precipitation}.",
"Ion-electron equations are combined to produce a full {redox|neutralisation|combustion|precipitation} equation.",
"During the extraction of a metal from its ore, metal ions are {reduced|oxidised|neutralised|dissolved} to metal atoms.",
"The method used to extract a metal depends on its position in the {reactivity series|periodic table group|data booklet colours|pH scale}.",
"The metals silver, gold and mercury can be extracted by {heating alone|electrolysis|heating with carbon|filtration}.",
"The metals copper, lead, tin, iron and zinc can be extracted by heating their ores with {carbon or carbon monoxide|water|oxygen|acid}.",
"The most reactive metals, such as aluminium, are extracted by {electrolysis|heating alone|heating with carbon|filtration}.",
"Electrolysis is the decomposition of an ionic compound into its elements using {electricity|heat|light|pressure}.",
"A {d.c.|a.c.} supply must be used in electrolysis if the products are to be identified.",
"In electrolysis, positive ions gain electrons at the {negative|positive} electrode and negative ions lose electrons at the {positive|negative} electrode."]},

{t:"Electrochemical Cells",l:"Simple cells, half-cells, salt bridges and the electrochemical series",s:[
"An electrolyte is a solution that conducts electricity because it contains {ions|atoms|neutral molecules|electrons only}.",
"A simple cell is made from two {different metals|identical metals|non-metals|salts} in an electrolyte.",
"A half-cell is a metal placed in a solution of its own {ions|atoms|molecules|oxide}.",
"Two half-cells can be joined using an ion (salt) {bridge|wire|filter|tube}.",
"The ion bridge allows ions to move, which {completes the circuit|stops the reaction|prevents electron flow|dissolves the electrodes}.",
"Cells that include a non-metal half-cell use a {graphite|copper|zinc|plastic} rod as the electrode.",
"The further apart two metals are in the electrochemical series, the {greater|smaller|same|lower} the voltage produced.",
"In the external circuit, electrons flow from the species {higher|lower} in the electrochemical series to the one {lower|higher} in the series.",
"In a zinc–copper cell, zinc is higher in the series, so electrons flow from {zinc to copper|copper to zinc|the salt bridge to zinc|the solution to the salt bridge}.",
"In a cell, the oxidation reaction occurs at the electrode where electrons are {released|gained|stored|destroyed}.",
"For a zinc–copper cell, the oxidation ion-electron equation is Zn → Zn²⁺ + {2e⁻|e⁻|2H⁺|Cu}.",
"The overall reaction in a cell is a {redox|neutralisation|precipitation|combustion} reaction."]},

{t:"Plastics",l:"Addition polymerisation, monomers, polymers and repeating units",s:[
"Plastics are {polymers|monomers|ionic compounds|metals}, which are long-chain molecules.",
"Polymers are made by joining together many small molecules called {monomers|isomers|isotopes|catalysts}.",
"In addition polymerisation, {unsaturated|saturated|ionic|metallic} monomers join to form a polymer.",
"Addition polymerisation of {ethene|ethane|methane|ethanol} forms poly(ethene).",
"The name of a polymer comes from the name of its {monomer|catalyst|solvent|colour}.",
"Brackets can be used to show the {monomer unit|catalyst|solvent|isotope} in the name of a polymer.",
"The repeating unit is the shortest section of the polymer chain that, when {repeated|reversed|burned|dissolved}, gives the whole chain.",
"A monomer for addition polymerisation must contain a {C=C double bond|C–C single bond|hydroxyl group|carboxyl group}.",
"The polymer made from propene is called {poly(propene)|propane|polypropane|propanol}.",
"When drawing a repeating unit from a monomer, the C=C double bond is changed to a {single bond|triple bond|double bond|ionic bond}.",
"The monomer of the polymer poly(chloroethene) is {chloroethene|chloroethane|ethene|chloromethane}."]},

{t:"Fertilisers",l:"Plant nutrients, ammonia, the Haber process and the Ostwald process",s:[
"Plants need nutrients including compounds of nitrogen, phosphorus and {potassium|sodium|calcium only|carbon only}.",
"Fertilisers restore the essential {elements|isotopes|metals only|oxides} to the soil.",
"Ammonia and nitric acid are used to make soluble nitrogen-containing {salts|metals|alkanes|alcohols} for fertilisers.",
"Ammonia is a pungent, {colourless|brown|green|yellow} gas.",
"Ammonia dissolves in water to form an {alkaline|acidic|neutral|corrosive acid} solution.",
"Ammonia solution reacts with acids to form ammonium {salts|oxides|carbonates|alkanes} and water.",
"The Haber process makes ammonia from nitrogen and {hydrogen|oxygen|carbon|chlorine}.",
"The Haber process equation is N₂ + 3H₂ ⇌ {2NH₃|NH₃|2NH₄|3NH₃}.",
"The Haber process uses an {iron|platinum|nickel|copper} catalyst to increase the rate.",
"At low temperature the Haber process is too {slow|fast|dangerous|cheap} to be economic.",
"Raising the temperature increases the rate, but it favours the {backward|forward} reaction more.",
"The Ostwald process makes {nitric acid|ammonia|sulfuric acid|hydrochloric acid} from ammonia, oxygen and water.",
"The Ostwald process uses a {platinum|iron|nickel|copper} catalyst."]},

{t:"Radiation & Nuclear Equations",l:"Alpha, beta and gamma radiation, penetration, deflection and nuclear equations",s:[
"Unstable nuclei, called {radioisotopes|isotopes only|ions|polymers}, become more stable by emitting radiation.",
"The three types of radiation emitted by radioisotopes are alpha, beta and {gamma|delta|epsilon|theta}.",
"An alpha particle consists of two protons and two {neutrons|electrons|positrons|nuclei}.",
"Alpha particles have a {double positive|single positive|single negative|zero} charge.",
"Alpha particles are stopped by {paper|thin aluminium|lead or concrete|nothing at all} and have a range of a few centimetres in air.",
"Alpha particles are attracted to the {negative|positive} plate in an electric field.",
"Beta particles are high-energy {electrons|protons|neutrons|helium nuclei} ejected from the nucleus.",
"Beta particles are stopped by {thin aluminium|paper|nothing|only thick lead} and are attracted to the {positive|negative} plate.",
"Gamma rays are {electromagnetic waves|particles|electrons|helium nuclei} emitted from the nucleus.",
"Gamma rays are stopped by {lead or concrete|paper|thin aluminium|skin} and are {not deflected|deflected to the positive plate|deflected to the negative plate|absorbed} by an electric field.",
"In a nuclear equation, an alpha particle is written as {⁴₂He|⁰₋₁e|¹₀n|¹₁p} and a beta particle as {⁰₋₁e|⁴₂He|¹₀n|¹₁p}.",
"A neutron is written ¹₀n and a proton is written {¹₁p|¹₀p|⁰₁p|¹₋₁p}.",
"In a nuclear equation, the sum of the atomic numbers and the sum of the {mass numbers|charges|neutrons|electrons} must be equal on both sides of the arrow.",
"When a nucleus emits an alpha particle, its mass number decreases by {4|2|1|0} and its atomic number decreases by {2|4|1|0}."]},

{t:"Half-life & Uses of Radioisotopes",l:"Half-life calculations, dating and the uses of radioisotopes",s:[
"The half-life of a radioisotope is the time taken for {half|all|a quarter|double} of its nuclei to decay.",
"The half-life of an isotope is {constant|variable|longer at higher temperature|shorter in a catalyst}.",
"Half-life is {unaffected|speeded up|slowed down|reversed} by chemical or physical conditions.",
"Half-life can be found from a {decay curve|periodic table|titration|pH scale}, which is a graph of activity against time.",
"After 1 half-life, {1/2|1/4|1/8|all} of the radioisotope remains.",
"After 3 half-lives, {1/8|1/3|1/6|1/4} of the radioisotope remains.",
"A sample of 80 g has a half-life of 2 days; after 6 days, the mass remaining is {10 g|20 g|40 g|0 g}.",
"If 25% of a radioisotope remains, {2|1|3|4} half-lives have passed.",
"Radioisotopes can be used to {date materials|neutralise acids|extract metals|make polymers}.",
"Radioisotopes have uses in medicine and {industry|only farming|only mining|only transport}.",
"The suitability of a radioisotope for a use depends on the type of radiation it emits and its {half-life|colour|density|melting point}.",
"A radioisotope used inside the body for diagnosis should have a {short|very long|infinite|zero} half-life."]},

{t:"Apparatus & Practical Techniques",l:"Common apparatus, filtration, gas collection, heating and preparing salts",s:[
"A {pipette with a safety filler|beaker|measuring cylinder|conical flask} is used to measure out a fixed volume of solution accurately.",
"A {burette|dropper|funnel|boiling tube} is used to add a solution drop by drop in a titration.",
"A {measuring cylinder|burette|pipette|thermometer} is used to measure approximate volumes of liquids.",
"An {evaporating basin|conical flask|funnel|delivery tube} is used to evaporate a solution to dryness.",
"A {delivery tube|dropper|filter paper|thermometer} carries a gas from a reaction vessel to be collected.",
"Simple filtration uses a funnel and filter paper to separate the {residue from the filtrate|solute from the solvent|gas from the liquid|two liquids}.",
"A balance is used to measure {mass|volume|temperature|concentration}.",
"Gases that are relatively insoluble in water can be collected {over water|by downward displacement of air only|by upward displacement of air only|in a beaker}.",
"A soluble gas that is less dense than air is collected by {downward displacement of air|upward displacement of air|collection over water|filtration}.",
"A soluble gas that is denser than air is collected by {upward displacement of air|downward displacement of air|collection over water|filtration}.",
"Heating is carried out using a Bunsen burner or an electric {hotplate|burette|balance|funnel}.",
"Soluble salts are prepared by reacting acids with metals, metal oxides, metal hydroxides and metal {carbonates|chlorides|nitrates|sulfates}.",
"The electrical conductivity of solids and solutions can be tested using a {circuit with a lamp or ammeter|burette|balance|thermometer}.",
"An electrochemical cell is set up using a salt bridge and metal or {carbon|plastic|glass|wood} electrodes."]},

{t:"Analytical Methods & Reporting",l:"Titration, flame tests, gas tests, precipitation and presenting results",s:[
"A titration accurately determines the {volumes|colours|smells|textures} needed to reach an end-point.",
"Titres that are within {0.2 cm³|1 cm³|5 cm³|10 cm³} of each other are concordant.",
"A standard solution is a solution of accurately known {concentration|colour|temperature|pH only}.",
"Flame tests are used to identify {metals|non-metals|gases only|polymers}.",
"The test for oxygen is that it {relights a glowing splint|burns with a pop|turns limewater milky|turns litmus red}.",
"The test for hydrogen is that it burns with a {pop|bright white light|yellow smoky flame|green flame}.",
"The test for carbon dioxide is that it turns {limewater milky|a glowing splint bright|litmus blue|bromine colourless}.",
"A precipitate is formed when two solutions react to form an {insoluble|soluble|gaseous|volatile} salt.",
"Solubility information from the {data booklet|periodic table only|pH scale|electrochemical series} can be used to predict whether a precipitate forms.",
"The formation of a precipitate can be used to identify a particular {ion|isotope|polymer|metal ore}.",
"Results should be presented in a table with appropriate headings and {units|colours|diagrams|equations}.",
"A bar graph, line graph or scatter graph needs suitable {scales and labels|colours only|decoration|captions only}.",
"A line of best fit, which may be straight or curved, shows the {trend|rogue points only|exact points|mean value only}.",
"Mean values are calculated by adding the results and dividing by the {number of results|largest result|smallest result|total mass}.",
"To suggest an improvement to a method, a change should be named and {justified|repeated|ignored|coloured}, for example repeating the experiment to improve reliability."]}
];

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let cur=0; const state=TOPICS.map(()=>({}));const order=TOPICS.map(t=>t.s.map(s=>[...s.matchAll(/\{([^}]+)\}/g)].map(m=>shuffle(m[1].split("|")))));
let checked=TOPICS.map(()=>false);

const UNITS=[["Chemical Changes and Structure",["Rates of Reaction","Atomic Structure & the Periodic Table","Covalent Bonding","Ionic Bonding","Chemical Formulae","Moles & Balanced Equations","pH & Acid-Base Properties","Neutralisation & Salts"]],["Nature's Chemistry",["Systematic Carbon Chemistry","Alkanes & Cycloalkanes","Alkenes","Alcohols","Carboxylic Acids","Energy from Fuels"]],["Chemistry in Society",["Metals & Reactivity","Redox & Extraction of Metals","Electrochemical Cells","Plastics","Fertilisers","Radiation & Nuclear Equations","Half-life & Uses of Radioisotopes","Apparatus & Practical Techniques","Analytical Methods & Reporting"]]];
const slug=t=>t.toLowerCase().replace(/[^a-z]+/g,"-");
const menu=document.getElementById("menu"),tv=document.getElementById("topicview");
function chips(){menu.innerHTML=UNITS.map(([u,ts])=>`<section class="unit"><h2>${u}</h2><div class="grid">${ts.map(name=>{const i=TOPICS.findIndex(t=>t.t===name),t=TOPICS[i];
 const n=t.s.join("").match(/\{/g).length,f=Object.values(state[i]).filter(Boolean).length;
 return `<button class="card" data-i="${i}"><b>${t.t}</b><span>${t.l}</span><em>${f}/${n} filled</em></button>`}).join("")}</div></section>`).join("")}
menu.onclick=e=>{const b=e.target.closest(".card");if(b)location.hash=slug(TOPICS[+b.dataset.i].t)};
document.getElementById("back").onclick=()=>{location.hash="";route()};
function route(){const i=TOPICS.findIndex(t=>slug(t.t)===location.hash.slice(1));
 const inTopic=i>=0;menu.hidden=inTopic;tv.hidden=!inTopic;sheet.hidden=!inTopic;
 if(inTopic){cur=i;render()}else chips();scrollTo(0,0)}
addEventListener("hashchange",route);

function render(){
 chips();const t=TOPICS[cur],st=state[cur];
 let html=`<h2>${t.t}</h2><p class="lead">${t.l}</p><ol>`;
 t.s.forEach((s,si)=>{let k=0;
  html+="<li>"+esc(s).replace(/\{([^}]+)\}/g,(m,g)=>{const ans=g.split("|")[0],id=`b${cur}-${si}-${k}`,opts=order[cur][si][k];k++;
   const v=st[id]||"";let cls="",fix="";
   if(checked[cur]&&v){cls=v===ans?"ok":"no"} if(checked[cur]&&v!==ans&&showAns.checked){fix=`<span class="fix">→ ${ans}</span>`;if(!v)cls="no"}
   return `<select id="${id}" class="${cls}" data-a="${esc(ans)}" aria-label="blank"><option value="">choose…</option>${opts.map(o=>`<option${o===v?" selected":""}>${o}</option>`).join("")}</select>${fix}`})+"</li>"});
 html+=`</ol><div class="bar"><button class="act" id="check">Check answers</button><button class="act ghost" id="reset">Reset topic</button><button class="act ghost" id="next">Next topic</button><span class="score" id="score"></span></div>`;
 sheet.innerHTML=html;
 sheet.querySelectorAll("select").forEach(s=>s.onchange=()=>{st[s.id]=s.value;s.className="";chips()});
 check.onclick=()=>{checked[cur]=true;render()};
 reset.onclick=()=>{state[cur]={};checked[cur]=false;order[cur]=t.s.map(s=>[...s.matchAll(/\{([^}]+)\}/g)].map(m=>shuffle(m[1].split("|"))));render()};
 next.onclick=()=>{location.hash=slug(TOPICS[(cur+1)%TOPICS.length].t)};
 if(checked[cur]){const all=[...sheet.querySelectorAll("select")],r=all.filter(s=>s.value===s.dataset.a).length;
  score.textContent=`${r} / ${all.length} correct`;try{const k='qsc:n5',o=JSON.parse(localStorage.getItem(k)||'{}'),p=Math.round(r/all.length*100);if(!(o[t.t]>=p)){o[t.t]=p;localStorage.setItem(k,JSON.stringify(o))}}catch(e){}}
}
const sheet=document.getElementById("sheet");
const showAns=document.createElement("input");showAns.type="checkbox";showAns.id="showans";
const lab=document.createElement("label");lab.className="opt";lab.append(showAns," Show correct answers when checking");
const tm=document.createElement("details");tm.className="teacher";
tm.innerHTML=`<summary>Teacher menu</summary><div class="tpanel"><button class="act" id="pgo">Present mode</button><small style="color:var(--muted)">Shows one statement at a time for a big screen. Use ← → to move, R to reveal, Esc to exit.</small></div>`;
tm.querySelector(".tpanel").append(lab);
tv.append(tm);tv.style.cssText="display:flex;flex-wrap:wrap;gap:14px;align-items:center";showAns.onchange=render;
// Present mode
const pv=document.createElement("div");pv.id="present";pv.hidden=true;
pv.innerHTML=`<div class="ptop"><span id="ptopic"></span><span id="pnum" style="font-variant-numeric:tabular-nums"></span></div><div id="pstmt"></div><div class="pbar"><button class="act ghost" id="pprev">← Previous</button><button class="act" id="preveal">Reveal answer</button><button class="act ghost" id="pnext">Next →</button><button class="act ghost" id="pexit">Exit</button></div>`;
document.body.append(pv);let pi=0;
function pshow(){const t=TOPICS[cur],s=t.s[pi];let k=0;
 ptopic.textContent=t.t;pnum.textContent=`${pi+1} / ${t.s.length}`;
 pstmt.innerHTML=esc(s).replace(/\{([^}]+)\}/g,(m,g)=>{const ans=g.split("|")[0],opts=order[cur][pi][k++];
  return `<select data-a="${esc(ans)}" aria-label="blank"><option value="">…………</option>${opts.map(o=>`<option>${o}</option>`).join("")}</select>`});
 pstmt.querySelectorAll("select").forEach(x=>x.onchange=()=>x.className=x.value?(x.value===x.dataset.a?"ok":"no"):"");
 pprev.disabled=pi===0;pnext.disabled=pi===t.s.length-1}
function preveal(){pstmt.querySelectorAll("select").forEach(x=>{x.value=x.dataset.a;x.className="ok"})}
function pexit(){pv.hidden=true;try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
pgo.onclick=()=>{tm.open=false;pi=0;pv.hidden=false;pshow();try{pv.requestFullscreen?.().catch(()=>{})}catch(e){}};
pprev.onclick=()=>{if(pi>0){pi--;pshow()}};pnext.onclick=()=>{if(pi<TOPICS[cur].s.length-1){pi++;pshow()}};
preveal.onclick=preveal;pexit.onclick=pexit;
addEventListener("keydown",e=>{if(pv.hidden||e.target.tagName==="SELECT")return;
 if(e.key==="ArrowRight")pnext.onclick();else if(e.key==="ArrowLeft")pprev.onclick();else if(e.key==="r"||e.key==="R")preveal();else if(e.key==="Escape")pexit()});
document.addEventListener("fullscreenchange",()=>{});
route();
</script>

<script src="../../shared/support.js" data-read-each="ol > li" data-focus="#score, #res, .result, .sc, .prog"></script>
</body></html>
