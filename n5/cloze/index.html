<script>
// Blanks: {answer|distractor|distractor...}
const TOPICS=[
{t:"Atoms",l:"Atomic structure, isotopes and the periodic table",s:[
"Elements in the periodic table are arranged in order of increasing {atomic number|mass number|relative atomic mass|reactivity}.",
"A {group|period|series|block} is a vertical column of elements; elements in it have the same number of {outer electrons|neutrons|protons|energy levels}.",
"Elements in the same group have similar {chemical|physical|nuclear|radioactive} properties.",
"Protons and neutrons are found in the {nucleus|energy levels|electron cloud|outer shell} of an atom.",
"Protons are {positively charged|negatively charged|neutral|doubly charged}, neutrons are {neutral|positively charged|negatively charged|doubly charged} and electrons are {negatively charged|positively charged|neutral|doubly charged}.",
"Protons and neutrons each have a mass of about {1 amu|0 amu|2 amu|1/2000 amu}; electrons have almost no mass.",
"The atomic number is the number of {protons|neutrons|electrons in the outer shell|protons plus neutrons} in an atom.",
"Atoms are neutral because they have equal numbers of protons and {electrons|neutrons|ions|isotopes}.",
"The mass number is the number of protons plus the number of {neutrons|electrons|isotopes|energy levels}.",
"For the first 20 elements, the first energy level holds up to {2|8|18|4} electrons and the second and third hold up to {8|2|18|6}.",
"Isotopes are atoms with the same atomic number but different {mass numbers|numbers of protons|numbers of electrons|chemical properties}.",
"Relative atomic mass is the {average|largest|smallest|total} mass of the isotopes of an element, so it is rarely a whole number.",
"Group 1 are the alkali metals, group 7 the {halogens|noble gases|transition metals|alkali earth metals} and group 0 the {noble gases|halogens|transition metals|alkali metals}."]},
{t:"Reactions",l:"Rates of reaction and energy changes",s:[
"Decreasing the {particle size|concentration|temperature|volume} of a reactant increases the rate, e.g. sawdust burns faster than a lump of wood.",
"Increasing the {concentration|particle size|volume of water|mass of product} of a reactant increases the rate of a reaction.",
"Milk goes sour faster at room temperature than in a fridge because increasing the {temperature|particle size|pH|volume} increases the rate.",
"A catalyst speeds up a reaction and can be {recovered chemically unchanged|used up completely|turned into a product|dissolved} at the end.",
"The progress of a reaction can be followed by measuring changes in volume of gas, {mass|colour of the flask|size of the beaker|catalyst}, concentration or pH.",
"Average rate = change in quantity ÷ {time taken|mass|temperature|volume}.",
"A suitable unit for the average rate of gas production is {cm³ s⁻¹|g cm³|mol l⁻¹|s cm⁻³}.",
"The rate of a reaction {decreases|increases|stays the same|doubles} as the reaction goes on.",
"In an {exothermic|endothermic|reversible|addition} reaction energy is released to the surroundings and the temperature rises.",
"In an {endothermic|exothermic|neutralisation|combustion} reaction energy is taken in from the surroundings and the temperature falls.",
"Combustion and neutralisation are examples of {exothermic|endothermic|addition|reduction} reactions."]},
{t:"Bonding",l:"Covalent, ionic and metallic bonding, molecular shape",s:[
"A covalent bond is a shared pair of {electrons|protons|neutrons|ions} between two {non-metal|metal|noble gas|transition metal} atoms.",
"In a covalent bond the atoms are held together by the attraction between the positive {nuclei|electrons|ions|neutrons} and the shared electrons.",
"Atoms form bonds to achieve a stable electron arrangement, like that of a {noble gas|halogen|alkali metal|transition metal}.",
"A {diatomic|monatomic|triatomic|network} molecule contains only two atoms joined by a covalent bond, e.g. H₂, O₂ and Cl₂.",
"The seven diatomic elements are hydrogen, nitrogen, oxygen, fluorine, chlorine, bromine and {iodine|carbon|sulfur|neon}.",
"Methane, CH₄, has a {tetrahedral|linear|angular|trigonal pyramidal} shape; ammonia, NH₃, is {trigonal pyramidal|tetrahedral|linear|angular}; water is {angular|linear|tetrahedral|trigonal pyramidal}.",
"Covalent substances form either discrete molecular or giant {network|lattice of ions|metallic|ionic} structures.",
"Diamond, graphite, silicon and silicon dioxide are examples of covalent {network|molecular|ionic|metallic} substances.",
"Metal atoms {lose|gain|share|keep} electrons to form positive ions; non-metal atoms {gain|lose|share|keep} electrons to form negative ions.",
"An ionic bond is the electrostatic attraction between {oppositely charged ions|shared electrons and nuclei|delocalised electrons and nuclei|neutral atoms}.",
"Ionic compounds form {lattice|molecular|diatomic|chain} structures of oppositely charged ions.",
"Metallic bonding is the attraction between positive metal ions and {delocalised electrons|negative ions|shared pairs of electrons|protons}."]},
{t:"Properties",l:"Linking structure and bonding to properties",s:[
"Metallic, ionic and covalent {network|molecular|diatomic|monatomic} substances usually have {high|low|very low|no} melting and boiling points.",
"Covalent molecular substances have {low|high|very high|no} melting and boiling points.",
"Covalent network substances have very high melting points because the network of strong {covalent bonds|intermolecular forces|ionic bonds|hydrogen atoms} takes a lot of energy to break.",
"Covalent molecular substances have low melting points because only the {weak forces between molecules|covalent bonds inside molecules|ionic bonds|metallic bonds} are broken.",
"Ionic compounds have high melting points because strong {ionic bonds|intermolecular forces|covalent bonds|metallic bonds} must be broken to break up the lattice.",
"Covalent molecular substances that are insoluble in water may dissolve in {other solvents|acids only|alkalis only|molten salt}.",
"When an ionic compound dissolves in water, the lattice breaks up and water molecules {surround the separated ions|form covalent bonds with the ions|turn into ions|stop the ions moving}.",
"An electric current is a flow of {charged particles|neutral atoms|molecules|neutrons}.",
"Metals conduct electricity because their {delocalised electrons|ions|protons|nuclei} are free to move.",
"Ionic compounds conduct only when {molten or in solution|solid|cooled|powdered}, because then the ions are free to move.",
"Covalent substances do not conduct because they have no {charged particles|atoms|bonds|electrons} that are free to move.",
"Ion migration experiments show ions moving towards the {oppositely charged electrode|same charged electrode|centre of the paper|power supply}, proving ions are charged."]},
{t:"Formula",l:"Chemical formulae and equations",s:[
"Compounds made of two elements usually end in {-ide|-ate|-ite|-ane}; endings -ite or -ate show that {oxygen|hydrogen|carbon|nitrogen} is also present.",
"The prefix di- means {2|1|3|4} atoms, tri- means {3|2|4|6} and tetra- means {4|3|5|6}.",
"So dinitrogen tetroxide has the formula {N₂O₄|N₄O₂|NO₂|N₂O₃}.",
"Valency is the number of {bonds an atom can form|protons in the nucleus|neutrons in the atom|energy levels}.",
"Using the SVS method, nitrogen hydride has the formula {NH₃|N₃H|NH|N₃H₃}.",
"In copper(II) chloride the Roman numeral shows that copper has a valency of {2|1|3|4}, giving CuCl₂.",
"Ions containing more than one type of atom are called {group ions|isotopes|diatomic ions|radicals}; their charges are in the data booklet.",
"The valency of the sulfate ion, SO₄²⁻, is {2|4|1|6}.",
"The ionic formula of potassium oxide is {(K⁺)₂O²⁻|K⁺(O²⁻)₂|K²⁺O⁻|KO₂}.",
"In formulae, charges must be {superscript|subscript|in brackets only|left out} and numbers of atoms must be {subscript|superscript|large|left out}.",
"The state symbol for a solution in water is {(aq)|(l)|(s)|(g)}.",
"A balanced equation has the same number of each type of {atom|molecule|compound|state symbol} on both sides, e.g. 2H₂ + O₂ → 2H₂O."]},
{t:"Metals",l:"Metallic bonding, reactions and extraction of metals",s:[
"Metallic bonding is the attraction between positive metal ions and a sea of {delocalised electrons|negative ions|protons|shared pairs}.",
"metal + water → metal {hydroxide|oxide|carbonate|chloride} + hydrogen",
"metal + dilute acid → salt + {hydrogen|water|carbon dioxide|oxygen}",
"metal + oxygen → metal {oxide|hydroxide|hydride|salt}",
"Metals can be arranged in order of reactivity by comparing the {rates|colours|masses|densities} at which they react.",
"Ores are naturally occurring {compounds|elements|mixtures of alloys|isotopes} of metals.",
"Very unreactive metals such as silver and gold are found {uncombined as elements|only as ores|only in seawater|as alloys} in the Earth's crust.",
"The more reactive a metal, the {more difficult|easier|cheaper|faster} it is to extract from its ore.",
"Silver, gold and mercury can be extracted by {heat alone|electrolysis|heating with carbon|adding water}.",
"Copper, lead, tin, iron and zinc are extracted by heating with {carbon or carbon monoxide|oxygen|water|hydrogen gas}.",
"Very reactive metals such as aluminium are extracted by {electrolysis|heat alone|heating with carbon|filtration}.",
"Soluble salts can be made by adding {excess metal|a little metal|water|an indicator} to an acid, filtering and evaporating the filtrate."]},
{t:"Arithmetic",l:"The mole, concentration and percentage composition",s:[
"The gram formula mass is found by adding the {relative atomic masses|atomic numbers|mass numbers|valencies} of the elements in the formula.",
"The gram formula mass is the mass of {1 mole|1 litre|1 atom|1 gram} of a substance.",
"mass = number of moles × {gram formula mass|concentration|volume|relative atomic mass}",
"Concentration is measured in {mol l⁻¹|g cm⁻³|kJ|cm³ s⁻¹}.",
"number of moles = concentration × {volume|mass|gram formula mass|time}",
"Volume must be in {litres|cm³|ml|grams}; to convert cm³ to litres, divide by {1000|100|10|60}.",
"Using a balanced equation, the mole {ratio|mass|volume|charge} lets you calculate the mass of one substance from the mass of another.",
"Percentage composition = (mass of element in formula ÷ {gram formula mass|atomic number|mass of the element|number of moles}) × 100."]},
{t:"Acids",l:"pH, neutralisation, titration and salts",s:[
"The pH scale indicates the concentration of {hydrogen ions|hydroxide ions only|water molecules|salt} and runs from below 0 to above 14.",
"Acids have a pH {below 7|above 7|of exactly 7|of 14}; alkalis have a pH {above 7|below 7|of 0|of exactly 7}.",
"Water dissociates: H₂O(ℓ) ⇌ H⁺(aq) + OH⁻(aq). The ⇌ symbol shows the reaction is {reversible|exothermic|fast|complete}.",
"In pure water, the concentrations of H⁺ and OH⁻ ions are {equal|zero|very high|different}.",
"Acids have a higher concentration of {H⁺|OH⁻|Na⁺|Cl⁻} ions than OH⁻ ions.",
"Diluting an acid {decreases|increases|does not change} [H⁺] and the pH {increases towards 7|decreases towards 0|stays the same|rises above 7}.",
"Diluting an alkali decreases [OH⁻] and the pH {decreases towards 7|increases towards 14|stays the same|falls below 7}.",
"Soluble non-metal oxides dissolve in water to form {acidic|alkaline|neutral|insoluble} solutions; soluble metal oxides form {alkaline|acidic|neutral|insoluble} solutions.",
"Bases neutralise acids; bases that dissolve in water are called {alkalis|salts|spectator ions|indicators}.",
"acid + metal carbonate → salt + water + {carbon dioxide|hydrogen|oxygen|carbon monoxide}",
"Hydrochloric acid makes {chlorides|sulfates|nitrates|chlorates}, sulfuric acid makes {sulfates|sulfides|chlorides|nitrates} and nitric acid makes {nitrates|nitrides|sulfates|chlorides}.",
"{Spectator ions|Group ions|Isotopes|Indicators} are unchanged during a reaction and can be left out of the equation.",
"With an insoluble base, {excess|a small amount of|no|dissolved} base is added, then the mixture is filtered and the filtrate evaporated.",
"A {standard solution|saturated solution|dilute solution|precipitate} is a solution of accurately known concentration.",
"In a titration, an {indicator|catalyst|electrolyte|ion bridge} shows the end-point; titres within {0.2 cm³|2 cm³|0.02 cm³|5 cm³} are concordant.",
"In a precipitation reaction, two solutions react to form an {insoluble|soluble|gaseous|acidic} salt."]},
{t:"Homologous Series",l:"Alkanes, cycloalkanes, alkenes and isomers",s:[
"A homologous series is a family of compounds with the same {general formula|molecular formula|boiling point|number of carbons} and similar chemical properties.",
"A hydrocarbon contains only {hydrogen and carbon|hydrogen and oxygen|carbon and oxygen|carbon, hydrogen and oxygen}.",
"A saturated compound contains only carbon–carbon {single|double|triple|ionic} bonds.",
"The general formula of the alkanes is {CₙH₂ₙ₊₂|CₙH₂ₙ|CₙH₂ₙ₋₂|CₙH₂ₙ₊₁OH}.",
"Cycloalkanes and alkenes share the general formula {CₙH₂ₙ|CₙH₂ₙ₊₂|CₙH₂ₙ₋₂|CₙH₂ₙ₊₁COOH}.",
"Cycloalkanes are {saturated|unsaturated|ionic|aromatic} and are used as fuels and {solvents|fertilisers|catalysts|electrolytes}.",
"The functional group in an alkene is the {C=C double bond|-OH group|-COOH group|C-C single bond}.",
"As molecules in a series get bigger, boiling points {increase|decrease|stay the same|fall to zero} because intermolecular forces get stronger.",
"Hydrocarbons in these series are {insoluble|very soluble|miscible|reactive} in water.",
"{Isomers|Isotopes|Monomers|Polymers} have the same molecular formula but different structural formulae.",
"Unsaturated compounds {quickly decolourise|turn blue|have no effect on|turn red} bromine solution.",
"Adding hydrogen to an alkene is called {hydrogenation|hydration|polymerisation|combustion} and forms an {alkane|alcohol|alkene|acid}.",
"Adding water to an alkene is called {hydration|hydrogenation|neutralisation|dehydration} and forms an {alcohol|alkane|acid|ester}.",
"Adding a halogen to an alkene forms a {dihaloalkane|haloalkene|salt|cycloalkane}."]},
{t:"Consumer Products",l:"Alcohols, carboxylic acids and energy from fuels",s:[
"Alcohols are used as fuels because they are highly flammable and burn with very {clean|smoky|cold|green} flames.",
"The functional group of the alcohols is the {hydroxyl, -OH|carboxyl, -COOH|C=C double bond|hydroxide ion}.",
"The general formula for straight-chain alcohols is {CₙH₂ₙ₊₁OH|CₙH₂ₙ|CₙH₂ₙ₊₁COOH|CₙH₂ₙ₊₂}.",
"Methanol, ethanol and propanol are {miscible|insoluble|immiscible|ionic} with water; solubility then {decreases|increases|stays the same} as size increases.",
"Complete combustion of an alcohol produces carbon dioxide and {water|hydrogen|carbon monoxide|oxygen}.",
"Vinegar is a solution of {ethanoic|methanoic|propanoic|citric} acid, used in cleaning because it is {non-toxic|very strong|alkaline|flammable}.",
"The functional group of the carboxylic acids is the {carboxyl, -COOH|hydroxyl, -OH|C=C double bond|carbonate ion}.",
"The general formula for carboxylic acids is {CₙH₂ₙ₊₁COOH|CₙH₂ₙ₊₁OH|CₙH₂ₙ|CₙH₂ₙ₊₂}.",
"Carboxylic acids are used to make preservatives, soaps and {medicines|fertilisers|plastics|fuels}.",
"Solutions of carboxylic acids have a pH {less than 7|greater than 7|of 7|of 14}.",
"Sodium hydroxide and ethanoic acid react to form sodium {ethanoate|ethanol|ethanide|ethoxide} and water.",
"In Eh = cmΔT, the specific heat capacity of water, c, is {4.18 kJ kg⁻¹ °C⁻¹|4.18 J g⁻¹|1 kJ kg⁻¹ °C⁻¹|418 kJ kg⁻¹ °C⁻¹}.",
"In Eh = cmΔT, m is the mass of {water (or liquid) heated, in kg|fuel burned, in g|the beaker|carbon dioxide made}."]},
{t:"Redox",l:"Oxidation, reduction, electrolysis and cells",s:[
"Oxidation is a {loss|gain|share|transfer to nuclei} of electrons; reduction is a {gain|loss|share|removal} of electrons.",
"Oxidation and reduction happen at the same time in a {redox|neutralisation|addition|nuclear} reaction.",
"In the electrochemical series, electrons flow through the wires from the metal {higher up|lower down|with more protons|that is heavier} to the one {lower down|higher up|nearest the bridge|that is lighter}.",
"The {further apart|closer together|heavier|more alike} two metals are in the electrochemical series, the bigger the voltage.",
"Zn(s) → Zn²⁺(aq) + 2e⁻ is an {oxidation|reduction|neutralisation|addition} reaction.",
"Cu²⁺(aq) + 2e⁻ → Cu(s) is a {reduction|oxidation|precipitation|combustion} reaction.",
"Only metals {above|below|next to|equal to} hydrogen in the electrochemical series react with dilute acid.",
"During extraction, metal ions are {reduced|oxidised|neutralised|precipitated} to form metal atoms.",
"Electrolysis is the decomposition of an ionic compound into its elements using {electricity|heat|a catalyst|water}.",
"A {d.c.|a.c.|battery-free|mains} supply must be used so that the products of electrolysis can be identified.",
"Positive ions gain electrons at the {negative|positive|neutral|reference} electrode.",
"An {electrolyte|indicator|isotope|ore} is a solution containing ions that conducts electricity.",
"An ion bridge (salt bridge) lets {ions|electrons|atoms|protons} move between half-cells to complete the circuit.",
"In cells involving non-metals, a {graphite|copper|iron|plastic} rod is used as the electrode."]},
{t:"Plastics",l:"Addition polymerisation",s:[
"Plastics are examples of {polymers|monomers|isotopes|alloys}.",
"Polymers are long-chain molecules made by joining many small molecules called {monomers|isomers|ions|catalysts}.",
"In addition polymerisation the monomers are {unsaturated|saturated|ionic|cyclic}, with a carbon–carbon double bond.",
"The names of addition polymers come from the name of the {monomer|catalyst|repeating unit's end-group|chain length}.",
"Propene forms the polymer {polypropene|propane|polypropane|polyethene}.",
"A {repeating unit|monomer|isomer|functional group} is the shortest section of polymer chain which, if repeated, would make the whole chain.",
"From the structure of a polymer, the {monomer|catalyst|product|isotope} or repeating unit can be drawn."]},
{t:"Fertilisers",l:"Nutrients, Haber and Ostwald processes",s:[
"Three essential elements for plant growth are nitrogen, phosphorus and {potassium|sodium|calcium|sulfur}.",
"Fertilisers restore essential elements to the soil and must be {soluble|insoluble|gaseous|acidic}.",
"Ammonia is a pungent, {colourless|green|brown|yellow} gas that dissolves in water to form an {alkaline|acidic|neutral|insoluble} solution.",
"ammonia solution + acid → an {ammonium salt|ammonia salt|nitrate gas|alkali} + water",
"The {Haber|Ostwald|Contact|Hall} process produces ammonia: N₂ + 3H₂ ⇌ 2NH₃.",
"The Haber process uses an {iron|platinum|nickel|copper} catalyst.",
"At low temperatures the reaction is too {slow|fast|dangerous|exothermic}; at high temperatures the {backward|forward|side|neutralisation} reaction dominates.",
"The {Ostwald|Haber|Contact|Hall} process uses ammonia, oxygen and water to make {nitric|sulfuric|hydrochloric|ethanoic} acid.",
"The Ostwald process uses a {platinum|iron|nickel|gold} catalyst."]},
{t:"Nuclear",l:"Radiation, nuclear equations and half-life",s:[
"Radioactive decay involves changes in the {nuclei|electrons|bonds|molecules} of atoms.",
"Alpha particles are {two protons and two neutrons|electrons from the nucleus|electromagnetic waves|single protons} and carry a {2+|1−|0|1+} charge.",
"Alpha particles are stopped by {paper|thin aluminium|thick lead|nothing}; beta particles by {thin aluminium|paper|air|thick concrete only}; gamma by {thick lead or concrete|paper|thin aluminium|skin}.",
"Beta particles are {electrons|protons|helium nuclei|neutrons} ejected from the nucleus and are attracted to a {positively|negatively} charged plate.",
"Gamma rays are {not deflected|deflected towards the positive plate|deflected towards the negative plate|stopped} by an electric field.",
"In nuclear equations, an alpha particle is written as {⁴₂He|⁰₋₁e|¹₁p|¹₀n} and a beta particle as {⁰₋₁e|⁴₂He|¹₀n|¹₁p}.",
"In a nuclear equation, the atomic numbers and the {mass numbers|charges|numbers of electrons|half-lives} on each side must add up to the same total.",
"Half-life is the time for {half|all|a quarter|twice} of the nuclei of an isotope to decay.",
"Half-life is {unaffected|speeded up|slowed down|reversed} by temperature or a catalyst.",
"After 3 half-lives, {1/8|1/3|1/6|1/4} of the radioisotope remains.",
"The suitability of an isotope for a use depends on the type of radiation emitted and its {half-life|colour|density|melting point}."]}
];

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let cur=0; const state=TOPICS.map(()=>({}));const order=TOPICS.map(t=>t.s.map(s=>[...s.matchAll(/\{([^}]+)\}/g)].map(m=>shuffle(m[1].split("|")))));
let checked=TOPICS.map(()=>false);

const UNITS=[["Chemical Changes and Structure",["Reactions","Atoms","Bonding","Properties","Formula","Arithmetic","Acids"]],["Nature's Chemistry",["Homologous Series","Consumer Products"]],["Chemistry in Society",["Metals","Redox","Plastics","Fertilisers","Nuclear"]]];
const slug=t=>t.toLowerCase().replace(/[^a-z]+/g,"-");
const menu=document.getElementById("menu"),tv=document.getElementById("topicview");
function chips(){menu.innerHTML=UNITS.map(([u,ts])=>`<section class="unit"><h2>${u}</h2><div class="grid">${ts.map(name=>{const i=TOPICS.findIndex(t=>t.t===name),t=TOPICS[i];
 const n=t.s.join("").match(/\{/g).length,f=Object.values(state[i]).filter(Boolean).length;
 return `<button class="card" data-i="${i}"><b>${t.t}</b><span>${t.l}</span><em>${f}/${n} filled</em></button>`}).join("")}</div></section>`).join("")}
menu.onclick=e=>{const b=e.target.closest(".card");if(b)location.hash=slug(TOPICS[+b.dataset.i].t)};
document.getElementById("back").onclick=()=>{location.hash="";route()};
function route(){const i=TOPICS.findIndex(t=>slug(t.t)===location.hash.slice(1));
 const inTopic=i>=0;menu.hidden=inTopic;tv.hidden=!inTopic;sheet.hidden=!inTopic;
 if(inTopic){cur=i;render()}else chips();scrollTo(0,0)}
addEventListener("hashchange",route);

function render(){
 chips();const t=TOPICS[cur],st=state[cur];
 let html=`<h2>${t.t}</h2><p class="lead">${t.l}</p><ol>`;
 t.s.forEach((s,si)=>{let k=0;
  html+="<li>"+esc(s).replace(/\{([^}]+)\}/g,(m,g)=>{const ans=g.split("|")[0],id=`b${cur}-${si}-${k}`,opts=order[cur][si][k];k++;
   const v=st[id]||"";let cls="",fix="";
   if(checked[cur]&&v){cls=v===ans?"ok":"no"} if(checked[cur]&&v!==ans&&showAns.checked){fix=`<span class="fix">→ ${ans}</span>`;if(!v)cls="no"}
   return `<select id="${id}" class="${cls}" data-a="${esc(ans)}" aria-label="blank"><option value="">choose…</option>${opts.map(o=>`<option${o===v?" selected":""}>${o}</option>`).join("")}</select>${fix}`})+"</li>"});
 html+=`</ol><div class="bar"><button class="act" id="check">Check answers</button><button class="act ghost" id="reset">Reset topic</button><button class="act ghost" id="next">Next topic</button><span class="score" id="score"></span></div>`;
 sheet.innerHTML=html;
 sheet.querySelectorAll("select").forEach(s=>s.onchange=()=>{st[s.id]=s.value;s.className="";chips()});
 check.onclick=()=>{checked[cur]=true;render()};
 reset.onclick=()=>{state[cur]={};checked[cur]=false;order[cur]=t.s.map(s=>[...s.matchAll(/\{([^}]+)\}/g)].map(m=>shuffle(m[1].split("|"))));render()};
 next.onclick=()=>{location.hash=slug(TOPICS[(cur+1)%TOPICS.length].t)};
 if(checked[cur]){const all=[...sheet.querySelectorAll("select")],r=all.filter(s=>s.value===s.dataset.a).length;
  score.textContent=`${r} / ${all.length} correct`;try{const k='qsc:n5',o=JSON.parse(localStorage.getItem(k)||'{}'),p=Math.round(r/all.length*100);if(!(o[t.t]>=p)){o[t.t]=p;localStorage.setItem(k,JSON.stringify(o))}}catch(e){}}
}
const sheet=document.getElementById("sheet");
const showAns=document.createElement("input");showAns.type="checkbox";showAns.id="showans";
const lab=document.createElement("label");lab.className="opt";lab.append(showAns," Show correct answers when checking");
const tm=document.createElement("details");tm.className="teacher";
tm.innerHTML=`<summary>Teacher menu</summary><div class="tpanel"><button class="act" id="pgo">Present mode</button><small style="color:var(--muted)">Shows one statement at a time for a big screen. Use ← → to move, R to reveal, Esc to exit.</small></div>`;
tm.querySelector(".tpanel").append(lab);
tv.append(tm);tv.style.cssText="display:flex;flex-wrap:wrap;gap:14px;align-items:center";showAns.onchange=render;
// Present mode
const pv=document.createElement("div");pv.id="present";pv.hidden=true;
pv.innerHTML=`<div class="ptop"><span id="ptopic"></span><span id="pnum" style="font-variant-numeric:tabular-nums"></span></div><div id="pstmt"></div><div class="pbar"><button class="act ghost" id="pprev">← Previous</button><button class="act" id="preveal">Reveal answer</button><button class="act ghost" id="pnext">Next →</button><button class="act ghost" id="pexit">Exit</button></div>`;
document.body.append(pv);let pi=0;
function pshow(){const t=TOPICS[cur],s=t.s[pi];let k=0;
 ptopic.textContent=t.t;pnum.textContent=`${pi+1} / ${t.s.length}`;
 pstmt.innerHTML=esc(s).replace(/\{([^}]+)\}/g,(m,g)=>{const ans=g.split("|")[0],opts=order[cur][pi][k++];
  return `<select data-a="${esc(ans)}" aria-label="blank"><option value="">…………</option>${opts.map(o=>`<option>${o}</option>`).join("")}</select>`});
 pstmt.querySelectorAll("select").forEach(x=>x.onchange=()=>x.className=x.value?(x.value===x.dataset.a?"ok":"no"):"");
 pprev.disabled=pi===0;pnext.disabled=pi===t.s.length-1}
function preveal(){pstmt.querySelectorAll("select").forEach(x=>{x.value=x.dataset.a;x.className="ok"})}
function pexit(){pv.hidden=true;try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
pgo.onclick=()=>{tm.open=false;pi=0;pv.hidden=false;pshow();try{pv.requestFullscreen?.().catch(()=>{})}catch(e){}};
pprev.onclick=()=>{if(pi>0){pi--;pshow()}};pnext.onclick=()=>{if(pi<TOPICS[cur].s.length-1){pi++;pshow()}};
preveal.onclick=preveal;pexit.onclick=pexit;
addEventListener("keydown",e=>{if(pv.hidden||e.target.tagName==="SELECT")return;
 if(e.key==="ArrowRight")pnext.onclick();else if(e.key==="ArrowLeft")pprev.onclick();else if(e.key==="r"||e.key==="R")preveal();else if(e.key==="Escape")pexit()});
document.addEventListener("fullscreenchange",()=>{});
route();
</script>

<script src="../../shared/support.js" data-read-each="ol > li" data-focus="#score, #res, .result, .sc, .prog"></script>
</body></html>
